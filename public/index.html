aktunya singkat; rencanakan jadwal."],["<b>Langit mendung<\/b>","Lembut dan merata, 6500 K atau lebih.","Kontras rendah; mudah dikerjakan."],["<b>LED panel<\/b>","Dingin saat dipakai, hemat daya, intensitas dan warna biasanya dapat diatur.","LED murah atau dimmer tertentu dapat menimbulkan flicker."],["<b>Bohlam LED rumah<\/b>","Praktis, tetapi kualitas dan suhu warna bervariasi.","Cek label Kelvin; rawan flicker (lihat Modul 1)."],["<b>Tungsten<\/b>","Hangat, sekitar 3200 K, sangat panas.","Butuh daya besar; risiko panas dan listrik."],["<b>Fluorescent<\/b>","Warna cenderung kehijauan, berkedip 100 kali per detik di 50 Hz.","Sumber utama flicker di ruangan."]]},{"type":"callout","kind":"penting","tag":"Di sekolah kita","html":"<p>GVM 800D (panel LED) menjadi sumber utama praktik, sedangkan bohlam LED Philips 30 W dengan socket E27 berperan sebagai lampu bantu atau practical di dalam adegan. <b>Cek label daya dan mode warna GVM serta label Kelvin bohlam sebelum praktik.<\/b><\/p>"},{"type":"cek","ids":["C21","C22","C23"]}]},"b3":{"blocks":[{"type":"tebak","ids":["T3"]},{"type":"html","html":"<p class=\"lead\">Pola dasar yang dipakai untuk memberi dimensi pada subjek dengan tiga peran lampu. Kuncinya bukan jumlah lampu, melainkan peran tiap cahaya.<\/p>"},{"type":"svg","svg":"<div class=\"tp\" role=\"img\" aria-label=\"Diagram three-point lighting: key, fill, back, subjek, kamera\"><div class=\"line\" style=\"left:14%;top:30%;width:38%;background:var(--amber);transform:rotate(25deg)\"><\/div><div class=\"line\" style=\"left:48%;top:60%;width:38%;background:var(--blue);transform:rotate(-25deg)\"><\/div><div class=\"line\" style=\"left:50%;top:20%;width:5%;background:var(--green);transform:rotate(90deg)\"><\/div><div class=\"lamp key\">Key<\/div><div class=\"lamp fill\">Fill<\/div><div class=\"lamp back\">Back<\/div><div class=\"subj\"><\/div><div class=\"head\"><\/div><div class=\"cam\">Kamera<\/div><\/div>"},{"type":"table","head":["Lampu","Fungsi","Penempatan umum"],"rows":[["<b>Key light<\/b>","Cahaya utama; membentuk wajah dan menentukan eksposur.","Sekitar 45° dari kamera, sedikit di atas level mata."],["<b>Fill light<\/b>","Melunakkan bayangan yang dibuat key; mengatur kontras.","Sisi berlawanan dari key, lebih redup dari key."],["<b>Back light<\/b>","Memisahkan subjek dari latar lewat tepi cahaya di rambut dan bahu.","Di belakang subjek, agak tinggi, di luar bingkai."]]},{"type":"html","html":"<p>Perbandingan terang key terhadap fill disebut <b>rasio cahaya<\/b>. Selisih satu stop berkisar 2:1, dua stop 4:1, tiga stop 8:1. Rasio kecil menghasilkan gambar cerah dan rendah kontras (<b>high-key<\/b>), sedangkan rasio besar menghasilkan gambar gelap dan dramatis (<b>low-key<\/b>).<\/p>"},{"type":"callout","kind":"penting","tag":"Di sekolah kita","html":"<p>Sekolah memiliki dua GVM 800D dan dua light stand, jadi tiga titik disusun dengan <b>dua lampu dan satu reflector<\/b>: GVM pertama sebagai key, GVM kedua sebagai back light, dan reflector putih memantulkan cahaya key sebagai fill. Pendekatan hemat ini juga mengurangi beban listrik dan jumlah kabel.<\/p>"},{"type":"callout","kind":"waspada","tag":"Catatan greenscreen","html":"<p>Terangi layar hijau secara merata dan terpisah dari cahaya subjek, lalu jauhkan subjek sekitar <b>1,5 sampai 2 meter<\/b> dari layar agar cahaya hijau tidak memantul ke tepi subjek (spill).<\/p>"},{"type":"cek","ids":["C31","C32","C33"]}]},"b4":{"blocks":[{"type":"tebak","ids":["T4"]},{"type":"table","head":["Alat","Fungsi","Contoh pemakaian"],"rows":[["<b>Reflector<\/b>","Memantulkan cahaya untuk mengisi bayangan.","Fill dari satu lampu key; di luar ruangan memantulkan matahari."],["<b>Diffuser<\/b>","Melembutkan cahaya dengan memperbesar sumber efektif.","Kain putih tipis di depan lampu; letakkan dengan jarak agar aman."],["<b>Flag / negative fill<\/b>","Menahan cahaya agar tidak jatuh ke area tertentu atau memperdalam bayangan.","Karton atau latar hitam di sisi subjek."],["<b>Gel CTO / CTB<\/b>","Mengubah warna cahaya untuk menyamakan sumber.","CTB pada tungsten mendekati daylight; CTO pada daylight mendekati tungsten."]]},{"type":"callout","kind":"penting","tag":"Di sekolah kita","html":"<p>Dua reflector dan set CTO-CTB sudah tersedia. Background hitam 2 × 4 m dapat berfungsi sebagai negative fill, dan background putih sebagai bidang pantul. Diffuser belum ada dalam daftar; kain putih tipis bisa menjadi pengganti sementara.<\/p>"},{"type":"cek","ids":["C41","C42"]}]},"b5":{"blocks":[{"type":"tebak","ids":["T5"]},{"type":"table","head":["Jarak lampu ke subjek","Cahaya yang diterima","Selisih eksposur"],"rows":[["1 m","100%","Acuan"],["2 m","25%","Turun 2 stop"],["3 m","Sekitar 11%","Turun sekitar 3 stop"],["4 m","Sekitar 6%","Turun 4 stop"]]},{"type":"callout","kind":"waspada","tag":"Konsekuensi kedua","html":"<p>Menggeser lampu juga mengubah <b>kualitas<\/b> cahaya. Sumber kecil yang makin jauh menghasilkan cahaya yang makin keras, sedangkan sumber yang didekatkan menjadi lebih lembut. Karena itu, bila kualitas cahaya sudah pas, atur intensitas lewat pengatur daya (dimmer) agar karakter cahaya tidak berubah.<\/p>"},{"type":"cek","ids":["C51","C52"]}]},"b6":{"blocks":[{"type":"tebak","ids":["T6"]},{"type":"table","head":["Risiko","Pencegahan"],"rows":[["Terminal kelebihan beban","Jumlahkan watt semua lampu, ubah ke ampere (<b>A = W : 220 V<\/b>), dan bandingkan dengan kapasitas terminal. Jangan menyusun terminal bertingkat."],["Kabel rol tergulung memanas","Urai kabel rol sepenuhnya sebelum dipakai untuk beban besar."],["Kabel di jalur lalu lintas","Rapikan di tepi, tutup dengan lakban atau cable protector, dan arahkan menjauhi jalur jalan."],["Light stand jatuh","Pastikan kaki terbuka penuh dan beri pemberat (sandbag) pada stand yang tinggi."],["Panas lampu dan sentuhan","Beri jarak dari kain dan benda mudah terbakar; jangan menutup lampu dengan kain rapat."],["Pindah posisi saat lampu menyala","Matikan atau kurangi daya sebelum memindahkan lampu; nyalakan bertahap, satu per satu."]]},{"type":"callout","kind":"penting","tag":"Di sekolah kita","html":"<p>Kabel rol 15 meter, dua terminal 6 lubang, dan lakban hitam sudah ada, tetapi belum ada sandbag dan cable protector. Lakban hitam biasa dapat dipakai sementara, namun meninggalkan residu dan kurang kokoh untuk jalur yang sering dilewati.<\/p>"},{"type":"html","html":"<h2>Alur keputusan tata cahaya<\/h2>"},{"type":"steps","items":[{"title":"Tujuan","desc":"Suasana apa yang diinginkan (cerah, dramatis, natural)?"},{"title":"Sumber","desc":"Cahaya apa yang tersedia, dan seperti apa karakternya?"},{"title":"Key","desc":"Tempatkan dulu, lalu atur intensitas dan kualitasnya."},{"title":"Fill","desc":"Isi bayangan dengan reflector atau lampu kedua sesuai kontras yang diinginkan."},{"title":"Back light","desc":"Pastikan subjek terpisah dari latar."},{"title":"Warna","desc":"Samakan sumber (gel atau white balance) dan cek Kelvin."},{"title":"Keselamatan","desc":"Hitung beban, rapikan kabel, amankan stand, lalu nyalakan bertahap."}]},{"type":"cek","ids":["C61","C62","C63"]}]},"latihan":{"blocks":[{"type":"callout","kind":"penting","tag":"Strategi menjawab","html":"<ol><li><b>Garisbawahi kendala di soal<\/b>, misalnya \"tanpa merusak gerak natural\" atau \"daya terbatas\". Kalimat itulah yang menentukan jawaban.<\/li><li><b>Tebak penyebabnya dulu<\/b> sebelum membaca pilihan. Cocokkan dengan alur keputusan tata cahaya.<\/li><li><b>Coret pilihan sambil menyebut alasan<\/b>, misalnya \"ini melanggar K3\". Jawaban yang memperbaiki gejala tetapi merusak tujuan atau melanggar K3 adalah jebakan.<\/li><li>Pilihan majemuk dan benar-salah: <b>nilai tiap pernyataan sendiri-sendiri.<\/b><\/li><\/ol>"},{"type":"qlist","ids":["S1","S2","S3","S4"]}]},"cek":{"blocks":[{"type":"callout","kind":"penting","tag":"Cara mengerjakan","html":"Kerjakan tanpa membuka bagian lain. Tiap soal bernilai 1 poin; soal pilihan majemuk dan benar-salah bernilai 1 hanya jika <b>semua pernyataan<\/b> tepat. Pembahasan terbuka setelah ketiga soal dikunci."},{"type":"qlist","ids":["L1","L2","L3"]}]},"praktik":{"blocks":[{"type":"panel","html":"<b>Yang disiapkan:<\/b> 2 GVM 800D, 2 light stand, 2 reflector, set CTO-CTB, background hitam atau putih + clamp, kamera praktik + tripod Takara, Feelworld 7\". Kemajuan: <span data-praktik-pct>0<\/span>."},{"type":"callout","kind":"waspada","tag":"Keselamatan","html":"<ul><li>Praktik 4 selalu dipandu fasilitator.<\/li><li>Jangan menyentuh kabel bertegangan, terminal yang hangat, atau lampu yang baru dimatikan.<\/li><li>Jangan memasang lampu pada stand tanpa memastikan kakinya terbuka penuh.<\/li><\/ul>"},{"type":"html","html":"<h2>Praktik 1 · Empat atribut cahaya <span class=\"small\">(10 menit)<\/span><\/h2><p>Letakkan model di depan background; kunci eksposur kamera. Sinari dari depan, lalu samping (45° dan 90°), lalu belakang-atas. Pada posisi samping, bandingkan jarak 1 m dan 3 m. Amati ketegasan tepi bayangan.<\/p>"},{"type":"checklist","items":[{"id":"pa1","text":"Model dan background sudah ditata"},{"id":"pa2","text":"Kamera dikunci eksposurnya"},{"id":"pa3","text":"Merekam dari empat arah cahaya"},{"id":"pa4","text":"Membandingkan jarak 1 m dan 3 m"}]},{"type":"html","html":"<textarea data-note=\"pa_r\" placeholder=\"Arah mana yang paling datar, paling dramatis, dan paling memisahkan model dari latar? Mengapa tepi bayangan berubah saat jarak berubah?\"><\/textarea>"},{"type":"html","html":"<h2>Praktik 2 · Tiga titik dengan dua lampu dan satu reflector <span class=\"small\">(20 menit)<\/span><\/h2><p>GVM pertama sebagai key (45° dari kamera, sedikit di atas mata). Reflector di sisi berlawanan memantulkan cahaya key sebagai fill. GVM kedua sebagai back light di belakang-atas model, di luar bingkai. Periksa Feelworld atau histogram; pastikan wajah tidak clipping. Bandingkan hasil tanpa fill, dengan reflector.<\/p>"},{"type":"checklist","items":[{"id":"pb1","text":"Key terpasang di posisi yang tepat"},{"id":"pb2","text":"Reflector memantulkan key sebagai fill"},{"id":"pb3","text":"Back light terpasang di belakang-atas"},{"id":"pb4","text":"Membandingkan hasil dengan dan tanpa fill"}]},{"type":"html","html":"<textarea data-note=\"pb_r\" placeholder=\"Mengapa reflector bisa menggantikan lampu fill? Apa untungnya bagi daya listrik dan kabel? Kapan back light justru mengganggu?\"><\/textarea>"},{"type":"html","html":"<h2>Praktik 3 · Jarak dan intensitas <span class=\"small\">(10 menit)<\/span><\/h2><p>Kunci pengaturan kamera (shutter 1/50, aperture tetap, ISO tetap). Letakkan lampu 1 m dari model, catat kecerahan wajah. Geser ke 2 m, lalu 4 m. Prediksikan dulu turunnya berapa stop.<\/p>"},{"type":"checklist","items":[{"id":"pc1","text":"Kamera dikunci"},{"id":"pc2","text":"Mengukur pada 1 m, 2 m, dan 4 m"},{"id":"pc3","text":"Prediksi ditulis sebelum mengukur"},{"id":"pc4","text":"Membandingkan hasil dengan prediksi"}]},{"type":"html","html":"<textarea data-note=\"pc_r\" placeholder=\"Bagaimana menjaga eksposur ketika lampu terpaksa dijauhkan? Apa yang berubah pada kualitas bayangan?\"><\/textarea>"},{"type":"html","html":"<h2>Praktik 4 · Audit K3 set <span class=\"small\">(10 menit)<\/span><\/h2><p>Dipandu fasilitator. Baca label daya (watt) tiap lampu, isi lembar hitung beban, hitung total watt dan ampere (A = W : 220 V). Bandingkan dengan kapasitas terminal dan kabel rol. Urai kabel rol, rancang jalur, amankan dengan lakban. Nyalakan satu per satu.<\/p>"},{"type":"checklist","items":[{"id":"pd1","text":"Label daya tiap lampu sudah dibaca"},{"id":"pd2","text":"Lembar hitung beban sudah diisi"},{"id":"pd3","text":"Kabel rol diurai dan jalur dirancang"},{"id":"pd4","text":"Lampu dinyalakan bertahap, satu per satu"}]},{"type":"table","head":["Lampu","Daya (W)","Jumlah","Total (W)"],"rows":[["GVM 800D","<input type=\"text\" data-note=\"gvm_w\" placeholder=\"dari label\">","2","<input type=\"text\" data-note=\"gvm_t\" placeholder=\"\">"],["Bohlam LED Philips 30 W","30","2","60"],["<b>Total beban<\/b>","","","<input type=\"text\" data-note=\"total_w\" placeholder=\"... W\"> = <input type=\"text\" data-note=\"total_a\" placeholder=\"... A\">"]]},{"type":"html","html":"<textarea data-note=\"pd_r\" placeholder=\"Apa risiko jika kabel rol tetap tergulung atau terminal ditumpuk? Apa solusi yang tidak menghentikan produksi?\"><\/textarea>"}]},"kartu":{"blocks":[{"type":"html","html":"<p class=\"lead\">Gejala, penyebab, dan solusi yang tidak merusak tujuan estetika. Kartu ini dipakai lagi di Modul 6.<\/p>"},{"type":"cards","items":[{"title":"Wajah datar, menyatu dengan latar","penyebab":"Cahaya dari depan saja, tanpa back light","solusi":"Key sekitar 45°, tambah back light dan fill (reflector)"},{"title":"Bayangan keras di wajah","penyebab":"Sumber kecil atau jauh, tanpa diffuser","solusi":"Diffuser, dekatkan sumber, reflector sebagai fill"},{"title":"Warna kuning atau biru merata","penyebab":"White balance tidak cocok dengan sumber","solusi":"WB manual atau preset yang sesuai, atau gel CTB/CTO"},{"title":"Warna beda di area berbeda","penyebab":"Cahaya campuran","solusi":"Seragamkan sumber atau pasang gel pada salah satu sumber"},{"title":"Lampu berkedip atau pita gelap","penyebab":"Shutter tidak selaras dengan listrik 50 Hz","solusi":"Shutter 1/50 atau 1/100, atau lampu flicker-free"},{"title":"Terminal hangat, kabel melintang","penyebab":"Kelebihan beban dan jalur kabel","solusi":"Hitung beban, urai kabel rol, rapikan jalur, beri pemberat stand"}]},{"type":"html","html":"<h2>Alur 7 langkah tata cahaya<\/h2>"},{"type":"steps","items":[{"title":"Tujuan"},{"title":"Sumber"},{"title":"Key"},{"title":"Fill"},{"title":"Back light"},{"title":"Warna"},{"title":"Keselamatan"}]},{"type":"two","items":[{"cls":"g","html":"<b>Ingat kuadrat terbalik<\/b><br>Jarak ×2 = cahaya ÷4 (turun 2 stop)"},{"cls":"g","html":"<b>Ingat rasio<\/b><br>2:1 = 1 stop · 4:1 = 2 stop · 8:1 = 3 stop"}]}]}}},{"meta":{"id":3,"storageKey":"fke-modul3-mandiri-v1","topKick":"Modul 3","kicker":"Modul 3 · Persiapan TKA 2026 · Belajar mandiri","title":"Komposisi, Lensa, Shot Size, dan Camera Angle","intro":"Menentukan apa yang masuk ke bingkai dan dari mana kamera melihatnya. Inti sub-elemen Tata Kamera.","chips":[{"label":"Memahami","color":"#ffb454"},{"label":"Menerapkan","color":"#7cc0ff"},{"label":"Menalar","color":"#7fe0a8"}],"howto":["<b>1. Tebak dulu, baru baca.<\/b> Tiap bagian dibuka dengan kotak <span class=\"small\">Tebak dulu<\/span>.","<b>2. Cek paham.<\/b> Setelah penjelasan, jawab kotak <span class=\"small\">Cek paham<\/span>.","<b>3. Praktik.<\/b> Empat praktik dengan gear sekolah ada di bagian akhir."],"objectives":["<b>Memahami:<\/b> menyebutkan shot size dan camera angle beserta fungsi naratifnya; menjelaskan pengaruh lensa.","<b>Menerapkan:<\/b> rule of thirds, headroom, lead room, framing; memilih lensa sesuai kondisi.","<b>Menalar:<\/b> menganalisis anomali visual dan memilih kombinasi shot size, angle, dan lensa sesuai tujuan naratif."]},"sections":[{"id":"mulai","nav":"Mulai","title":"Komposisi, Lensa, Shot Size, dan Camera Angle"},{"id":"b1","nav":"Bagian 1","title":"Komposisi dan framing","time":"15 menit"},{"id":"b2","nav":"Bagian 2","title":"Lensa dan perspektif","time":"20 menit"},{"id":"b3","nav":"Bagian 3","title":"Shot size","time":"20 menit"},{"id":"b4","nav":"Bagian 4","title":"Camera angle","time":"20 menit"},{"id":"b5","nav":"Bagian 5","title":"Anomali visual","time":"15 menit"},{"id":"b6","nav":"Bagian 6","title":"Format bingkai dan safe area","time":"10 menit"},{"id":"latihan","nav":"Latihan","title":"Latihan soal bergaya TKA","time":"25 menit"},{"id":"cek","nav":"Cek akhir","title":"Uji dirimu sendiri","time":"10 menit"},{"id":"praktik","nav":"Praktik","title":"Praktik dengan gear sekolah","time":"50 menit"},{"id":"kartu","nav":"Kartu","title":"Kartu diagnosis bahasa visual"}],"sectionQuestions":{"b1":["T1","C11","C12"],"b2":["T2","C21","C22","C23"],"b3":["T3","C31","C32","C33"],"b4":["T4","C41","C42","C43"],"b5":["T5","C51","C52"],"b6":["T6","C61"],"latihan":["S1","S2","S3","S4"],"cek":["L1","L2","L3"]},"praktikChecks":["pa1","pa2","pa3","pa4","pb1","pb2","pb3","pb4","pc1","pc2","pc3","pc4","pd1","pd2","pd3","pd4"],"labs":{},"questions":[{"id":"T1","kind":"pick","label":"T1","stem":"Subjek harus selalu di tengah bingkai. Benar atau salah?","bare":true,"opts":[["Benar"],["Salah",1]],"explain":"Salah. Tengah efektif untuk kesan formal; sepertiga lebih dinamis. Pilih sesuai tujuan."},{"id":"T2","kind":"pick","label":"T2","stem":"Perspektif ditentukan oleh lensa saja. Benar atau salah?","bare":true,"opts":[["Benar"],["Salah",1]],"explain":"Salah. Perspektif ditentukan jarak kamera; lensa mengubah ukuran subjek dan kemampatan."},{"id":"T3","kind":"pick","label":"T3","stem":"Medium close-up menampilkan subjek dari...","bare":true,"opts":[["Kepala sampai kaki"],["Dada ke atas",1],["Pinggang ke atas"]],"explain":"MCU dari dada ke atas. MS dari pinggang ke atas. LS seluruh tubuh."},{"id":"T4","kind":"pick","label":"T4","stem":"Low angle cenderung membuat subjek tampak...","bare":true,"opts":[["Lemah"],["Kuat dan berkuasa",1],["Netral"]],"explain":"Low angle memberi kesan subjek besar atau kuat. High angle kebalikannya."},{"id":"T5","kind":"pick","label":"T5","stem":"Subjek yang menghadap kanan sebaiknya ditempatkan di...","bare":true,"opts":[["Tepi kanan bingkai"],["Tepi kiri dengan lead room di kanan",1],["Tengah bingkai"]],"explain":"Beri lead room di sisi arah hadap. Subjek tidak terdesak ke tepi."},{"id":"T6","kind":"pick","label":"T6","stem":"Untuk Reels atau TikTok, format bingkai yang tepat adalah...","bare":true,"opts":[["16:9"],["9:16",1],["1:1"]],"explain":"Konten vertikal memakai 9:16. 16:9 untuk siaran TV dan YouTube."},{"id":"C11","kind":"pick","label":"1.1","stem":"Rule of thirds membagi bingkai menjadi...","bare":true,"opts":[["2 × 2"],["3 × 3",1],["4 × 4"]],"explain":"Bingkai dibagi 3 × 3. Subjek atau mata ditempatkan di garis atau persimpangan."},{"id":"C12","kind":"pick","label":"1.2","stem":"Ruang kosong di depan arah hadap subjek disebut...","bare":true,"opts":[["Headroom"],["Lead room",1],["Safe area"]],"explain":"Lead room atau nose room adalah ruang di depan arah hadap."},{"id":"C21","kind":"pick","label":"2.1","stem":"Lensa tele membuat latar tampak...","bare":true,"opts":[["Lebih jauh"],["Lebih dekat dengan subjek",1],["Sama saja"]],"explain":"Tele memampatkan ruang sehingga latar tampak lebih dekat."},{"id":"C22","kind":"pick","label":"2.2","stem":"Lensa wide dari jarak sangat dekat pada wajah akan...","bare":true,"opts":[["Membuat wajah tampak natural"],["Melebarkan dan mendistorsi wajah",1],["Memampatkan wajah"]],"explain":"Wide dari jarak sangat dekat melebarkan dan mendistorsi wajah."},{"id":"C23","kind":"pick","label":"2.3","stem":"Lensa normal untuk potret biasanya sekitar...","bare":true,"opts":[["24 mm"],["50 mm",1],["150 mm"]],"explain":"Sekitar 50 mm memberi perspektif yang terasa natural."},{"id":"C31","kind":"pick","label":"3.1","stem":"Shot yang menampilkan seluruh tubuh dari kepala sampai kaki adalah...","bare":true,"opts":[["MS"],["LS",1],["CU"]],"explain":"LS (long shot) menampilkan seluruh tubuh."},{"id":"C32","kind":"pick","label":"3.2","stem":"Shot untuk wawancara dan pembawa berita biasanya...","bare":true,"opts":[["ECU"],["MCU",1],["ELS"]],"explain":"MCU (dari dada ke atas) standar untuk wawancara."},{"id":"C33","kind":"pick","label":"3.3","stem":"Hindari memotong bingkai tepat di...","bare":true,"opts":[["Sendi tubuh (leher, pinggang, lutut)",1],["Dahi"],["Dada"]],"explain":"Potong sedikit di atas atau di bawah sendi."},{"id":"C41","kind":"pick","label":"4.1","stem":"Angle yang membuat subjek tampak kecil dan lemah adalah...","bare":true,"opts":[["Low angle"],["High angle",1],["Eye level"]],"explain":"High angle dari atas membuat subjek tampak kecil atau rentan."},{"id":"C42","kind":"pick","label":"4.2","stem":"Angle yang memberi kesan tegang atau disorientasi adalah...","bare":true,"opts":[["Eye level"],["Dutch angle",1],["Bird's eye"]],"explain":"Dutch angle memiringkan kamera dan menimbulkan kesan tegang."},{"id":"C43","kind":"pick","label":"4.3","stem":"POV berarti...","bare":true,"opts":[["Pandangan dari sudut mata karakter",1],["Pandangan dari atas"],["Pandangan dari balik bahu"]],"explain":"POV mewakili pandangan karakter. OTS dari balik bahu."},{"id":"C51","kind":"pick","label":"5.1","stem":"Kepala terpotong dalam bingkai. Penyebabnya adalah...","bare":true,"opts":[["Headroom tidak tepat",1],["White balance salah"],["ISO tinggi"]],"explain":"Atur tilt atau tinggi kamera untuk headroom yang tepat."},{"id":"C52","kind":"pick","label":"5.2","stem":"Horizon miring dalam rekaman statis. Penyebabnya adalah...","bare":true,"opts":[["Kamera tidak level",1],["Shutter lambat"],["Lensa tele"]],"explain":"Pakai grid atau level; seimbangkan tripod."},{"id":"C61","kind":"pick","label":"6.1","stem":"Safe area penting untuk...","bare":true,"opts":[["Menjaga aksi dan judul tidak terpotong di layar yang berbeda",1],["Mengatur white balance"],["Menghindari noise"]],"explain":"Safe area menjaga informasi penting tidak terpotong."},{"id":"S1","kind":"pick","label":"Soal 1 · pengetahuan · pilihan ganda","stem":"Gambar memperlihatkan seorang pembawa acara dari kepala sampai sekitar pinggang. Ukuran bidang pandang yang tepat adalah...","instant":false,"opts":[["Long shot",0,"LS seluruh tubuh."],["Medium long shot",0,"MLS dari lutut ke atas."],["Medium shot",1,"MS dari pinggang ke atas."],["Medium close-up",0,"MCU dari dada ke atas."],["Extreme close-up",0,"ECU hanya detail."]]},{"id":"S2","kind":"pick","label":"Soal 2 · aplikasi · pilihan ganda","stem":"Subjek menghadap ke kanan dan ditempatkan di tepi kanan bingkai, sedangkan sisi kiri kosong. Subjek tampak terdesak. Perbaikan paling tepat adalah...","instant":false,"opts":[["Menaikkan ISO",0,"Tidak berhubungan dengan komposisi."],["Menggeser subjek ke kiri bingkai agar ada ruang di depan arah hadapnya",1,"Anomali ini karena tidak adanya lead room."],["Mengganti lensa menjadi wide dan mendekat",0,"Menambah distorsi."],["Memiringkan kamera (Dutch angle)",0,"Menambah kesan tegang."],["Memindahkan subjek tepat di tepi kiri bingkai",0,"Mengulang kesalahan di sisi berlawanan."]]},{"id":"S3","kind":"mcma","label":"Soal 3 · penalaran · pilihan majemuk","stem":"Dalam adegan interogasi, penyidik harus tampak dominan dan tersangka tampak tertekan. Pilihan teknis kamera apa saja yang mendukung tujuan itu?","opts":[["Low angle pada penyidik.",1,"Low angle memberi kesan kuasa."],["High angle pada tersangka.",1,"High angle memberi kesan lemah."],["Close-up pada ekspresi tersangka saat ragu menjawab.",1,"Close-up menangkap tekanan emosi."],["Extreme long shot kedua tokoh sepanjang adegan.",0,"Menjauhkan penonton dari emosi."],["Bird's eye pada seluruh adegan tanpa variasi shot.",0,"Menjauhkan penonton dari emosi."],["High angle pada penyidik.",0,"Membalik tujuan."]]},{"id":"S4","kind":"tf","label":"Soal 4 · penalaran · benar atau salah","stem":"Perbandingan lensa tele dan lensa lebar untuk wawancara.","opts":[{"t":"Lensa tele memampatkan jarak sehingga latar tampak lebih dekat dengan subjek.","c":true,"why":"Tele memampatkan ruang."},{"t":"Lensa lebar dari jarak sangat dekat membuat wajah tampak natural tanpa distorsi.","c":false,"why":"Wide dari jarak sangat dekat justru melebarkan dan mendistorsi wajah."},{"t":"Lensa normal sekitar 50 mm dari jarak menengah sering dipakai untuk potret karena perspektifnya mendekati penglihatan.","c":true,"why":"Lensa sekitar 50 mm memberi perspektif yang terasa natural."}]},{"id":"L1","kind":"pick","label":"Soal L1 · penalaran · pilihan ganda","stem":"Wawancara di ruang sempit. Kamerawan ingin memperlihatkan hampir seluruh ruangan sekaligus. Pilihan lensa paling tepat adalah...","instant":false,"exam":true,"opts":[["Tele 150 mm dari sudut ruangan.",0,"Tele menyempitkan bidang."],["Lensa lebar, dengan menjaga subjek utama tidak terlalu dekat ke kamera.",1,"Lensa lebar menampilkan bidang luas; jaga subjek tidak terlalu dekat agar tidak terdistorsi."],["Digital zoom pada kamera.",0,"Digital zoom menurunkan kualitas gambar."],["Lensa tele dengan bukaan terkecil.",0,"Tele menyempitkan bidang."],["Lensa normal dengan ND filter.",0,"ND tidak mengubah bidang pandang."]]},{"id":"L2","kind":"mcma","label":"Soal L2 · penalaran · pilihan majemuk","stem":"Rekaman wawancara dengan tiga masalah: kepala terpotong, horizon miring, dan tiang tampak tumbuh dari kepala narasumber. Pilih semua perbaikan yang tepat:","exam":true,"opts":[["Mengatur tilt atau tinggi kamera untuk headroom.",1,"Memperbaiki kepala terpotong."],["Meratakan tripod atau mengaktifkan level.",1,"Memperbaiki horizon miring."],["Menggeser kamera atau subjek agar tiang tidak sejajar kepala.",1,"Menghilangkan kesan tiang tumbuh dari kepala."],["Menaikkan ISO.",0,"Tidak berhubungan dengan komposisi."],["Mengubah shutter speed.",0,"Tidak berhubungan dengan komposisi."],["Mengubah white balance.",0,"Tidak berhubungan dengan komposisi."]]},{"id":"L3","kind":"tf","label":"Soal L3 · penalaran · benar atau salah","stem":"Kamerawan merekam pembawa acara dengan lensa wide dari jarak sangat dekat, dan hasilnya wajah tampak melebar.","exam":true,"opts":[{"t":"Distorsi wajah disebabkan lensa wide dari jarak sangat dekat.","c":true,"why":"Wide dari jarak dekat melebarkan wajah."},{"t":"Untuk memperbaiki, kamerawan sebaiknya mundur dan memakai lensa lebih panjang.","c":true,"why":"Mundur dan lensa lebih panjang mengurangi distorsi."},{"t":"Menaikkan ISO akan memperbaiki distorsi wajah.","c":false,"why":"ISO tidak mengubah bentuk wajah."}]}],"sectionsContent":{"b1":{"blocks":[{"type":"tebak","ids":["T1"]},{"type":"lead","text":"Cara menata unsur di dalam bingkai agar mata penonton diarahkan ke hal yang penting. Bukan aturan kaku, tetapi alat yang bisa dipakai atau sengaja dilanggar."},{"type":"table","head":["Konsep","Penjelasan","Fungsi"],"rows":[["<b>Rule of thirds<\/b>","Bingkai dibagi 3 × 3. Subjek atau mata ditempatkan di garis atau persimpangan, bukan tepat di tengah.","Komposisi lebih seimbang dan dinamis."],["<b>Headroom<\/b>","Ruang di atas kepala. Pada MS dan MCU, mata berada sekitar sepertiga dari atas bingkai.","Mencegah kepala terpotong atau tampak tenggelam."],["<b>Lead room (nose room)<\/b>","Ruang kosong di depan arah hadap atau gerak subjek.","Subjek tidak tampak terdesak ke tepi bingkai."],["<b>Framing<\/b>","Membingkai subjek dengan unsur dalam adegan, misalnya pintu atau jendela.","Menarik fokus dan menambah kedalaman."],["<b>Kedalaman<\/b>","Memanfaatkan latar depan, tengah, dan belakang.","Gambar tidak tampak datar."],["<b>Garis penuntun<\/b>","Garis dalam adegan yang mengarahkan mata ke subjek.","Mengarahkan perhatian."]]},{"type":"callout","kind":"penting","tag":"Di sekolah kita","html":"<p>Aktifkan grid pada layar kamera (Canon 750D, Nikon D5500, dan Sony A6600 umumnya memiliki pilihan grid) atau pada monitor Feelworld 7\" jika tersedia, supaya siswa membingkai dengan panduan garis sepertiga.<\/p>"},{"type":"cek","ids":["C11","C12"]}]},"b2":{"blocks":[{"type":"tebak","ids":["T2"]},{"type":"lead","text":"Panjang fokus lensa menentukan seberapa luas bidang yang terlihat dan bagaimana ruang tampak di dalam gambar. Perspektif ditentukan oleh jarak kamera ke subjek, sedangkan lensa memaksa kita berdiri di jarak berbeda untuk mendapat ukuran subjek yang sama."},{"type":"table","head":["Jenis lensa","Perkiraan (ekuivalen full frame)","Karakter"],"rows":[["<b>Wide angle<\/b>","Sekitar 24 sampai 35 mm","Bidang luas, perspektif diperbesar, wajah melebar jika terlalu dekat, guncangan kurang terasa."],["<b>Normal<\/b>","Sekitar 40 sampai 60 mm","Mirip penglihatan manusia; aman untuk banyak situasi."],["<b>Tele<\/b>","Sekitar 85 mm ke atas","Bidang sempit, ruang tampak mampat (latar terasa lebih dekat), latar lebih blur, guncangan sangat terasa."]]},{"type":"table","head":["Kamera dan lensa","Perkiraan ekuivalen","Kesan"],"rows":[["Sony A6600 + 35 mm","Sekitar 52 mm","Mendekati normal"],["Nikon D5500 + 50 mm","Sekitar 75 mm","Tele ringan, cocok potret"],["Canon 750D + 50 mm","Sekitar 80 mm","Tele ringan"],["Canon 750D + tele 150 mm","Sekitar 240 mm","Tele jauh; latar sangat mampat"]]},{"type":"callout","kind":"waspada","tag":"Catatan","html":"<p>Angka ekuivalen di atas hanyalah perkiraan. Cek tulisan pada barel lensa kit dan lensa tele untuk mengetahui rentang panjang fokusnya.<\/p>"},{"type":"cek","ids":["C21","C22","C23"]}]},"b3":{"blocks":[{"type":"tebak","ids":["T3"]},{"type":"lead","text":"Seberapa banyak subjek tampak dalam bingkai. Pemilihannya bukan soal hafalan nama, tetapi soal fungsi: seberapa dekat penonton perlu berada dengan karakter atau informasi saat itu."},{"type":"table","head":["Shot size","Batas bingkai (untuk manusia)","Fungsi naratif"],"rows":[["<b>Extreme long shot (ELS)<\/b>","Subjek sangat kecil dalam lokasi luas.","Establishing, menunjukkan skala dan tempat."],["<b>Long shot (LS)<\/b>","Seluruh tubuh dari kepala sampai kaki.","Posisi dan gerak subjek di ruang."],["<b>Medium long shot (MLS)<\/b>","Dari lutut ke atas.","Aksi dengan sedikit detail."],["<b>Medium shot (MS)<\/b>","Dari pinggang ke atas.","Dialog dan interaksi standar."],["<b>Medium close-up (MCU)<\/b>","Dari dada ke atas.","Wawancara dan pembawa berita."],["<b>Close-up (CU)<\/b>","Wajah, dari bahu atau leher ke atas.","Emosi dan reaksi."],["<b>Extreme close-up (ECU)<\/b>","Sebagian wajah (mata, bibir) atau detail benda.","Intensitas dan detail penting."]]},{"type":"callout","kind":"waspada","tag":"Aturan pemotongan bingkai","html":"<p>Hindari memotong bingkai tepat di sendi tubuh (leher, pinggang, lutut, pergelangan). Potonglah sedikit di atas atau di bawahnya. Nama dan batas shot size dapat sedikit berbeda antar-buku, jadi gunakan istilah yang konsisten dalam satu proyek.<\/p>"},{"type":"cek","ids":["C31","C32","C33"]}]},"b4":{"blocks":[{"type":"tebak","ids":["T4"]},{"type":"lead","text":"Posisi kamera terhadap subjek: lebih tinggi, setara, atau lebih rendah. Sudut membentuk kesan tentang karakter dan situasi, tetapi kesan itu bukan hukum mutlak; konteks adegan tetap menentukan."},{"type":"table","head":["Angle","Posisi kamera","Kesan umum"],"rows":[["<b>Eye level<\/b>","Setinggi mata subjek.","Netral dan setara."],["<b>High angle<\/b>","Di atas subjek, mengarah ke bawah.","Subjek tampak kecil, lemah, atau rentan."],["<b>Low angle<\/b>","Di bawah subjek, mengarah ke atas.","Subjek tampak besar, kuat, atau berkuasa."],["<b>Bird's eye<\/b>","Tepat di atas, hampir tegak lurus.","Pola, peta, atau kesan terpisah dari adegan."],["<b>Worm's eye<\/b>","Dari tanah, mengarah ke atas.","Kesan ekstrem tentang ketinggian atau dominasi."],["<b>Dutch angle<\/b>","Kamera miring ke samping.","Tegang, tidak stabil, disorientasi."],["<b>POV<\/b>","Mewakili pandangan karakter.","Penonton melihat apa yang dilihat karakter."],["<b>Over the shoulder (OTS)<\/b>","Dari balik bahu satu karakter ke karakter lain.","Hubungan dua orang dalam dialog."]]},{"type":"cek","ids":["C41","C42","C43"]}]},"b5":{"blocks":[{"type":"tebak","ids":["T5"]},{"type":"lead","text":"Baca gejala, tebak penyebab, pilih solusi."},{"type":"table","head":["Gejala","Penyebab","Penanganan"],"rows":[["Ruang kosong terlalu banyak atau kepala terpotong","Headroom tidak tepat","Atur tilt atau tinggi kamera."],["Subjek tampak terdesak ke tepi","Tidak ada lead room","Geser subjek atau pan ke arah hadap."],["Bingkai memotong leher, pinggang, atau lutut","Framing di sendi","Naikkan atau turunkan bingkai sedikit."],["Garis horizon miring (tidak disengaja)","Kamera tidak level","Pakai grid atau level; seimbangkan tripod."],["Benda di latar tampak tumbuh dari kepala","Latar tidak dicek","Geser kamera atau subjek."],["Wajah melebar pada close-up","Wide dari jarak terlalu dekat","Mundur dan pakai lensa lebih panjang."],["Latar ramai mengganggu","Komposisi dan DoF","Pindah sudut, bukaan lebih besar, atau latar lebih polos."],["Gambar tidak sesuai tujuan emosi","Shot size atau angle keliru","Ganti ukuran atau sudut sesuai tujuan adegan."]]},{"type":"cek","ids":["C51","C52"]}]},"b6":{"blocks":[{"type":"tebak","ids":["T6"]},{"type":"lead","text":"Bingkai yang sama bisa tampil berbeda tergantung format. Informasi penting jangan ditaruh di tepi."},{"type":"table","head":["Format","Dipakai untuk","Catatan"],"rows":[["16:9","Siaran televisi dan YouTube.","Format standar."],["9:16","Reels, TikTok, Shorts.","Subjek ditata vertikal; bagian atas atau bawah dapat tertutup antarmuka aplikasi."],["1:1 atau 4:5","Feed media sosial.","Komposisi lebih terpusat."]]},{"type":"html","html":"<p>Untuk siaran, aksi dan judul penting ditempatkan di dalam <b>safe area<\/b> agar tidak terpotong oleh layar yang memangkas tepi.<\/p>"},{"type":"callout","kind":"penting","tag":"Di sekolah kita","html":"<p>Praktik dapat memakai smartphone dengan phone holder dan mini tripod untuk memeriksa bingkai 9:16, sambil membandingkannya dengan 16:9 pada kamera. Cek apakah monitor Feelworld memiliki garis bantu safe area atau aspect ratio.<\/p>"},{"type":"html","html":"<h2>Alur keputusan bahasa visual<\/h2>"},{"type":"steps","items":[{"title":"Tujuan","desc":"Apa yang perlu dirasakan atau diketahui penonton pada adegan ini?"},{"title":"Shot size","desc":"Seberapa dekat penonton harus berada?"},{"title":"Angle","desc":"Bagaimana hubungan kekuatan atau perasaan antar karakter?"},{"title":"Lensa","desc":"Butuh bidang luas atau ruang yang dimampatkan, dan jarak apa yang tersedia?"},{"title":"Komposisi","desc":"Tempatkan subjek (thirds, headroom, lead room), cek latar."},{"title":"Format","desc":"Apakah ditujukan untuk 16:9 atau 9:16, dan di mana safe area-nya?"},{"title":"Cek anomali","desc":"Periksa sendi, horizon, distorsi, dan latar sebelum merekam."}]},{"type":"cek","ids":["C61"]}]},"latihan":{"blocks":[{"type":"callout","kind":"penting","tag":"Strategi menjawab","html":"<ol><li><b>Garisbawahi kendala di soal<\/b>, misalnya \"tanpa merusak komposisi\". Kalimat itulah yang menentukan jawaban.<\/li><li><b>Tebak penyebabnya dulu<\/b> sebelum membaca pilihan. Cocokkan dengan tabel anomali visual.<\/li><li><b>Coret pilihan sambil menyebut alasan<\/b>. Jawaban yang memperbaiki gejala tetapi merusak tujuan adalah jebakan.<\/li><li>Pilihan majemuk dan benar-salah: <b>nilai tiap pernyataan sendiri-sendiri.<\/b><\/li><\/ol>"},{"type":"qlist","ids":["S1","S2","S3","S4"]}]},"cek":{"blocks":[{"type":"callout","kind":"penting","tag":"Cara mengerjakan","html":"Kerjakan tanpa membuka bagian lain. Tiap soal bernilai 1 poin; soal pilihan majemuk dan benar-salah bernilai 1 hanya jika <b>semua pernyataan<\/b> tepat. Pembahasan terbuka setelah ketiga soal dikunci."},{"type":"qlist","ids":["L1","L2","L3"]}]},"praktik":{"blocks":[{"type":"panel","html":"<b>Gear:<\/b> Canon 750D, Nikon D5500, Sony A6600, Panasonic HC-X2000, tripod fluid head Takara, monopod, mini tripod, phone holder, Feelworld 7\", TV 32\"."},{"type":"callout","kind":"waspada","tag":"Keselamatan","html":"<p>Jangan berdiri di kursi atau meja untuk high angle. Gunakan tangga atau platform yang kokoh dengan pendamping, atau cukup angkat kamera dengan monopod. Demonstrasi bird's eye dengan drone hanya boleh dilakukan operator terlatih di area terbuka sesuai aturan.<\/p>"},{"type":"html","html":"<h2>Praktik 1 · Komposisi dan framing <span class=\"small\">(10 menit)<\/span><\/h2><p>Aktifkan grid. Ambil MS model di tengah, lalu geser ke garis sepertiga. Minta model menghadap ke kanan; ambil tanpa lead room, lalu dengan lead room. Atur headroom terlalu sedikit, pas, terlalu banyak. Bingkai model lewat pintu atau jendela.<\/p>"},{"type":"checklist","items":[{"id":"pa1","text":"Grid diaktifkan"},{"id":"pa2","text":"Subjek di tengah vs sepertiga"},{"id":"pa3","text":"Lead room dibandingkan"},{"id":"pa4","text":"Headroom dibandingkan"}]},{"type":"html","html":"<textarea data-note=\"pa_r\" placeholder=\"Kapan subjek tepat di tengah justru efektif? Mengapa lead room penting?\"><\/textarea>"},{"type":"html","html":"<h2>Praktik 2 · Lensa dan perspektif <span class=\"small\">(15 menit)<\/span><\/h2><p>Tentukan satu ukuran subjek di bingkai (misalnya MCU). Rekam dengan 35 mm (dekat), 50 mm (mundur), dan tele 150 mm (mundur lebih jauh). Bandingkan ukuran latar, blur latar, dan bentuk wajah.<\/p>"},{"type":"checklist","items":[{"id":"pb1","text":"35 mm dari dekat"},{"id":"pb2","text":"50 mm dari jarak menengah"},{"id":"pb3","text":"Tele 150 mm dari jauh"},{"id":"pb4","text":"Perbandingan hasil"}]},{"type":"html","html":"<textarea data-note=\"pb_r\" placeholder=\"Mengapa latar tampak mendekat pada tele? Lensa mana yang cocok untuk wawancara dan mengapa?\"><\/textarea>"},{"type":"html","html":"<h2>Praktik 3 · Tangga shot size <span class=\"small\">(15 menit)<\/span><\/h2><p>Kamera di tripod pada ketinggian mata. Rekam ELS, LS, MLS, MS, MCU, CU, ECU. Pastikan tidak ada pemotongan di sendi pada MLS, MS, dan MCU. Susun jadi urutan: mana pembuka, dialog, reaksi.<\/p>"},{"type":"checklist","items":[{"id":"pc1","text":"ELS dan LS direkam"},{"id":"pc2","text":"MLS, MS, MCU direkam"},{"id":"pc3","text":"CU dan ECU direkam"},{"id":"pc4","text":"Urutan fungsi disusun"}]},{"type":"html","html":"<textarea data-note=\"pc_r\" placeholder=\"Shot mana untuk emosi, dan mana untuk memperkenalkan lokasi?\"><\/textarea>"},{"type":"html","html":"<h2>Praktik 4 · Camera angle <span class=\"small\">(10 menit)<\/span><\/h2><p>Rekam eye level, low angle (mini tripod atau di lantai), high angle (monopod atau berdiri di platform aman), dan Dutch angle. Beri kata sifat pada tiap hasil.<\/p>"},{"type":"checklist","items":[{"id":"pd1","text":"Eye level direkam"},{"id":"pd2","text":"Low angle direkam"},{"id":"pd3","text":"High angle direkam"},{"id":"pd4","text":"Dutch angle direkam dan diberi kata sifat"}]},{"type":"html","html":"<textarea data-note=\"pd_r\" placeholder=\"Dalam adegan interogasi, angle mana untuk penyidik dan mana untuk tersangka?\"><\/textarea>"}]},"kartu":{"blocks":[{"type":"html","html":"<p class=\"lead\">Gejala, penyebab, dan penanganan yang tidak merusak tujuan estetika. Kartu ini dipakai lagi di Modul 6.<\/p>"},{"type":"cards","items":[{"title":"Kepala terpotong atau ruang kosong berlebih","penyebab":"Headroom tidak tepat","solusi":"Atur tilt atau tinggi kamera"},{"title":"Subjek terdesak ke tepi","penyebab":"Tidak ada lead room","solusi":"Geser subjek atau pan ke arah hadap"},{"title":"Bingkai memotong sendi","penyebab":"Framing di sendi","solusi":"Naikkan atau turunkan bingkai sedikit"},{"title":"Horizon miring","penyebab":"Kamera tidak level","solusi":"Pakai grid atau level; seimbangkan tripod"},{"title":"Benda tumbuh dari kepala","penyebab":"Latar tidak dicek","solusi":"Geser kamera atau subjek"},{"title":"Wajah melebar pada CU","penyebab":"Wide dari jarak sangat dekat","solusi":"Mundur dan pakai lensa lebih panjang"},{"title":"Latar ramai","penyebab":"Komposisi dan DoF","solusi":"Pindah sudut atau bukaan lebih besar"}]},{"type":"html","html":"<h2>Alur 7 langkah<\/h2>"},{"type":"steps","items":[{"title":"Tujuan"},{"title":"Shot size"},{"title":"Angle"},{"title":"Lensa"},{"title":"Komposisi"},{"title":"Format"},{"title":"Cek anomali"}]},{"type":"two","items":[{"cls":"g","html":"<b>Ingat shot size<\/b><br>ELS · LS · MLS · MS · MCU · CU · ECU"},{"cls":"g","html":"<b>Ingat angle<\/b><br>Eye level · High · Low · Dutch · POV · OTS"}]}]}}},{"meta":{"id":4,"storageKey":"fke-modul4-mandiri-v1","topKick":"Modul 4","kicker":"Modul 4 · Persiapan TKA 2026 · Belajar mandiri","title":"Camera Movement dan Penstabil","intro":"Bagaimana kamera bergerak, dengan alat apa, dan apa yang bisa salah. Setiap gerakan punya alasan, dan keselamatan jalur serta alat lebih dulu.","chips":[{"label":"Memahami","color":"#ffb454"},{"label":"Menerapkan","color":"#7cc0ff"},{"label":"Menalar","color":"#7fe0a8"}],"howto":["<b>1. Tebak dulu, baru baca.<\/b> Tiap bagian dibuka dengan kotak <span class=\"small\">Tebak dulu<\/span>.","<b>2. Cek paham.<\/b> Setelah penjelasan, jawab kotak <span class=\"small\">Cek paham<\/span>.","<b>3. Praktik.<\/b> Empat praktik dengan gear sekolah ada di bagian akhir."],"objectives":["<b>Memahami:<\/b> menyebutkan jenis pergerakan kamera dan membedakan rotasi dari perpindahan; menjelaskan zoom vs dolly.","<b>Menerapkan:<\/b> melakukan pan, tilt, dan tracking sederhana dengan tripod, gimbal, atau handheld.","<b>Menalar:<\/b> menganalisis anomali gerak dan memilih alat serta gerakan sesuai tujuan naratif dan kendala."]},"sections":[{"id":"mulai","nav":"Mulai","title":"Camera Movement dan Penstabil"},{"id":"b1","nav":"Bagian 1","title":"Jenis pergerakan kamera","time":"20 menit"},{"id":"b2","nav":"Bagian 2","title":"Zoom vs dolly","time":"15 menit"},{"id":"b3","nav":"Bagian 3","title":"Motivasi dan ritme gerakan","time":"15 menit"},{"id":"b4","nav":"Bagian 4","title":"Alat penstabil dan pendukung","time":"20 menit"},{"id":"b5","nav":"Bagian 5","title":"Teknik handheld","time":"15 menit"},{"id":"b6","nav":"Bagian 6","title":"Anomali visual akibat gerakan","time":"20 menit"},{"id":"b7","nav":"Bagian 7","title":"Drone dan keselamatan","time":"15 menit"},{"id":"latihan","nav":"Latihan","title":"Latihan soal bergaya TKA","time":"25 menit"},{"id":"cek","nav":"Cek akhir","title":"Uji dirimu sendiri","time":"10 menit"},{"id":"praktik","nav":"Praktik","title":"Praktik dengan gear sekolah","time":"50 menit"},{"id":"kartu","nav":"Kartu","title":"Kartu diagnosis gerakan"}],"sectionQuestions":{"b1":["T1","C11","C12"],"b2":["T2","C21","C22"],"b3":["T3","C31","C32"],"b4":["T4","C41","C42"],"b5":["T5","C51","C52"],"b6":["T6","C61","C62"],"b7":["T7","C71","C72"],"latihan":["S1","S2","S3","S4"],"cek":["L1","L2","L3"]},"praktikChecks":["pa1","pa2","pa3","pa4","pb1","pb2","pb3","pb4","pc1","pc2","pc3","pd1","pd2","pd3"],"labs":{},"questions":[{"id":"T1","kind":"pick","label":"T1","stem":"Pan dan tilt termasuk gerakan rotasi atau perpindahan kamera?","bare":true,"opts":[["Rotasi",1],["Perpindahan"],["Keduanya"]],"explain":"Pan dan tilt adalah rotasi pada poros. Dolly, truck, dan pedestal adalah perpindahan."},{"id":"T2","kind":"pick","label":"T2","stem":"Zoom sama dengan dolly in. Benar atau salah?","bare":true,"opts":[["Benar"],["Salah",1]],"explain":"Salah. Zoom hanya memperbesar gambar; dolly memindahkan kamera sehingga perspektif berubah."},{"id":"T3","kind":"pick","label":"T3","stem":"Setiap gerakan kamera sebaiknya...","bare":true,"opts":[["Dilakukan secepat mungkin"],["Punya alasan atau motivasi",1],["Selalu memakai gimbal"]],"explain":"Gerakan tanpa alasan membuat penonton terganggu tanpa tahu sebabnya."},{"id":"T4","kind":"pick","label":"T4","stem":"Alat yang paling tepat untuk pan dan tilt yang halus dan terkontrol adalah...","bare":true,"opts":[["Gimbal"],["Tripod fluid head",1],["Monopod"]],"explain":"Tripod fluid head memberi pan dan tilt yang halus dan terkontrol."},{"id":"T5","kind":"pick","label":"T5","stem":"Lensa mana yang lebih toleran terhadap guncangan handheld?","bare":true,"opts":[["Tele"],["Wide",1],["Makro"]],"explain":"Lensa wide membuat guncangan kurang terlihat; tele memperbesarnya."},{"id":"T6","kind":"pick","label":"T6","stem":"Horizon miring saat pan sering disebabkan oleh...","bare":true,"opts":[["White balance salah"],["Tripod tidak level",1],["ISO tinggi"]],"explain":"Ratakan kaki tripod dengan waterpass atau fitur level kamera."},{"id":"T7","kind":"pick","label":"T7","stem":"Drone boleh diterbangkan di mana saja tanpa aturan. Benar atau salah?","bare":true,"opts":[["Benar"],["Salah",1]],"explain":"Salah. Perlu area terbuka, aturan penerbangan, cuaca yang baik, dan pengawas (spotter)."},{"id":"C11","kind":"pick","label":"1.1","stem":"Kamera bergeser ke samping sejajar subjek tanpa berputar pada porosnya disebut...","bare":true,"opts":[["Pan"],["Truck",1],["Tilt"]],"explain":"Truck adalah perpindahan kamera ke samping sejajar subjek."},{"id":"C12","kind":"pick","label":"1.2","stem":"Kamera naik atau turun tanpa mengubah sudut disebut...","bare":true,"opts":[["Pedestal",1],["Dolly"],["Crane"]],"explain":"Pedestal mengubah ketinggian tanpa mengubah sudut."},{"id":"C21","kind":"pick","label":"2.1","stem":"Perbedaan utama zoom dan dolly adalah...","bare":true,"opts":[["Zoom mengubah lensa; dolly memindahkan kamera",1],["Zoom lebih murah"],["Zoom mengubah warna"]],"explain":"Zoom mengubah panjang fokus lensa tanpa memindahkan kamera; dolly memindahkan kamera."},{"id":"C22","kind":"pick","label":"2.2","stem":"Dolly zoom dipakai untuk menimbulkan kesan...","bare":true,"opts":[["Tenang"],["Cemas atau disorientasi",1],["Netral"]],"explain":"Dolly zoom memadukan dolly dan zoom berlawanan arah; efeknya dipakai untuk kesan cemas atau disorientasi."},{"id":"C31","kind":"pick","label":"3.1","stem":"Gerakan kamera sebaiknya dimulai dan diakhiri dengan...","bare":true,"opts":[["Gerak cepat"],["Frame diam 1–2 detik",1],["Zoom"]],"explain":"Frame diam di awal dan akhir memudahkan penyuntingan."},{"id":"C32","kind":"pick","label":"3.2","stem":"Ease in dan ease out berarti...","bare":true,"opts":[["Mulai dan berhenti perlahan",1],["Mulai dan berhenti mendadak"],["Selalu cepat"]],"explain":"Mulai dan berhenti perlahan agar gerak terasa halus."},{"id":"C41","kind":"pick","label":"4.1","stem":"Gimbal harus diseimbangkan (balance) sebelum dinyalakan. Benar atau salah?","bare":true,"opts":[["Benar",1],["Salah"]],"explain":"Gimbal harus seimbang agar motor tidak terbebani."},{"id":"C42","kind":"pick","label":"4.2","stem":"Stabilisasi digital (EIS) biasanya...","bare":true,"opts":[["Tidak punya harga"],["Memangkas bingkai sehingga gambar lebih sempit",1],["Menggantikan gimbal"]],"explain":"EIS memangkas bingkai; tidak menggantikan gimbal untuk gerak besar."},{"id":"C51","kind":"pick","label":"5.1","stem":"Teknik handheld yang benar meliputi...","bare":true,"opts":[["Siku merapat ke badan dan lutut lentur saat berjalan",1],["Lengan diangkat tinggi"],["Berlari cepat"]],"explain":"Siku merapat, strap, dan berjalan dengan lutut sedikit
