<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b2a5b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Platform Pembekalan TKA · Kelas XII Produksi Film</title>
<style>
:root{
  --navy:#0b2a5b; --navy-2:#123a7a; --blue:#1d5fd1; --blue-soft:#e8f0fd;
  --bg:#f2f5fa; --card:#fff; --ink:#18202f; --muted:#5d6879; --line:#d7deea;
  --green:#1f9d55; --green-soft:#e3f5ea; --amber:#f2a516; --amber-soft:#fff3d6; --amber-bg:#fff3d6;
  --red:#d64545; --red-soft:#fdeaea; --surface2:#eef3fb; --mute:#5d6879; --radius:12px; color-scheme:light;
}
*{box-sizing:border-box} html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer} .hidden{display:none!important}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 16px}
a{color:var(--blue)}
/* top */
.topbar{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff}
.topbar .wrap{display:flex;align-items:center;gap:12px;min-height:60px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer}
.logo{width:40px;height:40px;border-radius:10px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.brand h1{font-size:15px;margin:0;line-height:1.2}.brand small{display:block;opacity:.8;font-size:11.5px}
.spacer{flex:1}
.idchip{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);padding:5px 12px 5px 5px;border-radius:999px;min-width:0}
.avatar{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.idchip b{font-size:13px;display:block;line-height:1.2;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idchip span{font-size:11px;opacity:.8}
.tbtn{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600}
.tbtn:hover{background:rgba(255,255,255,.26)}
.timer{display:flex;align-items:center;gap:8px;background:#fff;color:var(--navy);padding:7px 14px;border-radius:10px;font-weight:700;font-variant-numeric:tabular-nums;font-size:20px}
.timer small{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.timer.warn{background:var(--amber-soft);color:#8a5a00}.timer.danger{background:var(--red-soft);color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
/* stage nav */
.stagenav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.stagenav .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:8px;padding-bottom:8px;scrollbar-width:thin}
.sn{flex:none;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:6px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.sn:hover:not(:disabled){border-color:var(--blue)}
.sn.cur{background:var(--navy);border-color:var(--navy);color:#fff}
.sn.done{border-color:var(--green);color:#146c3a;background:var(--green-soft)}
.sn.cur.done{background:var(--navy);color:#fff}
.sn:disabled{opacity:.5;cursor:not-allowed;background:#f4f6fa}
.sn .st{font-size:11px;font-weight:800;color:var(--amber)}
.sep{flex:none;width:1px;background:var(--line);margin:0 4px}
/* generic */
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:700;font-size:14.5px;transition:.15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover:not(:disabled){background:#174fb0}
.btn-primary:disabled{background:#b9c6dd;cursor:not-allowed}
.btn-ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#17804a}
.btn-sm{padding:6px 12px;font-size:13px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 2px 12px rgba(11,42,91,.07);padding:20px 22px;margin-bottom:16px}
.card h2,.card h3{margin:0 0 6px;color:var(--navy)}
.muted{color:var(--muted)} .small{font-size:12.5px;color:var(--muted)}
.page{flex:1;padding:22px 0 30px}
.page h1.title{margin:0 0 4px;font-size:24px;color:var(--navy)}
.badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--blue-soft);color:var(--blue);display:inline-block}
.badge.g{background:var(--green-soft);color:#146c3a}.badge.a{background:var(--amber-soft);color:#8a5a00}.badge.x{background:#eceff4;color:var(--muted)}.badge.r{background:var(--red-soft);color:#a62d2d}
.bar{height:8px;background:#e4eaf4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
/* login */
.login{flex:1;display:grid;place-items:center;padding:28px 16px}
.login-card{width:100%;max-width:980px;background:var(--card);border-radius:18px;box-shadow:0 10px 40px rgba(11,42,91,.12);overflow:hidden;display:grid;grid-template-columns:1fr 1.15fr}
.login-side{background:linear-gradient(160deg,var(--navy),var(--navy-2) 70%,#1d5fd1);color:#fff;padding:32px}
.login-side .logo{width:54px;height:54px;font-size:19px;margin-bottom:18px}
.login-side h2{margin:0 0 6px;font-size:23px;line-height:1.25}.login-side p{margin:0 0 18px;opacity:.9;font-size:14px}
.flowlist{margin:0;padding:0;list-style:none;font-size:13.5px}
.flowlist li{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px;opacity:.95}
.flowlist li>b{flex:none;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:12px}
.login-main{padding:28px;display:flex;flex-direction:column;min-width:0}
.login-main h3{margin:0 0 4px;font-size:18px}.login-main .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.search{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;margin-bottom:10px}
.search:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.names{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:320px;flex:1}
.name-btn{display:flex;width:100%;align-items:center;gap:10px;text-align:left;padding:9px 12px;border:0;border-bottom:1px solid #edf1f7;background:#fff;color:var(--ink)}
.name-btn:last-child{border-bottom:0}.name-btn:hover{background:#f6f9ff}
.name-btn.sel{background:var(--blue-soft);box-shadow:inset 3px 0 0 var(--blue)}
.name-btn .no{width:24px;color:var(--muted);font-size:12px;flex:none;text-align:right}.name-btn .nm{flex:1;font-size:14px;font-weight:600;min-width:0}
.start-row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}.start-row .hint{font-size:12px;color:var(--muted);flex:1;min-width:150px}
.login-tools{display:flex;gap:14px;margin-top:14px;font-size:12.5px;flex-wrap:wrap;align-items:center}
.login-tools label{display:flex;gap:6px;align-items:center;color:var(--muted);cursor:pointer}
.linkbtn{background:none;border:0;color:var(--blue);padding:0;font-size:12.5px;text-decoration:underline}
/* mapel */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:22px}
.mcard{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:140px}
.mcard h3{margin:0;font-size:16px;color:var(--navy)}
.mcard.on{border-color:var(--blue);box-shadow:0 6px 20px rgba(29,95,209,.15)}.mcard.on:hover{transform:translateY(-2px)}
.mcard.off{background:#f6f8fb;color:var(--muted);cursor:not-allowed}
.mcard .ico{width:38px;height:38px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:800}
.mcard.off .ico{background:#eceff4;color:#9aa5b8}
/* home roadmap */
.road{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.stage{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:6px}
.stage h4{margin:0;font-size:14.5px;color:var(--navy)}
.stage.open{border-color:var(--blue)}.stage.open:hover{box-shadow:0 4px 16px rgba(29,95,209,.15)}
.stage.done{border-color:var(--green);background:#fafffc}.stage.locked{background:#f6f8fb;color:var(--muted);cursor:not-allowed}
.stage .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sechead{display:flex;align-items:center;gap:10px;margin:22px 0 10px}.sechead h2{margin:0;font-size:17px;color:var(--navy)}.sechead::after{content:"";flex:1;height:1px;background:var(--line)}
/* module */
.modhead{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;border-radius:16px;padding:22px 24px;margin-bottom:16px}
.modhead small{opacity:.85}.modhead h1{margin:4px 0 6px;font-size:23px}.modhead p{margin:0;opacity:.92;font-size:14.5px}
.chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.chip{font-size:12px;font-weight:700;border-radius:99px;padding:3px 12px;background:rgba(255,255,255,.14);border-left:4px solid}
.mod-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.sectabs{position:sticky;top:58px;background:#fff;border-radius:var(--radius);box-shadow:0 2px 12px rgba(11,42,91,.07);padding:10px}
.sectab{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;font-size:13.5px;color:var(--ink)}
.sectab:hover{background:var(--surface2)}.sectab.cur{background:var(--blue-soft);color:var(--blue);font-weight:700}
.sectab .dot{width:9px;height:9px;border-radius:50%;border:2px solid #b8c3d6;flex:none}.sectab.seen .dot{background:var(--green);border-color:var(--green)}
.sectab small{margin-left:auto;color:var(--muted);font-size:11px}
.modbody{background:#fff;border-radius:var(--radius);box-shadow:0 2px 12px rgba(11,42,91,.07);padding:22px 26px}
.modbody h1.sectitle{margin:0 0 12px;font-size:21px;color:var(--navy)}
.modbody h2{font-size:18px;color:var(--navy);margin:20px 0 8px}.modbody h3{font-size:15.5px;color:var(--navy)}
.modbody p{margin:0 0 10px}.modbody ul,.modbody ol{padding-left:22px}
.modbody .lead{font-size:16px;color:#2c3a52;background:var(--surface2);border-radius:10px;padding:12px 16px}
.callout{border-radius:10px;padding:12px 16px;margin:14px 0;border-left:5px solid var(--blue);background:var(--blue-soft)}
.callout.waspada{border-color:var(--amber);background:var(--amber-soft)}
.callout .tag{display:block;font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--blue);margin-bottom:2px}
.callout.waspada .tag{color:#8a5a00}.callout p:last-child{margin-bottom:0}
.panelbox{background:#f8fafd;border:1px dashed #b9c6dd;border-radius:10px;padding:12px 16px;margin:12px 0}
table.tbl{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px;display:block;overflow-x:auto}
table.tbl th{background:#eef3fb;color:var(--navy);text-align:left;padding:9px 11px;border:1px solid var(--line);font-size:13px}
table.tbl td{padding:9px 11px;border:1px solid var(--line);vertical-align:top}
table.tbl td.strike{text-decoration:line-through;color:var(--muted)}
table.tbl input[type=text]{width:100%;min-width:110px;padding:6px 8px;border:1.5px solid var(--line);border-radius:7px;font:inherit}
.pill{font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:99px}.pill.ok{background:var(--green-soft);color:#146c3a}.pill.no{background:var(--red-soft);color:#a62d2d}
.big{font-size:20px;font-weight:800;color:var(--navy)}
.steps{counter-reset:s;padding:0;list-style:none;margin:12px 0}
.steps li{counter-increment:s;display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #edf1f7}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;display:grid;place-items:center;font-size:13px}
.steps b{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.two>div{border-radius:10px;padding:12px 14px;border:1.5px solid var(--line)}
.two .g{background:var(--green-soft);border-color:#9fd8b5}.two .r{background:var(--red-soft);border-color:#eeb1b1}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.tiles>div{background:var(--surface2);border-radius:10px;padding:12px;text-align:center}.tiles .small{display:block}
.tiles .big{display:block}
.formula{font-size:20px;font-weight:800;text-align:center;background:var(--navy);color:#fff;border-radius:10px;padding:14px;margin:12px 0}
.cardsg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:12px 0}
.dcard{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}.dcard h4{margin:0 0 6px;color:var(--navy);font-size:14.5px}
.dcard .k{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.4px}.dcard p{margin:0 0 8px;font-size:13.5px}
.checklist{list-style:none;padding:0;margin:10px 0}.checklist label{display:flex;gap:10px;padding:7px 0;cursor:pointer;align-items:flex-start}.checklist input{width:18px;height:18px;margin-top:2px;accent-color:var(--green)}
.vis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:12px 0}.vis svg{width:100%;height:auto;display:block;margin-bottom:6px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}.flow>div{background:var(--surface2);border-radius:10px;padding:10px 12px}
.flow .n{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}.flow .l{font-weight:800;margin:4px 0 2px;color:var(--navy)}.flow .d{font-size:12.5px;color:var(--muted)}
.tp{position:relative;max-width:480px;aspect-ratio:16/10;margin:12px auto;background:var(--surface2);border-radius:12px;overflow:hidden}
.tp .line{position:absolute;height:3px;transform-origin:left center;border-radius:3px}
.tp .lamp{position:absolute;padding:3px 10px;border-radius:7px;color:#fff;font-size:12px;font-weight:800}
.tp .lamp.key{left:5%;top:16%;background:var(--amber);color:#3a2600}.tp .lamp.fill{left:78%;top:30%;background:var(--blue)}.tp .lamp.back{left:42%;top:3%;background:var(--green)}
.tp .subj{position:absolute;left:44%;top:46%;width:12%;aspect-ratio:1;border-radius:50%;background:#c9d4e8}.tp .head{position:absolute;left:47%;top:40%;width:6%;aspect-ratio:1;border-radius:50%;background:#8da2c6}
.tp .cam{position:absolute;left:41%;top:84%;padding:3px 12px;border-radius:7px;background:var(--navy);color:#fff;font-size:12px;font-weight:700}
.kel{position:relative;height:64px;margin:16px 6px 8px;border-radius:8px;background:linear-gradient(90deg,#ff9a3c,#ffd9a0 35%,#fff 62%,#cfe4ff 85%,#8fb8ff)}
.kel div{position:absolute;top:0;transform:translateX(-50%);text-align:center;font-size:11.5px;font-weight:700;border-left:2px solid var(--navy);padding:2px 5px;height:100%;background:rgba(255,255,255,.55);border-radius:4px;line-height:1.25}
/* question cards (modules) */
.qc{border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0;background:#fff}
.qc .qh{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.qc .stem{font-weight:600;margin:0 0 10px}
.qopt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:#fff;width:100%;text-align:left;font:inherit;color:inherit}
.qopt:hover:not(.lock){border-color:#9db9ea;background:#fafcff}
.qopt .mk{width:24px;height:24px;flex:none;border:2px solid #aab6cc;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);background:#fff}
.qopt.pg .mk{border-radius:50%}.qopt.mc .mk{border-radius:6px}
.qopt.sel{border-color:var(--blue);background:var(--blue-soft)}.qopt.sel .mk{background:var(--blue);border-color:var(--blue);color:#fff}
.qopt.ok{border-color:var(--green);background:var(--green-soft)}.qopt.ok .mk{background:var(--green);border-color:var(--green);color:#fff}
.qopt.bad{border-color:var(--red);background:var(--red-soft)}.qopt.bad .mk{background:var(--red);border-color:var(--red);color:#fff}
.qopt.lock{cursor:default}.qopt .why{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.fb{margin-top:10px;padding:10px 14px;border-radius:10px;font-size:14px}.fb.ok{background:var(--green-soft);color:#145a32}.fb.bad{background:var(--red-soft);color:#7d2323}.fb.part{background:var(--amber-soft);color:#7a4e00}
table.kat{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:14.5px}
table.kat th{background:#eef3fb;color:var(--navy);font-size:12.5px;padding:8px;text-align:center;border:1px solid var(--line)}table.kat th:first-child{text-align:left}
table.kat td{border:1px solid var(--line);padding:9px;vertical-align:middle}table.kat td.c{text-align:center;width:80px}
table.kat input{width:19px;height:19px;accent-color:var(--blue);cursor:pointer}
table.kat tr.ok td:first-child{background:var(--green-soft)}table.kat tr.bad td:first-child{background:var(--red-soft)}
.sumline{display:flex;gap:10px;align-items:center;background:var(--surface2);border-radius:10px;padding:10px 14px;margin:14px 0;font-weight:600}
.modnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
/* lab */
.lab{border:1.5px solid var(--line);border-radius:12px;padding:16px;margin:14px 0;background:#fbfcff}
.lab h4{margin:0 0 6px;color:var(--navy)}
.lab .ctrl{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;align-items:center;margin:10px 0}
.lab .ctrl .v{display:flex;align-items:center;gap:8px}.lab .ctrl .v b{min-width:78px;text-align:center;font-variant-numeric:tabular-nums}
.lab .sbtn{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:800}.lab .sbtn:hover{border-color:var(--blue)}
.meter{position:relative;height:16px;border-radius:99px;background:linear-gradient(90deg,#1b2a45,#7b8aa8 35%,#fff 50%,#ffe1a6 65%,#ffb259);border:1px solid var(--line);margin:10px 0 4px}
.meter i{position:absolute;top:-4px;width:6px;height:24px;border-radius:3px;background:var(--navy);transform:translateX(-50%);transition:left .2s}
.lab .win{background:var(--green-soft);color:#145a32;border-radius:10px;padding:10px 14px;margin-top:8px;font-weight:600}
/* exam */
.exam-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}
.qcard{background:#fff;border-radius:var(--radius);box-shadow:0 2px 12px rgba(11,42,91,.07);overflow:hidden}
.qhead{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);background:#fafcff;flex-wrap:wrap}
.qno{font-weight:800;color:var(--navy);font-size:17px}
.doubt{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer;padding:6px 12px;border-radius:8px;border:1.5px solid var(--line);background:#fff}
.doubt input{width:17px;height:17px;accent-color:var(--amber)}.doubt.on{background:var(--amber-soft);border-color:var(--amber);color:#7a4e00}
.qbody{padding:20px 22px 8px}.stim{background:#f6f9ff;border-left:4px solid var(--blue);border-radius:0 10px 10px 0;padding:14px 16px;margin-bottom:14px;font-size:15.5px}
.instr{font-size:13px;color:var(--muted);margin:0 0 14px;font-style:italic}
.nav-buttons{display:flex;gap:10px;padding:14px 22px 20px;justify-content:space-between;flex-wrap:wrap}
.side{position:sticky;top:12px;display:flex;flex-direction:column;gap:14px}
.panel{background:#fff;border-radius:var(--radius);box-shadow:0 2px 12px rgba(11,42,91,.07);padding:16px}.panel h4{margin:0 0 12px;font-size:14px;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.nbtn{position:relative;aspect-ratio:1;border-radius:10px;font-weight:700;font-size:15px;border:2px solid var(--line);background:#fff;color:var(--muted)}
.nbtn:hover{border-color:var(--blue)}.nbtn.answered{background:var(--green);border-color:var(--green);color:#fff}.nbtn.doubt{background:var(--amber);border-color:var(--amber);color:#3a2600}
.nbtn.current{background:var(--blue);border-color:var(--navy);color:#fff;box-shadow:0 0 0 3px rgba(29,95,209,.25)}
.nbtn.current.doubt::after{content:"";position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--amber);border:2px solid #fff}
.legend{display:grid;gap:7px;margin-top:14px;font-size:13px;color:var(--muted)}.legend div{display:flex;align-items:center;gap:10px}
.sw{width:18px;height:18px;border-radius:5px;border:2px solid var(--line);background:#fff;flex:none}.sw.g{background:var(--green);border-color:var(--green)}.sw.a{background:var(--amber);border-color:var(--amber)}.sw.b{background:var(--blue);border-color:var(--navy)}
.stat{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}.stat b{color:var(--ink)}
.progress-row{background:#fff;border-bottom:1px solid var(--line)}.progress-row .wrap{display:flex;align-items:center;gap:12px;padding-top:8px;padding-bottom:8px;font-size:13px;color:var(--muted)}.progress-row .bar{flex:1}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,20,40,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}.modal h3{margin:0 0 8px}.modal p{margin:0 0 14px;color:var(--muted);font-size:14px}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.sumrow div{border-radius:10px;padding:10px;text-align:center;background:#f4f7fc}.sumrow b{display:block;font-size:22px}.sumrow span{font-size:12px;color:var(--muted)}
.sumrow .s-g b{color:var(--green)}.sumrow .s-a b{color:#b57800}.sumrow .s-r b{color:var(--red)}.modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
/* result */
.print-head{display:none}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy-2) 65%,var(--blue));color:#fff;border-radius:16px;padding:24px 26px;display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;margin-bottom:18px}
.ring{--p:0;width:150px;height:150px;border-radius:50%;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.2) 0);display:grid;place-items:center}
.ring div{width:122px;height:122px;border-radius:50%;background:var(--navy-2);display:grid;place-items:center}.ring b{font-size:42px;line-height:1}
.hero h2{margin:0;font-size:22px;color:#fff}.hero .pred{display:inline-block;margin:6px 0 12px;background:#fff;color:var(--navy);font-weight:800;padding:4px 14px;border-radius:99px;font-size:14px}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.meta div{background:rgba(255,255,255,.12);border-radius:10px;padding:10px 12px}.meta b{display:block;font-size:18px}.meta span{font-size:12px;opacity:.85}
.analysis{background:#f6f9ff;border-left:4px solid var(--blue);border-radius:0 10px 10px 0;padding:12px 16px;font-size:14.5px}.analysis p{margin:0 0 6px}.analysis p:last-child{margin:0}
.rowbar{display:grid;grid-template-columns:240px 1fr 120px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid #edf1f7}.rowbar:last-child{border-bottom:0}
.rowbar .lab b{display:block;font-size:14px}.rowbar .lab span{font-size:12px;color:var(--muted)}
.track{height:14px;background:#e9eef7;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;border-radius:99px}
.c-hi{background:var(--green)}.c-md{background:var(--blue)}.c-lo{background:var(--amber)}.c-vl{background:var(--red)}
.val{text-align:right;font-weight:700;font-size:14px}.val small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.det{border:1px solid var(--line);border-radius:10px;margin-bottom:9px;overflow:hidden}
.det summary{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;list-style:none;font-size:14px}.det summary::-webkit-details-marker{display:none}
.det summary .n{font-weight:800;color:var(--navy);width:30px}.det summary .t{flex:1;min-width:0}.det summary .t small{display:block;color:var(--muted);font-size:12px}
.p2{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}.p2.ok{background:var(--green-soft);color:#146c3a}.p2.part{background:var(--amber-soft);color:#8a5a00}.p2.no{background:var(--red-soft);color:#a62d2d}.p2.nil{background:#eceff4;color:var(--muted)}
.det .inner{padding:4px 16px 14px;font-size:14px;border-top:1px solid #edf1f7;background:#fcfdff}.det .inner p{margin:8px 0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.recs{display:flex;gap:8px;flex-wrap:wrap}.rec{background:var(--amber-soft);border:1px solid #f0cf86;border-radius:9px;padding:6px 12px;font-size:13.5px;font-weight:600;color:#6e4700}
/* guru */
table.gtab{width:100%;border-collapse:collapse;font-size:13.5px;display:block;overflow-x:auto}table.gtab th{background:#eef3fb;color:var(--navy);padding:8px 10px;text-align:left;border:1px solid var(--line);white-space:nowrap}table.gtab td{padding:7px 10px;border:1px solid var(--line);white-space:nowrap}
.heat{font-weight:700;text-align:center}
.syncchip{border:0;font:600 12px/1 inherit;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;white-space:nowrap;max-width:210px;overflow:hidden;text-overflow:ellipsis}
.syncchip.ok{background:rgba(31,157,85,.45)}.syncchip.wait{background:rgba(242,165,22,.45)}.syncchip.off{background:rgba(214,69,69,.6)}
.pinrow{display:none;gap:14px;align-items:center;margin-top:10px;flex-wrap:wrap}.pinrow.on{display:flex}
.pinrow input[type=password]{font:700 20px/1 monospace;letter-spacing:6px;width:170px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px}
.errtxt{color:var(--red);font-weight:600}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.gtabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.gtb{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font:600 13.5px/1 inherit;cursor:pointer;color:var(--navy)}.gtb.cur{background:var(--navy);color:#fff;border-color:var(--navy)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}.kpi b{display:block;font-size:24px;color:var(--navy)}.kpi span{font-size:12.5px;color:var(--muted)}
.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:4px}.livedot.c{background:var(--amber)}
.footer{background:var(--navy);color:#cdd8ee;text-align:center;font-size:13px;padding:14px 16px;margin-top:auto}.footer b{color:#fff}
@media screen and (max-width:900px){
  .login-card{grid-template-columns:1fr}.exam-grid{grid-template-columns:1fr}.side{position:static;order:-1}.grid{grid-template-columns:repeat(8,1fr)}
  .mod-layout{grid-template-columns:1fr}.sectabs{position:static;display:flex;overflow-x:auto;gap:4px}.sectab{width:auto;white-space:nowrap}
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center}.meta{grid-template-columns:repeat(2,1fr);width:100%}.cols{grid-template-columns:1fr}.rowbar{grid-template-columns:1fr;gap:6px}.val{text-align:left}
  .two{grid-template-columns:1fr}.stagenav{top:0}
}
@media screen and (max-width:560px){.grid{grid-template-columns:repeat(5,1fr)}.idchip b{max-width:120px}.login-side,.login-main{padding:22px 18px}.modbody{padding:16px}.qbody{padding:16px 14px 6px}.lab .ctrl{grid-template-columns:1fr}}
@media print{
  @page{size:A4;margin:14mm 12mm 18mm}
  body{background:#fff;display:block}
  .noprint,.topbar,.stagenav,.progress-row,.actions,.overlay{display:none!important}
  .footer{position:fixed;bottom:0;left:0;right:0;background:#fff;color:#444;border-top:1px solid #bbb;padding:6px;font-size:10px;margin:0}.footer b{color:#000}
  .page{padding:0}.wrap{max-width:none;padding:0}
  .print-head{display:block;border-bottom:3px solid var(--navy);padding-bottom:8px;margin-bottom:12px}.print-head h1{margin:0;font-size:18px;color:var(--navy)}.print-head p{margin:2px 0 0;font-size:12px;color:#444}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .hero{border:1px solid var(--navy);break-inside:avoid}.card{box-shadow:none;border:1px solid var(--line);padding:14px 16px;margin-bottom:12px}.det{break-inside:avoid}.det .inner{display:block}.rowbar{break-inside:avoid}.analysis{break-inside:avoid}
}
</style>

<script>
const DATA = {"MODS":[{"meta":{"id":1,"storageKey":"fke-modul1-mandiri-v1","topKick":"Modul 1","kicker":"Modul 1 · Belajar mandiri · TKA Broadcasting dan Perfilman 2026","title":"Fondasi Kamera dan Eksposur","intro":"Belajar membaca penyebab gambar bermasalah, lalu memilih perbaikan yang tepat. Untuk siswa kelas XII Produksi Film, elemen Tata Kamera dan Tata Cahaya.","chips":[{"label":"Memahami","color":"#ffb454"},{"label":"Menerapkan","color":"#7cc0ff"},{"label":"Menalar","color":"#7fe0a8"}],"howto":["<b>1. Tebak dulu, baru baca.<\/b> Tiap bagian dibuka dengan kotak <span class=\"small\">Tebak dulu<\/span>. Pilih jawabanmu sebelum membaca penjelasan. Salah itu wajar; itu yang membuat koreksinya terasa.","<b>2. Cek paham.<\/b> Setelah penjelasan, jawab kotak <span class=\"small\">Cek paham<\/span>. Pembahasan muncul langsung.","<b>3. Biarkan skor mengarahkanmu.<\/b> Kerjakan latihan dan Cek Akhir. Hasilnya menunjukkan bagian mana yang perlu diulang."],"objectives":["<b>Memahami:<\/b> menjelaskan fungsi aperture, shutter, ISO, Kelvin, dynamic range, dan ND filter.","<b>Menerapkan:<\/b> menentukan shutter dari frame rate dan listrik, mengatur eksposur dan white balance, lalu memeriksanya dengan histogram atau zebra.","<b>Menalar:<\/b> menemukan penyebab noise, flicker, over atau underexposure, dan color cast, lalu memilih solusi yang tetap menjaga tujuan estetika."]},"sections":[{"id":"mulai","nav":"Mulai","title":"Fondasi Kamera dan Eksposur"},{"id":"b1","nav":"Bagian 1","title":"Segitiga eksposur","time":"20 menit"},{"id":"b2","nav":"Bagian 2","title":"Flicker dan warna","time":"25 menit"},{"id":"b3","nav":"Bagian 3","title":"Alat ukur dan batas kamera","time":"25 menit"},{"id":"b4","nav":"Bagian 4","title":"Alur diagnosis","time":"30 menit"},{"id":"latihan","nav":"Latihan","title":"Latihan soal bergaya TKA","time":"30 menit"},{"id":"cek","nav":"Cek akhir","title":"Uji dirimu sendiri","time":"10 menit"},{"id":"praktik","nav":"Praktik","title":"Praktik di rumah","time":"30 menit"},{"id":"kartu","nav":"Kartu","title":"Kartu diagnosis"}],"sectionQuestions":{"b1":["T1","C11","C12","C13"],"b2":["T2","T3","C21","C22","C23","C24"],"b3":["T4","C31","C32","C33","C34","C35"],"b4":["T5","W1","W2","W3","W4","W5","W6","W7"],"latihan":["S2","S3","S4"],"cek":["L1","L2","L3"]},"praktikChecks":["pa1","pa2","pa3","pa4","pb1","pb2","pb3","pc1","pc2","pc3"],"labs":{"b1":{"title":"Coba sendiri: pindah satu, imbangi yang lain","nd":false,"init":{"ap":2,"sh":1,"iso":2,"nd":0},"base":{"ap":2,"sh":1,"iso":2,"over":0},"goal":"Terang sudah pas di f/2.8, 1/50, ISO 400. Tujuan adegan: gerak natural dan latar blur. Tantangan: turunkan noise ke ISO 100 tanpa merusak yang lain.","win":"Tantangan selesai. Cahaya yang hilang dari ISO diganti dengan aperture yang lebih terbuka, jadi gerak dan latar tetap terjaga."},"b3":{"title":"Coba sendiri: siang terik, kelebihan 3 stop","nd":true,"init":{"ap":2,"sh":1,"iso":0,"nd":0},"base":{"ap":2,"sh":1,"iso":0,"over":3},"goal":"Siang terik di f/2.8, 1/50, ISO 100 tanpa ND: kelebihan 3 stop. Tujuan: gerak natural, latar blur, noise rendah. Cari pengaturan yang membuat terang pas.","win":"Tujuan tercapai. ND 0.9 mengurangi 3 stop tanpa mengubah aperture, shutter, atau ISO."}},"questions":[{"id":"T1","kind":"pick","label":"T1","stem":"Mana bukaan lensa yang lebih besar, f/2.8 atau f/8? Dan mana yang membuat latar belakang lebih blur?","bare":true,"opts":[["f/2.8 lebih besar, dan latarnya lebih blur",1],["f/8 lebih besar, dan latarnya lebih blur"],["Sama besar; bedanya hanya di kecepatan"]],"explain":"Angka f kecil berarti bukaan besar, cahaya banyak, dan DoF dangkal sehingga latar blur."},{"id":"T2","kind":"pick","label":"T2","stem":"Kamu merekam 25 fps di Indonesia (listrik 50 Hz). Shutter berapa yang paling aman?","bare":true,"opts":[["1/50",1],["1/60"],["1/125"],["1/500"]],"explain":"25 fps menuntut 1/50 menurut aturan 180°, dan 1/50 aman di listrik 50 Hz."},{"id":"T3","kind":"pick","label":"T3","stem":"Kelvin tinggi berarti cahaya lebih hangat atau lebih dingin?","bare":true,"opts":[["Lebih hangat (kuning-oranye)"],["Lebih dingin (cenderung kebiruan)",1]],"explain":"Cahaya hangat bersuhu warna rendah, jadi Kelvin tinggi mengarah ke biru."},{"id":"T4","kind":"pick","label":"T4","stem":"Garis zebra 95 sampai 100% memenuhi wajah narasumber di monitor. Apa artinya?","bare":true,"opts":[["Wajah terlalu terang (clipping); cahaya perlu dikurangi",1],["Eksposur kulit sudah sempurna"],["Kamera kekurangan cahaya"]],"explain":"Zebra 95 sampai 100% menandai clipping: detail kulit hilang. Patokan eksposur kulit sekitar 70%."},{"id":"T5","kind":"pick","label":"T5","stem":"Gambar terlalu terang. Mana yang kamu pikirkan paling pertama?","bare":true,"opts":[["Menaikkan shutter"],["Menurunkan ISO"],["Menentukan tujuan visual",1]],"explain":"Tujuan visual menentukan pengaturan mana yang boleh diubah dan mana yang harus dijaga."},{"id":"C11","kind":"pick","label":"1.1","stem":"Urutkan dari bukaan terbesar ke terkecil: f/8, f/1.8, f/4.","bare":true,"opts":[["f/1.8, f/4, f/8",1],["f/8, f/4, f/1.8"],["f/4, f/1.8, f/8"]],"explain":"Angka f kecil berarti bukaan besar, jadi urutannya f/1.8, f/4, f/8."},{"id":"C12","kind":"pick","label":"1.2","stem":"Benar atau salah: ISO dinaikkan, gambar lebih terang tanpa efek samping.","bare":true,"opts":[["Benar"],["Salah",1]],"explain":"Salah. ISO yang naik membuat noise bertambah."},{"id":"C13","kind":"pick","label":"1.3","stem":"Shutter makin lambat. Apa yang terjadi pada gerak?","bare":true,"opts":[["Gerak membeku"],["Muncul motion blur",1]],"explain":"Shutter lambat membuat gerak merekam sebagai blur. Shutter cepat membekukannya."},{"id":"C21","kind":"pick","label":"2.1","stem":"Video 30 fps. Menurut aturan 180°, shutternya?","bare":true,"opts":[["1/30"],["1/60",1],["1/100"],["1/125"]],"explain":"1/(2 × 30) = 1/60. Tetapi 1/60 berisiko flicker di bawah lampu 50 Hz."},{"id":"C22","kind":"pick","label":"2.2","stem":"Video 50 fps. Menurut aturan 180°, shutternya?","bare":true,"opts":[["1/50"],["1/100",1],["1/125"],["1/200"]],"explain":"1/(2 × 50) = 1/100, dan 1/100 aman di listrik 50 Hz."},{"id":"C23","kind":"pick","label":"2.3","stem":"Lampu tungsten 3200 K, kamera diatur 5600 K. Warna gambar?","bare":true,"opts":[["Kuning-oranye",1],["Kebiruan"],["Netral"]],"explain":"Setting kamera lebih tinggi dari suhu warna lampu membuat gambar kuning-oranye."},{"id":"C24","kind":"pick","label":"2.4","stem":"Gel apa yang menyesuaikan cahaya siang agar cocok dengan kamera yang diatur Tungsten?","bare":true,"opts":[["CTB"],["CTO",1]],"explain":"CTO mengubah daylight ke arah tungsten. CTB kebalikannya."},{"id":"C31","kind":"pick","label":"3.1","stem":"Histogram menumpuk dan terpotong di sisi kanan. Apa artinya?","bare":true,"opts":[["Clipping di area terang: overexposure, highlight hilang",1],["Gambar terlalu gelap"],["Noise terlalu tinggi"]],"explain":"Sisi kanan histogram adalah area terang. Terpotong di tepi berarti clipping."},{"id":"C32","kind":"pick","label":"3.2","stem":"ND 0.6 mengurangi berapa stop?","bare":true,"opts":[["1 stop"],["2 stop",1],["3 stop"],["4 stop"]],"explain":"ND 0.3 = 1 stop, 0.6 = 2, 0.9 = 3, 1.2 = 4."},{"id":"C33","kind":"pick","label":"3.3","stem":"Zebra sekitar 70% dipakai untuk memeriksa apa?","bare":true,"opts":[["Eksposur kulit",1],["Clipping di langit"],["Tingkat noise"]],"explain":"Sekitar 70% untuk kulit. Zebra 95 sampai 100% menandai clipping."},{"id":"C34","kind":"pick","label":"3.4","stem":"Hitung: gambar kelebihan 2 stop dan kamu ingin aperture serta shutter tetap. ND berapa yang dipasang?","bare":true,"opts":[["ND 0.3"],["ND 0.6",1],["ND 0.9"],["ND 1.2"]],"explain":"Kelebihan 2 stop dikurangi ND 0.6 (2 stop)."},{"id":"C35","kind":"pick","label":"3.5","stem":"Hitung: gambar kelebihan 3 stop. Kalau kamu menutup aperture dari f/2.8 saja, jadi f/berapa?","bare":true,"opts":[["f/4"],["f/5.6"],["f/8",1],["f/11"]],"explain":"f/2.8 → f/4 → f/5.6 → f/8 adalah 3 stop. Yang hilang: latar blur, karena DoF menjadi lebih dalam."},{"id":"W1","kind":"pick","label":"Langkah 1 · Tujuan visual","stem":"Wawancara di halaman sekolah pukul 12 siang, 25 fps, shutter 1/50, ISO 100, f/2.8. Gambar kelebihan sekitar 3 stop. Apa tujuan visualnya?","opts":[["Gerak natural dan latar blur",1,"Itu yang disebut di skenario, jadi pengaturan yang menjaganya tidak boleh diubah."],["Gambar setajam mungkin dari depan sampai belakang",0,"Itu tujuan yang berbeda dan menuntut aperture kecil."],["Gerak membeku seperti foto olahraga",0,"Itu menuntut shutter cepat dan merusak gerak natural."]]},{"id":"W2","kind":"pick","label":"Langkah 2 · Shutter","stem":"Shutter diubah atau dipertahankan?","opts":[["Tetap 1/50 (aturan 180° untuk 25 fps)",1,"Shutter dikunci dari fps dan tidak dipakai untuk mengatur terang."],["Naikkan ke 1/400 agar tidak overexposed",0,"1/400 membekukan gerak dan melanggar aturan 180°."],["Turunkan ke 1/25",0,"Itu membuat gambar makin terang dan motion blur berlebih."]]},{"id":"W3","kind":"pick","label":"Langkah 3 · Aperture","stem":"Aperture diubah atau dipertahankan?","opts":[["Tetap f/2.8 demi latar blur",1,"Aperture sudah sesuai tujuan."],["Tutup ke f/8",0,"f/8 mengurangi 3 stop, tetapi latar menjadi tajam."],["Buka ke f/1.4",0,"Itu menambah cahaya dan membuat gambar makin overexposed."]]},{"id":"W4","kind":"pick","label":"Langkah 4 · ISO","stem":"ISO diubah atau dipertahankan?","opts":[["Tetap ISO 100, sudah serendah mungkin",1,"Tidak ada yang bisa diturunkan, jadi kelebihan cahayanya harus diselesaikan di langkah 5."],["Naikkan ke ISO 800",0,"ISO naik menambah terang dan noise."],["Naikkan ke ISO 400 agar lebih bersih",0,"ISO yang naik tidak membuat gambar lebih bersih."]]},{"id":"W5","kind":"pick","label":"Langkah 5 · ND atau cahaya","stem":"Kelebihan 3 stop. ND mana yang dipasang?","opts":[["ND 0.3 (1 stop)",0,"Masih kelebihan 2 stop."],["ND 0.6 (2 stop)",0,"Masih kelebihan 1 stop."],["ND 0.9 (3 stop)",1,"Pas: kelebihan 3 stop dikurangi 3 stop. Aperture, shutter, dan ISO tidak berubah. Cara lain: area teduh atau diffuser."],["ND 1.2 (4 stop)",0,"Terlalu banyak, gambar jadi kurang 1 stop."]]},{"id":"W6","kind":"pick","label":"Langkah 6 · White balance","stem":"White balance diatur ke mana?","opts":[["Daylight, sekitar 5600 K",1,"Sumbernya cahaya siang, jadi setting disamakan dengan sumber."],["Tungsten, 3200 K",0,"Itu membuat gambar kebiruan di cahaya siang."],["Tidak perlu dicek",0,"Color cast sering tidak terlihat di layar kecil."]]},{"id":"W7","kind":"pick","label":"Langkah 7 · Verifikasi","stem":"Bagaimana kamu memastikan hasilnya?","opts":[["Periksa histogram dan zebra, lalu putar ulang di layar yang lebih besar",1,"Alat ukur tidak tertipu layar kecil."],["Cukup lihat layar kecil kamera",0,"Layar kecil mudah menipu mata."],["Naikkan ISO sampai terlihat terang",0,"Itu menambah noise dan clipping."]]},{"id":"S2","kind":"pick","label":"Soal 2 · aplikasi · pilihan ganda","stem":"Wawancara di kantor berlampu fluorescent, kamera 25 fps, shutter 1/60. Muncul pita gelap bergerak naik turun. Tindakan paling tepat tanpa merusak gerak natural adalah...","instant":false,"opts":[["Menaikkan ISO ke 3200",0,"ISO mengatur terang dan noise, bukan keselarasan dengan kedipan lampu."],["Mengubah shutter menjadi 1/50",1,"Listrik 50 Hz membuat lampu berkedip sekitar 100 kali per detik. 1/50 selaras dengan kedipan dan sesuai aturan 180° untuk 25 fps."],["Menutup aperture ke f/16",0,"Aperture mengatur terang dan DoF, bukan keselarasan dengan kedipan."],["Mengubah shutter menjadi 1/200",0,"Memperparah ketidakselarasan dengan kedipan lampu."],["Mengubah white balance ke 3200 K",0,"White balance mengatur warna, bukan kedipan."]],"explain":"Pola soal flicker: gejala berkedip, penyebab shutter tidak selaras dengan listrik 50 Hz, solusi 1/50 atau 1/100."},{"id":"S3","kind":"mcma","label":"Soal 3 · penalaran · pilihan majemuk (jawaban benar lebih dari satu)","stem":"Wawancara luar ruangan siang terik, 25 fps, shutter 1/50, ISO 100, f/2.8 demi latar blur dan gerak natural. Wajah overexposed parah. Pilih semua tindakan yang tepat tanpa mengubah tujuan estetika:","opts":[["Memasang ND filter.",1,"Mengurangi cahaya tanpa mengubah aperture, shutter, atau warna."],["Shutter menjadi 1/2000.",0,"Merusak gerak natural karena gerak membeku."],["Menutup aperture ke f/16.",0,"Menghilangkan latar blur yang menjadi tujuan."],["Menaikkan ISO ke 800.",0,"Menambah terang, jadi makin overexposed."],["Memindahkan narasumber ke area teduh atau memasang diffuser.",1,"Mengurangi cahaya pada subjek tanpa menyentuh pengaturan kamera."],["Memeriksa histogram atau zebra setelah penyesuaian.",1,"Memverifikasi hasil dengan data, bukan hanya dengan mata."]],"explain":"Setiap pernyataan dinilai sendiri. Yang benar menjaga gerak natural dan latar blur."},{"id":"S4","kind":"tf","label":"Soal 4 · penalaran · benar atau salah","stem":"Ruangan diterangi lampu tungsten 3200 K, kamera diatur preset Daylight 5600 K, hasilnya kuning-oranye. Tentukan benar atau salah:","opts":[{"t":"Menaikkan ISO agar warna lebih netral.","c":false,"why":"ISO tidak memengaruhi warna."},{"t":"Mengatur white balance manual sekitar 3200 K atau preset Tungsten.","c":true,"why":"White balance yang sesuai sumber menghilangkan color cast."},{"t":"Memasang gel CTB pada lampu dengan WB tetap 5600 K.","c":true,"why":"CTB mengubah tungsten ke arah daylight, sehingga sumber cocok dengan setting kamera."}],"explain":"ISO tidak memengaruhi warna. Samakan sumber dan setting, lewat white balance atau gel."},{"id":"L1","kind":"pick","label":"Soal L1 · pilihan ganda","stem":"Kamu merekam adegan malam hari di gang dengan lampu jalan redup, 25 fps. Pengaturan: shutter 1/50, f/1.8 (sudah terbuka penuh), ISO 6400. Gambar penuh noise dan wajah aktor masih gelap. Tindakan paling tepat tanpa merusak gerak natural adalah...","instant":false,"exam":true,"opts":[["Memperlambat shutter ke 1/25.",0,"Memperbesar motion blur dan mengatur terang lewat shutter."],["Menambah cahaya pada wajah dengan lampu LED atau reflector, lalu menurunkan ISO.",1,"Masalahnya cahaya kurang. Cahaya tambahan memungkinkan ISO turun, jadi noise berkurang dan wajah terang."],["Menaikkan ISO ke 25600.",0,"Noise makin parah."],["Menutup aperture ke f/8.",0,"Gambar makin gelap."],["Mengganti white balance ke 6500 K.",0,"White balance mengatur warna, bukan terang."]]},{"id":"L2","kind":"mcma","label":"Soal L2 · penalaran · pilihan majemuk","stem":"Narasumber berdiri membelakangi jendela yang terang di dalam ruangan pada siang hari. Wajahnya gelap seperti siluet, sedangkan jendela terang. Tujuannya wajah terlihat jelas tanpa jendela menjadi putih polos. Pilih semua tindakan yang tepat:","exam":true,"opts":[["Menambah fill light atau reflector ke arah wajah narasumber.",1,"Mendekatkan terang wajah ke terang jendela."],["Memindahkan posisi narasumber agar menghadap jendela, atau berdiri menyamping dari jendela.",1,"Mengurangi selisih terang gelap dalam bingkai."],["Menaikkan shutter ke 1/1000 supaya jendela tidak putih.",0,"Menggelapkan seluruh gambar termasuk wajah, dan merusak gerak natural."],["Memeriksa histogram atau zebra setelah penyesuaian.",1,"Memverifikasi dengan data."],["Menaikkan ISO setinggi mungkin sampai wajah terang.",0,"Jendela makin clipping dan noise makin banyak."]]},{"id":"L3","kind":"tf","label":"Soal L3 · penalaran · benar atau salah","stem":"Adegan dialog ingin latar belakang blur halus agar perhatian penonton tertuju pada aktor. Tentukan benar atau salah:","exam":true,"opts":[{"t":"Memakai aperture besar, misalnya f/1.8.","c":true,"why":"Aperture besar (angka f kecil) membuat DoF dangkal sehingga latar blur."},{"t":"Menutup aperture ke f/11 supaya latar lebih halus.","c":false,"why":"f/11 membuat latar lebih tajam."},{"t":"Jika di luar ruangan terlalu terang pada f/1.8, memasang ND filter alih-alih menutup aperture.","c":true,"why":"ND mengurangi cahaya tanpa menutup aperture."}]}],"sectionsContent":{"b1":{"blocks":[{"type":"tebak","ids":["T1"]},{"type":"svg","svg":"<svg viewBox=\"0 0 520 170\" width=\"100%\" role=\"img\" aria-label=\"Segitiga eksposur: aperture, shutter, ISO\" style=\"display:block;max-width:520px;margin:6px auto\"><polygon points=\"260,26 110,138 410,138\" style=\"fill:var(--amber-bg);stroke:var(--amber)\" stroke-width=\"2\"/><circle cx=\"260\" cy=\"26\" r=\"14\" style=\"fill:var(--amber)\"/><circle cx=\"110\" cy=\"138\" r=\"14\" style=\"fill:var(--blue)\"/><circle cx=\"410\" cy=\"138\" r=\"14\" style=\"fill:var(--green)\"/><text x=\"260\" y=\"31\" text-anchor=\"middle\" font-weight=\"800\" font-size=\"14\" style=\"fill:var(--bg)\">f<\/text><text x=\"110\" y=\"143\" text-anchor=\"middle\" font-weight=\"800\" font-size=\"11\" style=\"fill:var(--bg)\">1/s<\/text><text x=\"410\" y=\"143\" text-anchor=\"middle\" font-weight=\"800\" font-size=\"11\" style=\"fill:var(--bg)\">ISO<\/text><text x=\"284\" y=\"31\" font-weight=\"800\" font-size=\"16\" style=\"fill:var(--ink)\">Aperture<\/text><text x=\"30\" y=\"166\" font-weight=\"800\" font-size=\"16\" style=\"fill:var(--ink)\">Shutter<\/text><text x=\"436\" y=\"143\" font-weight=\"800\" font-size=\"16\" style=\"fill:var(--ink)\">ISO<\/text><text x=\"260\" y=\"108\" text-anchor=\"middle\" font-size=\"13\" style=\"fill:var(--mute)\">terang gambar akhir<\/text><\/svg>"},{"type":"table","head":["Pengaturan","Aturan pokok","Efek samping"],"rows":[["<b>Aperture<\/b><br><span class=\"small\">angka f<\/span>","<b>Angka f kecil berarti bukaan besar<\/b>, sehingga cahaya masuk banyak.","DoF dangkal: <b>latar blur<\/b>."],["<b>Shutter<\/b><br><span class=\"small\">kecepatan rana<\/span>","Makin cepat, gambar makin gelap. Makin lambat, makin terang.","Cepat: gerak membeku. Lambat: <b>motion blur<\/b>."],["<b>ISO<\/b><br><span class=\"small\">sensitivitas sensor<\/span>","Makin tinggi, gambar makin terang.","Makin tinggi, <b>noise<\/b> makin banyak."]]},{"type":"callout","kind":"penting","tag":"Inti bagian 1","html":"<p>Tiap pengaturan punya \"harga\": aperture mengorbankan blur latar, shutter mengorbankan gerak, ISO mengorbankan kebersihan gambar. Kamu memilih sesuai <b>tujuan visual<\/b> adegan, lalu menyeimbangkan sisanya.<\/p>"},{"type":"lab","id":"b1"},{"type":"cek","ids":["C11","C12","C13"]}]},"b2":{"blocks":[{"type":"tebak","ids":["T2","T3"]},{"type":"html","html":"<h2>Shutter 180°<\/h2>"},{"type":"formula","html":"Shutter ≈ 1 / (2 × fps)"},{"type":"tiles","items":[{"small":"24 dan 25 fps","big":"1/50"},{"small":"30 fps","big":"1/60"},{"small":"50 fps","big":"1/100"}]},{"type":"html","html":"<h2>Flicker: berkedip atau pita gelap bergerak<\/h2><p>Listrik 50 Hz membuat lampu fluorescent dan LED berkedip sekitar <b>100 kali per detik<\/b>. Kalau shutter tidak selaras dengan kedipan itu, gambar berkedip atau muncul pita gelap yang bergerak. <b>Flicker bukan tanda kamera rusak.<\/b> Biasanya shutter yang tidak selaras.<\/p>"},{"type":"two","items":[{"cls":"g","html":"<span class=\"pill ok\">AMAN<\/span><div class=\"big\">1/50 dan 1/100<\/div>"},{"cls":"r","html":"<span class=\"pill no\">HINDARI<\/span><div class=\"big\">1/60 dan 1/125<\/div><div class=\"small\">di bawah lampu fluorescent atau LED<\/div>"}]},{"type":"shutterCalc"},{"type":"callout","kind":"waspada","tag":"Aturan penting","html":"<p><b>Jangan atur terang gelap dengan shutter.<\/b> Shutter cepat membuat gerak tampak membeku dan tidak natural. Pakai ND filter, aperture, atau ISO.<\/p>"},{"type":"html","html":"<h2>White balance dan suhu warna<\/h2>"},{"type":"kel","items":[{"left":7,"k":"1900 K","label":"lilin"},{"left":28,"k":"3200 K","label":"tungsten"},{"left":66,"k":"5600 K","label":"siang"},{"left":89,"k":"6500 K+","label":"mendung"}]},{"type":"html","html":"<p class=\"small\">Cahaya hangat bersuhu warna <b>rendah<\/b>. Kelvin tinggi cenderung kebiruan.<\/p>"},{"type":"table","head":["Kondisi","Hasil (color cast)"],"rows":[["Kamera diatur 5600 K di bawah lampu tungsten","<b>Kuning-oranye<\/b>"],["Kamera diatur 3200 K di cahaya siang","<b>Kebiruan<\/b>"]]},{"type":"html","html":"<p><b>Cahaya campuran:<\/b> seragamkan sumbernya, atau pakai gel di lampu. <b>CTB<\/b> mengubah tungsten ke arah daylight. <b>CTO<\/b> mengubah daylight ke arah tungsten. Pilihan lain: samakan white balance kamera dengan sumber cahaya.<\/p>"},{"type":"wb"},{"type":"cek","ids":["C21","C22","C23","C24"]}]},"b3":{"blocks":[{"type":"tebak","ids":["T4"]},{"type":"html","html":"<h2>Tiga alat ukur<\/h2>"},{"type":"html","html":"<div class=\"vis\"><div><svg viewBox=\"0 0 250 110\" role=\"img\" aria-label=\"Histogram dengan puncak terpotong di kanan\"><rect width=\"250\" height=\"110\" rx=\"10\" style=\"fill:var(--surface2)\"/><rect x=\"10\" y=\"80\" width=\"16\" height=\"20\" style=\"fill:var(--blue)\"/><rect x=\"30\" y=\"66\" width=\"16\" height=\"34\" style=\"fill:var(--blue)\"/><rect x=\"50\" y=\"48\" width=\"16\" height=\"52\" style=\"fill:var(--blue)\"/><rect x=\"70\" y=\"26\" width=\"16\" height=\"74\" style=\"fill:var(--blue)\"/><rect x=\"90\" y=\"14\" width=\"16\" height=\"86\" style=\"fill:var(--blue)\"/><rect x=\"110\" y=\"22\" width=\"16\" height=\"78\" style=\"fill:var(--blue)\"/><rect x=\"130\" y=\"44\" width=\"16\" height=\"56\" style=\"fill:var(--blue)\"/><rect x=\"150\" y=\"60\" width=\"16\" height=\"40\" style=\"fill:var(--blue)\"/><rect x=\"170\" y=\"72\" width=\"16\" height=\"28\" style=\"fill:var(--blue)\"/><rect x=\"190\" y=\"66\" width=\"16\" height=\"34\" style=\"fill:var(--blue)\"/><rect x=\"210\" y=\"22\" width=\"14\" height=\"78\" style=\"fill:var(--red)\"/><rect x=\"228\" y=\"12\" width=\"12\" height=\"88\" style=\"fill:var(--red)\"/><\/svg><b>Histogram<\/b><div class=\"small\">Kiri gelap, kanan terang. Terpotong di tepi berarti <b>clipping<\/b>.<\/div><\/div><div><svg viewBox=\"0 0 250 110\" role=\"img\" aria-label=\"Zebra: garis diagonal pada area terlalu terang\"><defs><pattern id=\"zb\" width=\"12\" height=\"12\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><rect width=\"6\" height=\"12\" style=\"fill:var(--ink)\"/><\/pattern><\/defs><rect width=\"250\" height=\"110\" rx=\"10\" style=\"fill:var(--surface2)\"/><rect x=\"128\" width=\"122\" height=\"110\" rx=\"10\" fill=\"url(#zb)\"/><\/svg><b>Zebra<\/b><div class=\"small\">Sekitar <b>70%<\/b> untuk eksposur kulit. <b>95 sampai 100%<\/b> menandai clipping.<\/div><\/div><div><svg viewBox=\"0 0 250 110\" role=\"img\" aria-label=\"False color: peta warna kecerahan\"><defs><linearGradient id=\"fc\" x1=\"0\" x2=\"1\"><stop offset=\"0\" stop-color=\"#3a4fff\"/><stop offset=\".25\" stop-color=\"#20c4ff\"/><stop offset=\".5\" stop-color=\"#3ddc84\"/><stop offset=\".75\" stop-color=\"#ffe14a\"/><stop offset=\"1\" stop-color=\"#ff5a3d\"/><\/linearGradient><\/defs><rect width=\"250\" height=\"110\" rx=\"10\" fill=\"url(#fc)\"/><\/svg><b>False color<\/b><div class=\"small\">Peta warna kecerahan. Jangan hanya percaya layar kecil.<\/div><\/div><\/div>"},{"type":"callout","kind":"penting","tag":"Kebiasaan","html":"<p><b>Jangan hanya percaya layar kecil.<\/b> Selalu periksa histogram atau zebra, dan putar ulang rekaman di layar yang lebih besar.<\/p>"},{"type":"html","html":"<h2>Dynamic range<\/h2><p>Dynamic range adalah <b>rentang terang gelap yang masih menyimpan detail<\/b>. Di luar rentang itu, bagian terlalu terang menjadi putih polos dan bagian terlalu gelap menjadi hitam polos.<\/p>"},{"type":"table","head":["Kesalahan","Akibat"],"rows":[["<b>Overexposure<\/b>","Highlight hilang <b>secara permanen<\/b>."],["<b>Underexposure<\/b> lalu dicerahkan","Muncul <b>noise<\/b>."]]},{"type":"html","html":"<p><b>Adegan melebihi rentang kamera?<\/b> Tambah fill atau reflector, pindah posisi, atau eksposi untuk bagian yang paling penting.<\/p><h2>ND filter dan hitungan stop<\/h2><p>ND filter mengurangi cahaya <b>tanpa mengubah warna<\/b>. Dipakai di luar ruangan agar aperture tetap lebar dan shutter tetap sesuai aturan 180°.<\/p>"},{"type":"tiles","items":[{"small":"ND 0.3","big":"1","foot":"stop"},{"small":"ND 0.6","big":"2","foot":"stop"},{"small":"ND 0.9","big":"3","foot":"stop"},{"small":"ND 1.2","big":"4","foot":"stop"}]},{"type":"html","html":"<p><b>Tabel stop.<\/b> Satu langkah ke kanan mengurangi cahaya setengah, kecuali ISO yang menggandakannya.<\/p>"},{"type":"table","rows":[["<th>Aperture<\/th><td>f/1.4 → f/2 → f/2.8 → f/4 → f/5.6 → f/8 → f/11 → f/16<\/td>"],["<th>Shutter<\/th><td>1/25 → 1/50 → 1/100 → 1/200 → 1/400 → 1/800<\/td>"],["<th>ISO<\/th><td>100 → 200 → 400 → 800 → 1600 <span class=\"small\">(tiap langkah: dua kali lebih terang)<\/span><\/td>"]]},{"type":"lab","id":"b3"},{"type":"cek","ids":["C31","C32","C33","C34","C35"]}]},"b4":{"blocks":[{"type":"tebak","ids":["T5"]},{"type":"steps","items":[{"title":"Tentukan tujuan visual","desc":"Gerak natural? Latar blur? Hasil bersih?"},{"title":"Shutter dari fps dan listrik","desc":"25 fps dan 50 Hz berarti 1/50"},{"title":"Aperture sesuai DoF","desc":"latar blur atau latar tajam"},{"title":"ISO serendah mungkin","desc":"supaya noise tetap sedikit"},{"title":"ND atau tambahan cahaya","desc":"menyeimbangkan sisa terang tanpa mengubah tiga langkah sebelumnya"},{"title":"Sesuaikan white balance","desc":"samakan dengan sumber cahaya"},{"title":"Verifikasi dengan alat ukur","desc":"histogram, zebra, false color"}]},{"type":"html","html":"<h2>Contoh terpecahkan<\/h2>"},{"type":"panel","html":"<b>Skenario.<\/b> Kamu merekam pertunjukan musik di panggung gedung serba guna yang memakai lampu LED. Kamera 25 fps, shutter 1/200, ISO 400, f/2.8. Eksposur sudah pas, tetapi di layar tampak pita terang gelap bergerak dan gambar berkedip. Tujuan: gerak natural dan panggung tidak berkedip."},{"type":"html","html":"<p class=\"small\">Coba tebak keputusan tiap langkah di kepalamu, lalu tampilkan jawabannya satu per satu.<\/p>"},{"type":"ex","items":[]},{"type":"html","html":"<h2>Giliran kamu<\/h2>"},{"type":"panel","html":"<b>Skenario.<\/b> Wawancara di halaman sekolah pukul 12 siang. Kamera 25 fps, shutter 1/50, ISO 100, f/2.8. Tujuan: gerak natural dan latar blur. Zebra memenuhi wajah dan histogram terpotong di kanan. Kamu menilai gambar kelebihan sekitar <b>3 stop<\/b>. Putuskan tiap langkah."},{"type":"qlist","ids":["W1","W2","W3","W4","W5","W6","W7"]},{"type":"html","html":"<h2>Empat salah kaprah yang paling sering<\/h2>"},{"type":"table","head":["<span class=\"pill no\">SALAH<\/span>","<span class=\"pill ok\">BENAR<\/span>"],"rows":[["<td class=\"strike\">f/2.8 itu bukaan kecil karena angkanya kecil.<\/td>","<b>Angka f kecil berarti bukaan besar.<\/b>"],["<td class=\"strike\">Shutter bebas dipakai mengatur terang di video.<\/td>","<b>Pakai ND, aperture, atau ISO agar gerak tetap natural.<\/b>"],["<td class=\"strike\">Kelvin tinggi berarti cahaya lebih hangat.<\/td>","<b>Cahaya hangat bersuhu warna rendah; setting WB terlalu rendah membuat gambar kebiruan.<\/b>"],["<td class=\"strike\">Flicker berarti kamera rusak.<\/td>","<b>Biasanya shutter tidak selaras dengan frekuensi lampu 50 Hz.<\/b>"]]}]},"latihan":{"blocks":[{"type":"callout","kind":"penting","tag":"Strategi menjawab","html":"<ol><li><b>Garisbawahi kendala di soal<\/b>, misalnya \"tanpa merusak gerak natural\" atau \"tanpa mengubah tujuan estetika\". Kalimat itulah yang menentukan jawaban.<\/li><li><b>Tebak penyebabnya dulu<\/b> sebelum membaca pilihan. Cocokkan dengan alur diagnosis.<\/li><li><b>Coret pilihan sambil menyebut alasan<\/b>, misalnya \"ini melanggar tujuan latar blur\". Jawaban yang memperbaiki gejala tetapi merusak tujuan estetika adalah jebakan.<\/li><li>Pilihan majemuk dan benar-salah: <b>nilai tiap pernyataan sendiri-sendiri.<\/b><\/li><\/ol>"},{"type":"qlist","ids":["S2","S3","S4"]}]},"cek":{"blocks":[{"type":"callout","kind":"penting","tag":"Cara mengerjakan","html":"Kerjakan tanpa membuka bagian lain. Tiap soal bernilai 1 poin; soal pilihan majemuk dan benar-salah bernilai 1 hanya jika <b>semua pernyataan<\/b> tepat. Pembahasan terbuka setelah ketiga soal dikunci."},{"type":"qlist","ids":["L1","L2","L3"]}]},"praktik":{"blocks":[{"type":"panel","html":"<b>Yang disiapkan:<\/b> HP, selembar kertas putih (HVS atau karton), satu lampu rumah yang bisa dinyalakan, dan cahaya dari jendela. Catatanmu tersimpan otomatis."},{"type":"html","html":"<h2>Percobaan A · Uji flicker <span class=\"small\">(10 menit)<\/span><\/h2><p>Butuh HP dengan mode <b>Pro atau manual<\/b> untuk mengatur shutter. Atur 25 fps. Rekam lampu yang menyala, lalu putar ulang. Kalau ada bohlam LED dan lampu jenis lain di rumahmu, bandingkan keduanya: LED murah lebih sering berkedip.<\/p>"},{"type":"checklist","items":[{"id":"pa1","text":"HP diatur ke 25 fps dan mode Pro atau manual"},{"id":"pa2","text":"Prediksi sudah ditulis di tabel"},{"id":"pa3","text":"Merekam lampu pada tiga shutter"},{"id":"pa4","text":"Memutar ulang dan mengisi hasil"}]},{"type":"table","head":["Shutter (pilih yang terdekat di HP-mu)","Prediksi: berkedip?","Hasil: berkedip?"],"rows":[["1/50","<input type=\"text\" data-note=\"a0p\" placeholder=\"\">","<input type=\"text\" data-note=\"a0h\" placeholder=\"\">"],["1/60","<input type=\"text\" data-note=\"a1p\" placeholder=\"\">","<input type=\"text\" data-note=\"a1h\" placeholder=\"\">"],["1/200","<input type=\"text\" data-note=\"a2p\" placeholder=\"\">","<input type=\"text\" data-note=\"a2h\" placeholder=\"\">"]]},{"type":"html","html":"<p class=\"small\">Tidak ada mode manual? Rekam lampu LED dan lampu lain dengan mode otomatis, amati ada atau tidaknya pita bergerak, lalu catat. Jangan menyimpulkan tentang shutter dari percobaan ini.<\/p><h2>Percobaan B · Uji white balance <span class=\"small\">(10 menit)<\/span><\/h2><p>Foto atau rekam kertas putih di bawah (1) lampu bohlam kuning dan (2) cahaya jendela siang. Mulai dengan white balance otomatis. Jika HP-mu punya pengaturan manual, coba juga Tungsten dan Daylight. Tulis dulu prediksimu tentang warna kertas.<\/p>"},{"type":"checklist","items":[{"id":"pb1","text":"Prediksi warna kertas sudah ditulis"},{"id":"pb2","text":"Merekam kertas di bawah bohlam dan cahaya jendela"},{"id":"pb3","text":"Membandingkan hasil dengan prediksi"}]},{"type":"table","head":["Sumber, WB","Prediksi warna","Hasil"],"rows":[["Bohlam kuning, otomatis","<input type=\"text\" data-note=\"b0p\" placeholder=\"\">","<input type=\"text\" data-note=\"b0h\" placeholder=\"\">"],["Bohlam kuning, Daylight","<input type=\"text\" data-note=\"b1p\" placeholder=\"\">","<input type=\"text\" data-note=\"b1h\" placeholder=\"\">"],["Cahaya jendela, Tungsten","<input type=\"text\" data-note=\"b2p\" placeholder=\"\">","<input type=\"text\" data-note=\"b2h\" placeholder=\"\">"]]},{"type":"html","html":"<h2>Percobaan C · Wajah di depan jendela <span class=\"small\">(10 menit)<\/span><\/h2><p>Minta temanmu atau anggota keluarga berdiri membelakangi jendela terang, lalu rekam atau foto. Setelah itu perbaiki dengan <b>pindah posisi<\/b> atau memantulkan cahaya ke wajah memakai kertas putih sebagai reflector. Jika HP-mu menampilkan histogram, bandingkan kedua hasil.<\/p>"},{"type":"checklist","items":[{"id":"pc1","text":"Merekam wajah membelakangi jendela"},{"id":"pc2","text":"Memperbaiki dengan pindah posisi atau reflector"},{"id":"pc3","text":"Menulis apa yang berubah pada wajah dan jendela"}]},{"type":"html","html":"<textarea data-note=\"c1\" placeholder=\"Apa yang berubah pada wajah dan pada jendela?\"><\/textarea><p class=\"small\"><b>Opsional:<\/b> jika HP-mu punya pengaturan bukaan (f/...), ambil satu objek pada bukaan terbesar dan terkecil. Samakan terangnya lewat ISO atau cahaya, lalu bandingkan blur latar dan noise.<\/p>"},{"type":"callout","kind":"waspada","tag":"Keselamatan","html":"<ul><li>Bohlam panas: jangan disentuh, matikan sebelum dipindahkan. Jangan memanjat kursi atau meja, jangan menarik kabel, dan jangan menumpuk alat pada satu stop kontak.<\/li><li>Rekam orang lain hanya dengan izinnya, dan jangan merekam di jalan raya.<\/li><\/ul>"}]},"kartu":{"blocks":[{"type":"html","html":"<p class=\"lead\">Gejala, penyebab, dan solusi yang tidak merusak tujuan estetika. Kartu ini dipakai lagi di Modul 6.<\/p>"},{"type":"cards","items":[{"title":"Berkedip atau ada pita gelap bergerak","penyebab":"Shutter tidak selaras dengan listrik 50 Hz (misalnya 1/60 atau 1/125)","solusi":"Shutter 1/50 untuk 24 dan 25 fps, atau 1/100 untuk 50 fps"},{"title":"Overexposed, terutama siang terik","penyebab":"Cahaya melebihi eksposur pada aperture dan shutter yang dipilih","solusi":"ND filter, area teduh, atau diffuser. Periksa dengan zebra 95 sampai 100% atau histogram. Jangan pakai shutter untuk mengatur terang."},{"title":"Noise","penyebab":"ISO tinggi, atau gambar gelap yang dicerahkan","solusi":"Turunkan ISO, tambah cahaya atau reflector"},{"title":"Color cast kuning-oranye atau kebiruan","penyebab":"White balance tidak cocok dengan suhu warna sumber","solusi":"Atur WB sesuai sumber, atau pakai gel CTB atau CTO. Seragamkan sumber cahaya campuran."},{"title":"Detail hilang di area terang dan gelap sekaligus","penyebab":"Adegan melebihi dynamic range kamera","solusi":"Tambah fill atau reflector, pindah posisi, atau eksposi untuk bagian terpenting"}]},{"type":"html","html":"<h2>Alur 7 langkah<\/h2>"},{"type":"steps","items":[{"title":"Tentukan tujuan visual"},{"title":"Shutter dari fps dan listrik"},{"title":"Aperture sesuai DoF"},{"title":"ISO serendah mungkin"},{"title":"ND atau tambahan cahaya"},{"title":"Sesuaikan white balance"},{"title":"Verifikasi dengan alat ukur"}]},{"type":"two","items":[{"cls":"g","html":"<b>Ingat stop<\/b><br>ND 0.3 = 1 · 0.6 = 2 · 0.9 = 3 · 1.2 = 4 stop"},{"cls":"g","html":"<b>Ingat shutter<\/b><br>24 dan 25 fps = 1/50 · 30 fps = 1/60 · 50 fps = 1/100"}]}]}}},{"meta":{"id":2,"storageKey":"fke-modul2-mandiri-v1","topKick":"Modul 2","kicker":"Modul 2 · Persiapan TKA 2026 · Belajar mandiri","title":"Tata Cahaya","intro":"Jika Modul 1 mengajarkan cara kamera menerima cahaya, modul ini mengajarkan cara membentuk dan mengendalikan cahaya itu: kualitas, arah, intensitas, warna, dan keselamatannya.","chips":[{"label":"Memahami","color":"#ffb454"},{"label":"Menerapkan","color":"#7cc0ff"},{"label":"Menalar","color":"#7fe0a8"}],"howto":["<b>1. Tebak dulu, baru baca.<\/b> Tiap bagian dibuka dengan kotak <span class=\"small\">Tebak dulu<\/span>. Pilih jawabanmu sebelum membaca penjelasan.","<b>2. Cek paham.<\/b> Setelah penjelasan, jawab kotak <span class=\"small\">Cek paham<\/span>. Pembahasan muncul langsung.","<b>3. Praktik.<\/b> Empat praktik dengan gear sekolah ada di bagian akhir. Kerjakan berkelompok dan bergantian."],"objectives":["<b>Memahami:<\/b> menjelaskan empat atribut cahaya dan fungsi key, fill, back light, serta karakter berbagai sumber cahaya.","<b>Menerapkan:<\/b> menyusun pencahayaan tiga titik dengan peralatan terbatas, termasuk reflector sebagai fill; menghitung beban listrik.","<b>Menalar:<\/b> menganalisis masalah pencahayaan dan risiko K3 kelistrikan, lalu memilih perbaikan yang tepat."]},"sections":[{"id":"mulai","nav":"Mulai","title":"Tata Cahaya"},{"id":"b1","nav":"Bagian 1","title":"Empat atribut cahaya","time":"15 menit"},{"id":"b2","nav":"Bagian 2","title":"Sumber cahaya dan karakter","time":"20 menit"},{"id":"b3","nav":"Bagian 3","title":"Three-point lighting","time":"25 menit"},{"id":"b4","nav":"Bagian 4","title":"Modifier","time":"20 menit"},{"id":"b5","nav":"Bagian 5","title":"Jarak dan intensitas","time":"15 menit"},{"id":"b6","nav":"Bagian 6","title":"K3 kelistrikan di set","time":"25 menit"},{"id":"latihan","nav":"Latihan","title":"Latihan soal bergaya TKA","time":"25 menit"},{"id":"cek","nav":"Cek akhir","title":"Uji dirimu sendiri","time":"10 menit"},{"id":"praktik","nav":"Praktik","title":"Praktik dengan gear sekolah","time":"50 menit"},{"id":"kartu","nav":"Kartu","title":"Kartu diagnosis cahaya"}],"sectionQuestions":{"b1":["T1","C11","C12"],"b2":["T2","C21","C22","C23"],"b3":["T3","C31","C32","C33"],"b4":["T4","C41","C42"],"b5":["T5","C51","C52"],"b6":["T6","C61","C62","C63"],"latihan":["S1","S2","S3","S4"],"cek":["L1","L2","L3"]},"praktikChecks":["pa1","pa2","pa3","pa4","pb1","pb2","pb3","pb4","pc1","pc2","pc3","pc4","pd1","pd2","pd3","pd4"],"labs":{},"questions":[{"id":"T1","kind":"pick","label":"T1","stem":"Cahaya lembut (soft light) itu sama dengan cahaya yang redup. Benar atau salah?","bare":true,"opts":[["Benar"],["Salah",1]],"explain":"Salah. Lembut atau keras ditentukan oleh ukuran dan jarak sumber cahaya, bukan oleh terang atau redupnya."},{"id":"T2","kind":"pick","label":"T2","stem":"Sumber cahaya mana yang paling rawan menimbulkan flicker di ruangan?","bare":true,"opts":[["Matahari siang"],["Lampu fluorescent",1],["Lampu tungsten"],["Lampu LED mahal"]],"explain":"Lampu fluorescent berkedip sekitar 100 kali per detik di listrik 50 Hz. Sumber utama flicker di ruangan."},{"id":"T3","kind":"pick","label":"T3","stem":"Dalam three-point lighting, lampu mana yang berfungsi memisahkan subjek dari latar?","bare":true,"opts":[["Key light"],["Fill light"],["Back light",1]],"explain":"Back light memberi tepi cahaya di rambut dan bahu, memisahkan subjek dari latar."},{"id":"T4","kind":"pick","label":"T4","stem":"Reflector dapat menggantikan lampu fill. Mengapa ini menguntungkan?","bare":true,"opts":[["Karena reflector lebih mahal"],["Karena tidak menambah beban listrik dan kabel",1],["Karena reflector menambah warna"]],"explain":"Reflector memantulkan cahaya key tanpa menambah beban listrik, kabel, atau risiko K3."},{"id":"T5","kind":"pick","label":"T5","stem":"Jika jarak lampu ke subjek dilipatgandakan, cahaya yang diterima menjadi...","bare":true,"opts":[["Setengah"],["Seperempat",1],["Tetap"],["Dua kali"]],"explain":"Hukum kuadrat terbalik: jarak dua kali berarti cahaya seperempat (turun 2 stop)."},{"id":"T6","kind":"pick","label":"T6","stem":"Kabel rol yang masih tergulung dipakai untuk beban besar. Apa risikonya?","bare":true,"opts":[["Kabel jadi lebih rapi"],["Gulungan menahan panas, kabel bisa meleleh",1],["Tidak ada risiko"]],"explain":"Gulungan menahan panas sehingga kabel bisa memanas dan meleleh. Urai sepenuhnya sebelum dipakai untuk beban besar."},{"id":"C11","kind":"pick","label":"1.1","stem":"Manakah yang membuat cahaya paling lembut?","bare":true,"opts":[["Sumber kecil dan jauh"],["Sumber besar dan dekat",1],["Sumber kecil dan dekat"]],"explain":"Sumber besar dan dekat membuat cahaya lembut. Sumber kecil atau jauh membuat cahaya keras."},{"id":"C12","kind":"pick","label":"1.2","stem":"Arah cahaya mana yang paling membuat wajah tampak datar?","bare":true,"opts":[["Dari samping"],["Dari depan sejajar kamera",1],["Dari belakang"]],"explain":"Cahaya dari depan cenderung menghilangkan dimensi sehingga wajah tampak datar."},{"id":"C21","kind":"pick","label":"2.1","stem":"Sumber cahaya dengan suhu warna sekitar 3200 K adalah...","bare":true,"opts":[["Matahari siang"],["Tungsten",1],["Mendung"]],"explain":"Tungsten sekitar 3200 K. Matahari siang 5600 K, mendung 6500 K atau lebih."},{"id":"C22","kind":"pick","label":"2.2","stem":"Mengapa lampu tungsten butuh daya besar?","bare":true,"opts":[["Karena warnanya hangat"],["Karena banyak energi terbuang sebagai panas",1],["Karena tidak bisa diredupkan"]],"explain":"Tungsten sangat panas; sebagian besar daya menjadi panas, bukan cahaya."},{"id":"C23","kind":"pick","label":"2.3","stem":"Yang perlu dicek pada bohlam LED rumah sebelum dipakai praktik adalah...","bare":true,"opts":[["Warna kabelnya"],["Label Kelvin dan daya (watt)",1],["Merek lampu"]],"explain":"Label Kelvin menentukan suhu warna; daya menentukan beban listrik. Keduanya wajib dicek."},{"id":"C31","kind":"pick","label":"3.1","stem":"Fungsi fill light adalah...","bare":true,"opts":[["Menentukan eksposur"],["Melunakkan bayangan yang dibuat key",1],["Memisahkan subjek dari latar"]],"explain":"Fill mengisi bayangan yang dibuat key dan mengatur kontras."},{"id":"C32","kind":"pick","label":"3.2","stem":"Penempatan key light yang umum adalah...","bare":true,"opts":[["45° dari kamera, sedikit di atas level mata",1],["Tepat di belakang subjek"],["Di bawah dagu"]],"explain":"Key sekitar 45° dari kamera, sedikit di atas level mata."},{"id":"C33","kind":"pick","label":"3.3","stem":"Rasio cahaya 4:1 setara dengan selisih...","bare":true,"opts":[["1 stop"],["2 stop",1],["3 stop"],["4 stop"]],"explain":"Rasio 2:1 = 1 stop, 4:1 = 2 stop, 8:1 = 3 stop."},{"id":"C41","kind":"pick","label":"4.1","stem":"Alat yang berfungsi menahan cahaya agar tidak jatuh ke area tertentu adalah...","bare":true,"opts":[["Reflector"],["Diffuser"],["Flag atau negative fill",1]],"explain":"Flag atau negative fill menghalangi cahaya dan memperdalam bayangan."},{"id":"C42","kind":"pick","label":"4.2","stem":"Gel CTB pada lampu tungsten berfungsi untuk...","bare":true,"opts":[["Mendinginkan lampu"],["Mengubah warna ke arah daylight",1],["Menambah intensitas"]],"explain":"CTB mengubah tungsten ke arah daylight. CTO kebalikannya."},{"id":"C51","kind":"pick","label":"5.1","stem":"Lampu pada jarak 4 meter dari subjek. Cahaya yang diterima sekitar...","bare":true,"opts":[["50%"],["25%"],["6%",1],["100%"]],"explain":"Menurut tabel, 4 meter sekitar 6% dari acuan 1 meter (turun 4 stop)."},{"id":"C52","kind":"pick","label":"5.2","stem":"Untuk mengubah intensitas tanpa mengubah karakter cahaya, sebaiknya memakai...","bare":true,"opts":[["Jarak"],["Dimmer",1],["Gel"],["Diffuser"]],"explain":"Menggeser lampu juga mengubah kualitas cahaya. Dimmer mengubah intensitas tanpa mengubah karakter."},{"id":"C61","kind":"pick","label":"6.1","stem":"Total beban listrik dihitung dengan rumus...","bare":true,"opts":[["A = W × 220"],["A = W : 220",1],["A = 220 : W"]],"explain":"Ampere = Watt dibagi 220 V."},{"id":"C62","kind":"pick","label":"6.2","stem":"Sebelum memindahkan lampu yang sedang menyala, sebaiknya...","bare":true,"opts":[["Langsung dipindah"],["Dimatikan atau dikurangi dayanya",1],["Ditutup dengan kain"]],"explain":"Matikan atau kurangi daya sebelum memindahkan lampu; nyalakan bertahap, satu per satu."},{"id":"C63","kind":"pick","label":"6.3","stem":"Menumpuk terminal listrik aman selama lampunya tidak terlalu banyak. Benar atau salah?","bare":true,"opts":[["Benar"],["Salah",1]],"explain":"Salah. Yang menentukan adalah total beban terhadap kapasitas, bukan jumlah lubang."},{"id":"S1","kind":"pick","label":"Soal 1 · pengetahuan · pilihan ganda","stem":"Seorang penata cahaya ingin menghasilkan bayangan yang paling lembut pada wajah narasumber. Kondisi yang paling tepat adalah...","instant":false,"opts":[["Memakai lampu kecil dan menjauhkannya dari narasumber",0,"Lampu kecil dan jauh justru menghasilkan cahaya keras."],["Memakai sumber cahaya yang besar (misalnya dengan diffuser) dan mendekatkannya ke narasumber",1,"Kelembutan ditentukan oleh ukuran sumber relatif terhadap subjek dan jaraknya. Sumber besar dan dekat menghasilkan bayangan paling lembut."],["Menyorotkan lampu tanpa diffuser dari jarak jauh",0,"Tanpa diffuser dan dari jarak jauh, cahaya menjadi keras."],["Menurunkan daya lampu sampai paling redup",0,"Redup tidak mengubah kualitas bayangan."],["Mengganti gel menjadi CTO",0,"Gel CTO mengubah warna, bukan kualitas bayangan."]]},{"id":"S2","kind":"pick","label":"Soal 2 · aplikasi · pilihan ganda","stem":"Presenter berdiri di depan latar gelap dan hanya disinari satu lampu dari samping. Hasilnya wajah tampak menyatu dengan latar, dan sisi wajah yang jauh dari lampu hampir hitam. Tindakan paling tepat adalah...","instant":false,"opts":[["Menambah back light di belakang-atas presenter dan reflector sebagai fill di sisi bayangan",1,"Back light memisahkan subjek dari latar, dan fill mengisi sisi yang gelap."],["Menaikkan ISO ke 3200",0,"ISO tidak mengubah pola cahaya."],["Mendekatkan lampu sampai bayangan hilang sepenuhnya",0,"Mendekatkan lampu tidak menghasilkan fill dan bisa membuat overexposed."],["Mengubah white balance ke 3200 K",0,"White balance hanya mengubah warna."],["Memasang gel CTO pada lampu",0,"Gel CTO hanya mengubah warna."]]},{"id":"S3","kind":"mcma","label":"Soal 3 · penalaran · pilihan majemuk","stem":"Dalam sebuah produksi di studio, empat lampu LED dan dua bohlam dihubungkan ke satu terminal berlubang banyak lewat kabel rol 15 meter yang masih tergulung. Terminal terasa hangat dan kabel melintang di lantai. Produksi tidak boleh berhenti lama. Manakah tindakan yang tepat?","opts":[["Mengurai kabel rol sepenuhnya sebelum dipakai.",1,"Gulungan menahan panas; urai sepenuhnya."],["Menjumlahkan daya semua lampu dan membandingkannya dengan kapasitas terminal.",1,"Hitung beban sebelum menyalakan."],["Menyambung terminal kedua ke terminal pertama agar semua lampu tersambung.",0,"Menambah beban pada terminal pertama; berisiko kelebihan beban."],["Menutup kabel di lantai dengan lakban atau cable protector dan mengarahkannya menjauh dari jalur jalan.",1,"Mengamankan jalur kabel tanpa menghentikan produksi."],["Menutup lampu dengan kain rapat agar cahayanya lembut dan aman.",0,"Menutup lampu dengan kain menimbulkan risiko panas."],["Mengabaikan karena produksi harus tetap berjalan.",0,"Membiarkan bahaya K3."]],"explain":"Tiga bahaya utama (kabel tergulung, kelebihan beban, jalur kabel) diatasi tanpa menghentikan produksi lama."},{"id":"S4","kind":"tf","label":"Soal 4 · penalaran · benar atau salah","stem":"Sebuah lampu LED kecil berjarak 1 meter dari narasumber, lalu digeser menjadi 2 meter tanpa mengubah daya dan pengaturan kamera. Tentukan benar atau salah untuk setiap pernyataan.","opts":[{"t":"Cahaya yang diterima narasumber menjadi sekitar seperempatnya.","c":true,"why":"Hukum kuadrat terbalik: jarak dua kali berarti cahaya seperempat."},{"t":"Eksposur wajah turun sekitar dua stop.","c":true,"why":"Seperempat cahaya sama dengan turun 2 stop."},{"t":"Cahaya menjadi lebih lembut karena sumbernya lebih jauh.","c":false,"why":"Sumber kecil yang makin jauh justru menghasilkan cahaya lebih keras, bukan lebih lembut."}],"explain":"Jarak memengaruhi intensitas (kuadrat terbalik) dan kualitas (makin jauh makin keras untuk sumber kecil)."},{"id":"L1","kind":"pick","label":"Soal L1 · penalaran · pilihan ganda","stem":"Wawancara di ruangan dengan jendela besar pada siang hari. Wajah narasumber tampak sebagian kebiruan (dari jendela) dan sebagian kekuningan (dari bohlam tungsten). Tindakan paling tepat adalah...","instant":false,"exam":true,"opts":[["Menaikkan ISO.",0,"ISO tidak mengubah warna."],["Menutup jendela atau menyeragamkan sumber cahaya, lalu WB manual dengan kartu putih.",1,"Menyeragamkan sumber dan WB manual menghilangkan color cast campuran."],["Mempercepat shutter.",0,"Shutter mengatur gerak dan terang, bukan warna."],["Menambah lampu berwarna ketiga tanpa gel.",0,"Menambah sumber warna baru memperparah masalah."],["Mengubah aperture.",0,"Aperture mengatur terang dan DoF, bukan warna."]]},{"id":"L2","kind":"mcma","label":"Soal L2 · penalaran · pilihan majemuk","stem":"Wawancara malam di bawah lampu jalan. Kamera 25 fps, ISO 6400, f/4, shutter 1/50. Hasil penuh noise. Sutradara ingin mengurangi noise tanpa mengubah gerak natural dan kedalaman ruang tajam. Pilih semua tindakan yang tepat:","exam":true,"opts":[["Menambah cahaya pada wajah dengan lampu LED atau reflector, lalu menurunkan ISO.",1,"Menambah cahaya memungkinkan ISO turun, jadi noise berkurang tanpa mengubah gerak dan DoF."],["Menaikkan shutter ke 1/200.",0,"Merusak gerak natural."],["Menutup aperture ke f/11.",0,"Mengubah DoF dan memperparah kekurangan cahaya."],["Memasang ND filter.",0,"ND mengurangi cahaya, memperparah masalah."],["Memperlambat shutter ke 1/25.",0,"Merusak gerak natural dan membuat gambar lebih terang."],["Memeriksa histogram setelah penyesuaian.",1,"Verifikasi dengan data."]],"explain":"Setiap pernyataan dinilai sendiri. Yang benar memperbaiki penyebab (cahaya kurang) tanpa merusak tujuan."},{"id":"L3","kind":"tf","label":"Soal L3 · penalaran · benar atau salah","stem":"Sebuah adegan dialog di ruang tamu. Sutradara ingin suasana hangat dan intim dengan kontras sedang. Tentukan benar atau salah untuk setiap pernyataan.","exam":true,"opts":[{"t":"Memakai key light dengan gel CTO untuk kesan hangat.","c":true,"why":"CTO memberi warna hangat pada cahaya."},{"t":"Menambah fill light sekuat key agar tidak ada bayangan sama sekali.","c":false,"why":"Fill sekuat key menghilangkan dimensi; rasio terlalu kecil."},{"t":"Menjaga rasio key terhadap fill sekitar 4:1 untuk kontras sedang.","c":true,"why":"Rasio 4:1 setara 2 stop; memberi dimensi tanpa terlalu dramatis."}],"explain":"Kontras sedang berarti ada bayangan yang membentuk dimensi, tetapi tidak berlebihan."}],"sectionsContent":{"b1":{"blocks":[{"type":"tebak","ids":["T1"]},{"type":"table","head":["Atribut","Penjelasan","Pengaruh pada gambar"],"rows":[["<b>Kualitas<\/b>","Keras atau lembut. Cahaya lembut berasal dari sumber yang besar relatif terhadap subjek dan dekat dengan subjek; cahaya keras berasal dari sumber kecil atau jauh.","Keras: bayangan tegas, tekstur kuat. Lembut: bayangan tepi halus, kulit tampak lebih mulus."],["<b>Arah<\/b>","Posisi sumber terhadap subjek dan kamera: depan, samping, belakang, atas.","Depan cenderung datar; samping memberi dimensi; belakang memisahkan subjek dari latar atau membentuk siluet."],["<b>Intensitas<\/b>","Seberapa banyak cahaya jatuh pada subjek; diatur lewat daya, jarak, dan modifier.","Menentukan eksposur dan perbandingan terang-gelap (kontras)."],["<b>Warna<\/b>","Suhu warna sumber dalam Kelvin, ditambah warna gel jika dipakai.","Hangat atau dingin; cahaya campuran memicu color cast (lihat Modul 1)."]]},{"type":"callout","kind":"waspada","tag":"Salah kaprah","html":"<p>Cahaya lembut sering disangka cahaya yang redup. <b>Lembut atau keras ditentukan oleh ukuran dan jarak sumber<\/b>, bukan oleh terang atau redupnya.<\/p>"},{"type":"cek","ids":["C11","C12"]}]},"b2":{"blocks":[{"type":"tebak","ids":["T2"]},{"type":"table","head":["Sumber","Karakter","Catatan"],"rows":[["<b>Matahari siang<\/b>","Keras, sekitar 5600 K, berubah-ubah sepanjang hari.","Teduh atau diffuser untuk melunakkan; reflector sebagai fill."],["<b>Golden hour<\/b>","Hangat, lembut, arah rendah.","W
