rsama pola tangkap karena sangat terarah. Arahkan tepat ke sumber suara (on-axis). Kalau melenceng, suara menipis dan berubah warna.<\/p>"},{"type":"callout","kind":"waspada","tag":"Waspada","html":"<p>Omnidirectional bukan pilihan utama untuk dialog di tempat bising. Ia menangkap semua suara, termasuk noise.<\/p>"},{"type":"html","html":"<h3>Memilih pola menurut kebutuhan<\/h3>"},{"type":"table","head":["Situasi","Pilihan yang masuk akal","Alasan"],"rows":[["Dialog di lokasi dengan boom","Terarah (shotgun)","Dialog dominan dibanding noise sekitar"],["Wawancara dengan satu pembicara","Cardioid atau lavalier","Fokus pada satu sumber"],["Suasana pasar atau hutan","Omnidirectional","Menangkap ambience dari segala arah"]]},{"type":"cek","ids":["C21","C22","C23"]}]},"b3":{"blocks":[{"type":"tebak","ids":["T3"]},{"type":"lead","text":"Penempatan sering menentukan hasil lebih besar daripada merek mikrofon. Tiga aturan: dekat, on-axis, dan di luar bingkai."},{"type":"svg","svg":"<svg viewBox=\"0 0 600 300\" width=\"100%\" role=\"img\" aria-label=\"Posisi mikrofon boom di atas batas bingkai, mengarah ke mulut aktor\" style=\"display:block;max-width:600px;margin:8px auto\"><rect x=\"60\" y=\"120\" width=\"360\" height=\"160\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\" stroke-dasharray=\"7 5\"/><text x=\"305\" y=\"272\" font-size=\"12\" font-weight=\"700\" style=\"fill:var(--blue)\">Bingkai kamera<\/text><circle cx=\"240\" cy=\"178\" r=\"26\" style=\"fill:var(--surface2);stroke:var(--navy)\" stroke-width=\"2\"/><path d=\"M190 280 Q190 214 240 214 Q290 214 290 280 Z\" style=\"fill:var(--surface2);stroke:var(--navy)\" stroke-width=\"2\"/><circle cx=\"251\" cy=\"182\" r=\"3\" style=\"fill:var(--navy)\"/><line x1=\"590\" y1=\"40\" x2=\"262\" y2=\"96\" style=\"stroke:var(--muted)\" stroke-width=\"5\" stroke-linecap=\"round\"/><rect x=\"226\" y=\"88\" width=\"46\" height=\"16\" rx=\"8\" transform=\"rotate(-30 249 96)\" style=\"fill:var(--amber);stroke:var(--navy)\" stroke-width=\"2\"/><line x1=\"246\" y1=\"104\" x2=\"246\" y2=\"150\" style=\"stroke:var(--green)\" stroke-width=\"3\"/><polygon points=\"246,158 239,144 253,144\" style=\"fill:var(--green)\"/><text x=\"256\" y=\"140\" font-size=\"12\" font-weight=\"700\" style=\"fill:var(--green)\">on-axis ke mulut<\/text><text x=\"68\" y=\"110\" font-size=\"12\" font-weight=\"700\" style=\"fill:var(--navy)\">tepat di atas batas bingkai<\/text><rect x=\"60\" y=\"14\" width=\"46\" height=\"16\" rx=\"8\" transform=\"rotate(-20 83 22)\" fill=\"none\" style=\"stroke:var(--red)\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/><text x=\"60\" y=\"52\" font-size=\"12\" style=\"fill:var(--red)\">terlalu jauh: suara tipis, ruangan ikut masuk<\/text><\/svg>"},{"type":"html","html":"<h3>Prinsip penempatan<\/h3>"},{"type":"table","head":["Prinsip","Penjelasan"],"rows":[["<b>Dekat<\/b>","Setiap jarak mikrofon digandakan, suara langsung turun sekitar 6 dB, sedangkan noise ruangan tetap. Makin jauh, dialog makin tenggelam."],["<b>On-axis<\/b>","Ujung mikrofon diarahkan ke mulut aktor. Off-axis membuat suara tipis dan berubah warna."],["<b>Di luar bingkai<\/b>","Lihat batas bingkai di monitor atau tanyakan penata kamera. Pada medium shot setinggi dada, mikrofon dapat tepat di atas batas bingkai."]]},{"type":"html","html":"<h3>Posisi boom<\/h3>"},{"type":"table","head":["Posisi","Kelebihan","Kekurangan"],"rows":[["Dari atas (overhead)","Paling umum, suara dada dan kepala alami, jauh dari bunyi langkah.","Perlu ruang di atas bingkai; bayangan dapat jatuh ke gambar."],["Dari bawah (underslung)","Pilihan bila ruang atas terhalang atau langit-langit rendah.","Lebih mudah menangkap bunyi langkah dan napas."]]},{"type":"callout","kind":"penting","tag":"Aktor bergerak","html":"<p>Boom operator mengikuti yang berbicara dengan memutar boom, bukan berlari. Pelajari naskah agar tahu giliran bicara. Bila bingkai terlalu lebar, pertimbangkan lavalier.<\/p>"},{"type":"html","html":"<h3>Kesalahan umum dan perbaikannya<\/h3>"},{"type":"table","head":["Kesalahan","Dampak","Perbaikan"],"rows":[["Terlalu jauh","Suara tipis, gema dan noise naik","Dekatkan sampai batas bingkai"],["Off-axis","Suara berubah warna saat aktor bergerak","Arahkan ke mulut, ikuti gerak"],["Mikrofon masuk bingkai","Shot harus diulang","Lihat monitor, turunkan ke batas aman"],["Bayangan boom di gambar","Gambar rusak","Koordinasi dengan penata cahaya"],["Bunyi sentuhan","Gemuruh dan ketukan","Shock mount, genggaman stabil, kabel longgar"]]},{"type":"callout","kind":"waspada","tag":"Keselamatan","html":"<p>Boom pole dari karbon atau logam dapat menghantarkan listrik. Jauhi kabel listrik udara dan lampu bertegangan tinggi. Pastikan jalur kabel bersih agar tidak tersandung.<\/p>"},{"type":"cek","ids":["C31","C32","C33"]}]},"b4":{"blocks":[{"type":"tebak","ids":["T4"]},{"type":"lead","text":"SOP membuat hasil suara konsisten walau krunya berganti. Ikuti tiga tahap: sebelum, saat, dan sesudah merekam."},{"type":"html","html":"<h3>Sebelum merekam<\/h3>"},{"type":"steps","items":[{"title":"Cek alat","desc":"Baterai, kartu memori, kabel (tes sambung), mikrofon, dan windscreen terpasang."},{"title":"Survei suara lokasi","desc":"Dengarkan sumber bising seperti AC, kipas, lalu lintas, atau mesin. Minta dimatikan atau ditunda bila mungkin."},{"title":"Atur gain","desc":"Minta aktor bicara pada tingkat suara paling keras yang akan dipakai. Atur gain agar puncak sekitar −12 sampai −6 dBFS, tidak menyentuh 0."}]},{"type":"svg","svg":"<svg viewBox=\"0 0 600 120\" width=\"100%\" role=\"img\" aria-label=\"Skala level rekaman dalam dBFS dengan zona ideal -12 sampai -6\" style=\"display:block;max-width:600px;margin:8px auto\"><rect x=\"20.0\" y=\"30\" width=\"260.0\" height=\"36\" style=\"fill:var(--surface2);stroke:var(--line)\"/><text x=\"150.0\" y=\"53\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" style=\"fill:var(--ink)\">Terlalu pelan<\/text><rect x=\"280.0\" y=\"30\" width=\"156.0\" height=\"36\" style=\"fill:var(--blue-soft);stroke:var(--line)\"/><text x=\"358.0\" y=\"53\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" style=\"fill:var(--ink)\">Aman, tapi kecil<\/text><rect x=\"436.0\" y=\"30\" width=\"52.0\" height=\"36\" style=\"fill:var(--green-soft);stroke:var(--line)\"/><text x=\"462.0\" y=\"53\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" style=\"fill:var(--ink)\">Ideal<\/text><rect x=\"488.0\" y=\"30\" width=\"52.0\" height=\"36\" style=\"fill:var(--amber-soft);stroke:var(--line)\"/><text x=\"514.0\" y=\"53\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" style=\"fill:var(--ink)\">Bahaya<\/text><rect x=\"536.0\" y=\"30\" width=\"6\" height=\"36\" style=\"fill:var(--red)\"/><text x=\"538.0\" y=\"86\" text-anchor=\"end\" font-size=\"12\" font-weight=\"700\" style=\"fill:var(--red)\">0 dBFS = clip<\/text><text x=\"20.0\" y=\"22\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:var(--muted)\">-60<\/text><text x=\"280.0\" y=\"22\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:var(--muted)\">-30<\/text><text x=\"436.0\" y=\"22\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:var(--muted)\">-12<\/text><text x=\"488.0\" y=\"22\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:var(--muted)\">-6<\/text><text x=\"540.0\" y=\"22\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:var(--muted)\">0<\/text><text x=\"488.0\" y=\"104\" text-anchor=\"end\" font-size=\"12\" font-weight=\"700\" style=\"fill:var(--green)\">puncak dialog sekitar −12 sampai −6 dBFS<\/text><\/svg>"},{"type":"html","html":"<h3>Saat merekam<\/h3>"},{"type":"steps","items":[{"title":"Pantau dengan headphone","desc":"Sepanjang take, bukan hanya di awal."},{"title":"Slate","desc":"Pakai clapper board dan sebutkan scene dan take agar mudah disinkronkan."},{"title":"Pastikan rekaman berjalan","desc":"Recorder sudah merekam sebelum aba-aba action."},{"title":"Catat sound report","desc":"Scene, take, nama file, dan masalah seperti pesawat lewat atau suara kendaraan."}]},{"type":"html","html":"<h3>Sesudah merekam<\/h3>"},{"type":"steps","items":[{"title":"Room tone","desc":"Minta semua kru diam sekitar 30 sampai 60 detik di tiap ruang. Dipakai untuk menambal jeda saat penyuntingan."},{"title":"Backup","desc":"Salin ke dua tempat sebelum kartu memori dihapus."},{"title":"Rapikan alat","desc":"Matikan phantom power sebelum mencabut mikrofon kondensor. Gulung kabel dengan rapi, bersihkan windscreen."},{"title":"Serahkan catatan","desc":"Sound report diberikan kepada editor."}]},{"type":"callout","kind":"penting","tag":"Kaitan dengan modul lain","html":"<p>Clapper board dan log kontinuitas dibahas di Modul 5. Prinsip K3 kabel dan jalur aman ada di Modul 9.<\/p>"},{"type":"cek","ids":["C41","C42","C43"]}]},"b5":{"blocks":[{"type":"tebak","ids":["T5"]},{"type":"lead","text":"Noise adalah suara yang tidak diinginkan. Distorsi adalah suara yang bentuknya rusak, biasanya karena level terlalu tinggi. Cara menganalisisnya sama dengan Modul 6: gejala, penyebab, uji cepat, solusi, lalu verifikasi."},{"type":"cards","items":[{"title":"Dengung (hum) konstan","penyebab":"Gangguan listrik: kabel audio sejajar kabel daya, kabel tanpa pelindung, atau ground loop.","solusi":"Pakai kabel berpelindung (shielded) dan seimbang, jauhkan atau silangkan dengan kabel daya, pasang ground loop isolator."},{"title":"Suara pecah pada bagian keras","penyebab":"Gain input terlalu tinggi sehingga level menyentuh batas (clipping).","solusi":"Turunkan gain, aktifkan limiter, jaga puncak sekitar −12 sampai −6 dBFS."},{"title":"Gemuruh saat berangin","penyebab":"Embusan angin langsung mengenai kapsul mikrofon.","solusi":"Windscreen busa atau deadcat, lindungi dari arah angin, aktifkan low cut bila tersedia."},{"title":"Desis halus konstan","penyebab":"Gain terlalu tinggi karena mikrofon terlalu jauh, atau level terlalu rendah lalu dinaikkan di editing.","solusi":"Dekatkan mikrofon, atur gain yang cukup di sumber."},{"title":"Bising lingkungan (AC, kendaraan)","penyebab":"Sumber bising di sekitar yang tertangkap bersama dialog.","solusi":"Matikan atau tunda sumbernya, dekatkan mikrofon terarah, tambah penyerap, rekam ulang bila perlu."},{"title":"Bunyi sentuhan atau gesekan","penyebab":"Getaran boom atau gesekan kain pada lavalier.","solusi":"Shock mount, pasang lavalier dengan benar, genggaman stabil."}]},{"type":"html","html":"<h3>Gejala yang mirip<\/h3>"},{"type":"table","head":["Gejala","Ciri yang terdengar","Uji cepat","Penyebab paling mungkin"],"rows":[["Dengung","Nada rendah konstan, terdengar juga saat hening","Cabut mikrofon: bila masih berdengung, periksa kabel dan ground","Gangguan listrik"],["Desis","Suara halus seperti pasir","Dekatkan mikrofon dan turunkan gain","Gain tinggi, mikrofon jauh"],["Pecah","Suara kasar hanya saat keras","Lihat meter menyentuh 0 dBFS","Gain terlalu tinggi"],["Angin","Gemuruh tak teratur","Tutup kapsul dari angin","Embusan angin"]]},{"type":"callout","kind":"waspada","tag":"Waspada","html":"<p>Distorsi hampir tidak dapat diperbaiki di penyuntingan, dan noise reduction membawa harga berupa suara yang kehilangan kualitas. Solusi terbaik selalu di lokasi. Menjauhkan mikrofon sejauh mungkin bukan solusi distorsi karena dialog melemah dan noise ruangan menjadi lebih menonjol.<\/p>"},{"type":"cek","ids":["C51","C52","C53","C54"]}]},"latihan":{"blocks":[{"type":"callout","kind":"penting","tag":"Strategi menjawab","html":"<p>Baca kendala dan tujuan dulu. Cari penyebab di tiap gejala, lalu pilih tindakan yang menyelesaikan penyebab tanpa merusak hal lain. Pada soal pilihan majemuk, periksa tiap pilihan satu per satu.<\/p>"},{"type":"qlist","ids":["S1","S2","S3","S4"]}]},"cek":{"blocks":[{"type":"callout","kind":"penting","tag":"Cara mengerjakan","html":"<p>Pembahasan terbuka setelah ketiga soal dikunci.<\/p>"},{"type":"qlist","ids":["L1","L2","L3"]}]},"praktik":{"blocks":[{"type":"panel","html":"<b>Gear:<\/b> Zoom H6, headphone, mikrofon dan kabel XLR yang tersedia, boom pole bila ada, windscreen, clapper board, lakban hitam, kipas angin kecil. Sesuaikan dengan alat yang ada di sekolah."},{"type":"callout","kind":"waspada","tag":"Keselamatan","html":"<ul><li>Turunkan volume headphone sebelum memakai, naikkan perlahan.<\/li><li>Jalur kabel bersih dan direkatkan dengan lakban. Jangan menarik kabel.<\/li><li>Jangan mengoperasikan boom pole di dekat kabel listrik atau lampu bertegangan tinggi.<\/li><li>Sabotase terkontrol hanya berupa pengaturan gain, posisi kabel, dan kipas angin kecil. Tidak ada beban listrik berlebih.<\/li><\/ul>"},{"type":"html","html":"<h2>Praktik 1 · Kenali alat dan sound check <span class=\"small\">(15 menit)<\/span><\/h2><p>Tunjuk dan namai tiap alat pada rantai suara. Pasang mikrofon dan windscreen, atur gain sampai puncak suara bicara sekitar −12 sampai −6 dBFS pada meter.<\/p>"},{"type":"checklist","items":[{"id":"pa1","text":"Alat pada rantai suara disebutkan fungsinya"},{"id":"pa2","text":"Mikrofon dan windscreen terpasang"},{"id":"pa3","text":"Gain diatur dengan sound check"},{"id":"pa4","text":"Puncak berada pada zona ideal"}]},{"type":"html","html":"<textarea data-note=\"pa_r\" placeholder=\"Apa yang terjadi pada meter saat bicara lebih keras atau lebih pelan?\"><\/textarea>"},{"type":"html","html":"<h2>Praktik 2 · Posisi boom <span class=\"small\">(20 menit)<\/span><\/h2><p>Bergantian menjadi boom operator dan aktor. Rekam 10 detik dialog pada empat posisi: dekat on-axis, jauh on-axis, dekat off-axis, dan di belakang aktor. Putar rekaman memakai headphone dan bandingkan.<\/p>"},{"type":"checklist","items":[{"id":"pb1","text":"Empat posisi direkam"},{"id":"pb2","text":"Rekaman dibandingkan dengan headphone"},{"id":"pb3","text":"Posisi terbaik ditentukan beserta alasannya"},{"id":"pb4","text":"Batas bingkai dijaga"}]},{"type":"html","html":"<textarea data-note=\"pb_r\" placeholder=\"Posisi mana yang paling jelas dan mengapa?\"><\/textarea>"},{"type":"html","html":"<h2>Praktik 3 · Bengkel gangguan <span class=\"small\">(15 menit)<\/span><\/h2><p>Fasilitator menyiapkan tiga gangguan: gain terlalu tinggi, kabel audio sejajar kabel daya (tanpa beban berlebih), dan kipas angin kecil menghadap mikrofon tanpa windscreen. Tiap tim mendiagnosis gejalanya, menentukan penyebab, memperbaiki, lalu memverifikasi dengan headphone.<\/p>"},{"type":"checklist","items":[{"id":"pc1","text":"Gejala dan penyebab dicatat"},{"id":"pc2","text":"Perbaikan dilakukan"},{"id":"pc3","text":"Hasil diverifikasi dengan headphone"}]},{"type":"html","html":"<textarea data-note=\"pc_r\" placeholder=\"Gangguan mana yang paling sulit dibedakan?\"><\/textarea>"},{"type":"html","html":"<h2>Praktik 4 · Slate dan room tone <span class=\"small\">(10 menit)<\/span><\/h2><p>Rekam satu take dengan clapper board, sebutkan scene dan take, lalu rekam room tone selama 30 detik. Isi sound report.<\/p>"},{"type":"checklist","items":[{"id":"pd1","text":"Slate dan penamaan scene dan take dilakukan"},{"id":"pd2","text":"Room tone dan sound report selesai"}]},{"type":"html","html":"<textarea data-note=\"pd_r\" placeholder=\"Mengapa room tone perlu direkam di tiap ruang?\"><\/textarea>"}]},"kartu":{"blocks":[{"type":"html","html":"<p class=\"lead\">Rangkuman Modul 13 untuk dipakai saat Tryout.<\/p>"},{"type":"table","head":["Topik","Intinya"],"rows":[["Rantai suara","Sumber → mikrofon → kabel → recorder → headphone."],["Jenis mikrofon","Shotgun (boom), lavalier, handheld, kondensor studio. Kondensor perlu phantom power 48 V dan peka terhadap noise."],["Pola tangkap","Omnidirectional: segala arah. Cardioid: dominan depan, meredam belakang. Shotgun: sangat terarah ke depan."],["Penempatan","Dekat, on-axis, di luar bingkai. Dari atas paling umum. Koordinasi bayangan dengan penata cahaya."],["SOP","Cek alat → sound check dan gain → slate → pantau → room tone → backup → rapikan."],["Level","Puncak dialog sekitar −12 sampai −6 dBFS. 0 dBFS berarti clip."],["Dengung","Kabel berpelindung dan seimbang, jauhkan dari kabel daya, ground loop isolator."],["Pecah","Turunkan gain, aktifkan limiter."],["Angin","Windscreen, blimp, atau deadcat."]]},{"type":"html","html":"<h2>Alur analisis masalah suara<\/h2>"},{"type":"steps","items":[{"title":"Gejala","desc":"Apa yang terdengar salah, kapan, dan di mana?"},{"title":"Kategori","desc":"Listrik, level, angin, lingkungan, atau penempatan?"},{"title":"Penyebab","desc":"Penyebab paling mungkin; uji cepat apa yang membuktikan?"},{"title":"Solusi","desc":"Pilih yang menangani penyebab tanpa merusak hal lain."},{"title":"Verifikasi","desc":"Dengar ulang dengan headphone dan cek meter."}]}]}}},{"meta":{"id":14,"storageKey":"fke-modul14-mandiri-v1","topKick":"Modul 14","kicker":"Modul 14 · Elemen 3 BCF · Persiapan TKA 2026","title":"Tata Artistik","intro":"Memahami fungsi, klasifikasi, dan istilah dasar unsur tata artistik: penataan set, dekorasi properti, tata busana (wardrobe), dan tata rias. Untuk siswa kelas XII Produksi Film, Elemen 3 sub-elemen Tata Artistik.","chips":[{"label":"Memahami","color":"#ffb454"}],"howto":["<b>1. Tebak dulu, baru baca.<\/b> Tiap bagian dibuka dengan kotak <span class=\"small\">Tebak dulu<\/span> atau diakhiri <span class=\"small\">Cek paham<\/span>.","<b>2. Kenali dari fungsi.<\/b> Klasifikasi benda ditentukan oleh fungsinya dalam adegan, bukan oleh bentuknya.","<b>3. Praktik.<\/b> Bagian Praktik memakai benda dan pakaian yang tersedia di sekolah."],"objectives":["<b>Memahami:<\/b> membedakan tugas penataan set, dekorasi properti, tata busana, dan tata rias.","<b>Memahami:<\/b> mengklasifikasikan benda sebagai set structure, set dressing, set property, atau action prop.","<b>Memahami:<\/b> menjelaskan peran wardrobe dan rias dalam karakter dan kontinuitas."]},"sections":[{"id":"mulai","nav":"Mulai","title":"Tata Artistik"},{"id":"b1","nav":"Bagian 1","title":"Peran dan unsur tata artistik","time":"20 menit"},{"id":"b2","nav":"Bagian 2","title":"Klasifikasi set dan properti","time":"25 menit"},{"id":"b3","nav":"Bagian 3","title":"Wardrobe dan tata rias","time":"20 menit"},{"id":"latihan","nav":"Latihan","title":"Latihan soal bergaya TKA","time":"20 menit"},{"id":"cek","nav":"Cek akhir","title":"Uji dirimu sendiri","time":"10 menit"},{"id":"praktik","nav":"Praktik","title":"Bengkel artistik","time":"40 menit"},{"id":"kartu","nav":"Kartu","title":"Kartu tata artistik"}],"sectionQuestions":{"b1":["T1","C11","C12","C13"],"b2":["T2","C21","C22","C23","C24"],"b3":["C31","C32","C33"],"latihan":["S1","S2","S3","S4"],"cek":["L1","L2","L3"]},"praktikChecks":["pa1","pa2","pa3","pa4","pb1","pb2","pb3","pc1","pc2"],"labs":{},"questions":[{"id":"T1","kind":"pick","label":"T1","stem":"Departemen yang bertugas memilih dan menyiapkan pakaian aktor sesuai karakter adalah...","opts":[["Tata busana (wardrobe)",1],["Tata rias",0],["Dekorasi properti",0]],"explain":"Tata busana mengurus pakaian dan aksesori. Tata rias mengurus wajah dan rambut.","bare":true},{"id":"C11","kind":"pick","label":"1.1","stem":"Pekerjaan merias wajah dan menata rambut aktor sesuai tuntutan peran adalah tugas...","opts":[["Tata rias",1],["Tata busana",0],["Penataan set",0]],"explain":"Tata rias menangani wajah dan rambut, termasuk rias karakter seperti penuaan atau luka.","bare":true},{"id":"C12","kind":"pick","label":"1.2","stem":"Pencahayaan set adalah tugas...","opts":[["Tata cahaya, bukan tata artistik",1],["Dekorasi properti",0],["Tata busana",0]],"explain":"Cahaya ditangani departemen tata cahaya (Modul 2). Tata artistik bekerja pada benda, pakaian, dan rias yang akan disinari.","bare":true},{"id":"C13","kind":"tf","label":"Soal 1.3 · benar atau salah","stem":"Tentukan benar atau salah untuk tiap pernyataan.","opts":[{"t":"Tata busana bertugas memilih pakaian aktor, sedangkan tata rias mengatur rias wajah dan rambut.","c":true,"why":"Keduanya berbeda: pakaian dan wajah."},{"t":"Penataan set berkaitan dengan konstruksi dan tata ruang set, sedangkan dekorasi properti dengan penempatan benda.","c":true,"why":"Ruang dibentuk lebih dulu, lalu diisi benda."},{"t":"Penataan set dan dekorasi properti memiliki tugas yang sepenuhnya identik.","c":false,"why":"Berbeda: struktur ruang dan benda pengisinya."}],"explain":""},{"id":"T2","kind":"pick","label":"T2","stem":"Vas bunga kecil di meja tamu yang tidak disentuh aktor dan hanya memperindah latar termasuk...","opts":[["Set dressing",1],["Action prop",0],["Set structure",0]],"explain":"Benda dekoratif penunjang atmosfer yang tidak disentuh aktor adalah set dressing.","bare":true},{"id":"C21","kind":"pick","label":"2.1","stem":"Cangkir kopi yang dipegang dan diminum aktor dalam adegan sarapan termasuk...","opts":[["Action prop",1],["Set dressing",0],["Set structure",0]],"explain":"Benda yang berinteraksi langsung dengan aktor dalam adegan adalah action prop.","bare":true},{"id":"C22","kind":"pick","label":"2.2","stem":"Dinding, lantai, pintu, dan tangga yang dibangun untuk set termasuk...","opts":[["Set structure (konstruksi set)",1],["Set dressing",0],["Action prop",0]],"explain":"Bagian bangunan set disebut set structure.","bare":true},{"id":"C23","kind":"pick","label":"2.3","stem":"Sofa dan meja makan yang melengkapi fungsi ruang dan menjadi bagian dari set termasuk...","opts":[["Set property",1],["Action prop",0],["Rias karakter",0]],"explain":"Set property adalah perabot atau benda besar yang melengkapi fungsi ruang dan menjadi bagian dari set.","bare":true},{"id":"C24","kind":"tf","label":"Soal 2.4 · benar atau salah","stem":"Tentukan benar atau salah untuk tiap pernyataan.","opts":[{"t":"Benda yang sama dapat berpindah kategori menurut fungsinya dalam adegan.","c":true,"why":"Cangkir di rak adalah set dressing, tetapi menjadi action prop saat aktor meminumnya."},{"t":"Wardrobe termasuk unsur set yang dibangun, seperti dinding dan lantai.","c":false,"why":"Wardrobe adalah pakaian aktor, bukan bagian set."},{"t":"Action prop paling rawan terhadap kesalahan kontinuitas karena dipegang dan berubah selama adegan.","c":true,"why":"Isi gelas atau posisi benda dapat berubah antar-shot."}],"explain":""},{"id":"C31","kind":"pick","label":"3.1","stem":"Aktor berperan sebagai kakek berusia 80 tahun. Tata rias yang dipakai untuk menampilkan penuaan disebut...","opts":[["Rias karakter",1],["Rias korektif",0],["Set dressing",0]],"explain":"Rias karakter mengubah penampilan sesuai peran seperti usia atau luka. Rias korektif menjaga penampilan alami.","bare":true},{"id":"C32","kind":"pick","label":"3.2","stem":"Pakaian dan aksesori disiapkan agar sesuai karakter, era, dan perkembangan cerita. Ini fungsi...","opts":[["Tata busana",1],["Tata rias",0],["Tata suara",0]],"explain":"Wardrobe membantu penonton memahami siapa karakter itu dan kapan ia hidup.","bare":true},{"id":"C33","kind":"pick","label":"3.3","stem":"Foto kondisi pakaian dan rias sebelum syuting berguna untuk...","opts":[["Menjaga kontinuitas antar-shot dan antar-hari syuting",1],["Menggantikan naskah",0],["Mengatur pencahayaan",0]],"explain":"Foto menjadi acuan agar tampilan sama, seperti kancing, lengan, atau luka di wajah.","bare":true},{"id":"S1","kind":"pick","label":"Soal 1 · memahami · pilihan ganda","stem":"Dalam sebuah set terdapat tiga benda. Benda P: foto keluarga yang dipasang di dinding tanpa disentuh aktor. Benda Q: pedang mainan yang dihunus aktor dalam adegan. Benda R: tangga kayu yang dibangun sebagai bagian rumah. Klasifikasi P, Q, dan R secara berurutan adalah...","opts":[["Set dressing, Action prop, Set structure",1,"Foto menunjang suasana, pedang dipegang aktor, tangga bagian bangunan set."],["Action prop, Set dressing, Set structure",0,"Foto tidak disentuh aktor, jadi bukan action prop."],["Set structure, Action prop, Set dressing",0,"Foto bukan bagian bangunan, tangga bukan sekadar dekorasi."],["Set dressing, Set structure, Action prop",0,"Pedang yang dipegang aktor bukan set structure."],["Set property, Set dressing, Action prop",0,"Pedang yang dipegang adalah action prop dan tangga bagian bangunan."]],"explain":"Klasifikasi ditentukan oleh fungsi benda dan interaksinya dengan aktor: dekoratif tak disentuh, dipegang aktor, atau bagian bangunan."},{"id":"S2","kind":"pick","label":"Soal 2 · memahami · pilihan ganda","stem":"Departemen tata artistik memiliki subbidang penataan set, dekorasi properti, tata busana, dan tata rias. Manakah pasangan subbidang dan tugas yang paling tepat?","opts":[["Tata busana memilih dan menyiapkan pakaian sesuai karakter; tata rias mengatur riasan wajah dan rambut sesuai peran.",1,"Pembagian yang benar."],["Tata busana merias wajah; tata rias memilih pakaian.",0,"Terbalik."],["Dekorasi properti mengatur pencahayaan; penataan set memilih kostum.",0,"Pencahayaan bukan tugas dekorasi dan kostum bukan tugas penataan set."],["Tata rias hanya membersihkan wajah; tata busana hanya menyetrika.",0,"Mereduksi peran secara keliru."],["Penataan set dan dekorasi properti selalu identik.",0,"Struktur ruang berbeda dengan benda pengisinya."]],"explain":"Pakaian untuk tata busana, wajah dan rambut untuk tata rias, struktur ruang untuk penataan set, benda pengisi untuk dekorasi properti."},{"id":"S3","kind":"mcma","label":"Soal 3 · memahami · pilihan majemuk","stem":"Pilih semua pernyataan yang tepat tentang fungsi tata artistik.","opts":[["Membangun latar tempat dan waktu cerita.",1,"Set dan benda menunjukkan lokasi dan era."],["Membantu menunjukkan karakter lewat pakaian dan rias.",1,"Wardrobe dan rias menyampaikan status dan kepribadian."],["Menjaga kontinuitas benda, pakaian, dan rias antar-shot.",1,"Tampilan harus konsisten."],["Mengatur eksposur kamera dan frame rate.",0,"Itu pekerjaan tata kamera."],["Merekam dialog di lokasi.",0,"Itu pekerjaan tata suara."]],"explain":"Tata artistik menentukan apa yang tampak di depan kamera: tempat, benda, pakaian, dan rias."},{"id":"S4","kind":"tf","label":"Soal 4 · memahami · benar atau salah","stem":"Tentukan benar atau salah untuk tiap pernyataan.","opts":[{"t":"Set dressing adalah benda dekoratif yang tidak perlu disentuh aktor.","c":true,"why":"Fungsinya membangun atmosfer."},{"t":"Action prop adalah benda yang dipakai langsung oleh aktor dalam adegan.","c":true,"why":"Contoh: telepon yang diangkat."},{"t":"Tata rias termasuk pengaturan pakaian aktor.","c":false,"why":"Pakaian adalah tugas tata busana."}],"explain":""},{"id":"L1","kind":"pick","label":"Cek 1 · memahami","stem":"Tiga benda dalam adegan. Benda X: tangga kayu bagian dari set rumah. Benda Y: sofa yang melengkapi ruang tamu. Benda Z: gelas yang diminum aktor. Klasifikasi X, Y, dan Z secara berurutan adalah...","opts":[["Set structure, Set property, Action prop",1],["Set property, Set structure, Action prop",0],["Set dressing, Set property, Set structure",0],["Action prop, Set property, Set dressing",0],["Set structure, Set dressing, Set property",0]],"explain":"Tangga bagian bangunan set. Sofa perabot yang melengkapi fungsi ruang. Gelas yang diminum adalah action prop."},{"id":"L2","kind":"pick","label":"Cek 2 · memahami","stem":"Dalam film berlatar tahun 1960-an di kampung, seorang aktor tampak memakai jam tangan digital modern. Departemen yang paling bertanggung jawab memeriksanya adalah...","opts":[["Tata busana, karena aksesori termasuk bagian pakaian aktor",1,"Aksesori dikelola tata busana dan harus sesuai era."],["Tata suara",0,"Tidak berkaitan dengan tampilan."],["Tata rias",0,"Rias menangani wajah dan rambut."],["Penata cahaya",0,"Cahaya tidak menentukan kesesuaian aksesori."],["Editor",0,"Editor bukan penanggung jawab kesesuaian era di lokasi."]],"explain":"Kesesuaian pakaian dan aksesori dengan era adalah tugas tata busana."},{"id":"L3","kind":"mcma","label":"Cek 3 · memahami","stem":"Pada shot pertama aktor memiliki luka di dahi, tetapi pada shot ketiga luka itu hilang. Pilih semua pernyataan yang tepat.","opts":[["Ini kesalahan kontinuitas rias.",1,"Tampilan rias tidak konsisten antar-shot."],["Foto dan catatan kondisi rias sebelum syuting membantu mencegahnya.",1,"Foto menjadi acuan."],["Tata rias bertugas menjaga konsistensi luka itu sepanjang adegan.",1,"Luka termasuk rias karakter."],["Masalah ini dapat diatasi dengan menaikkan ISO.",0,"ISO tidak berkaitan."],["Masalah ini tugas tata suara.",0,"Tata suara tidak mengurus tampilan."]],"explain":"Kontinuitas rias dijaga oleh tata rias dengan foto dan catatan."}],"sectionsContent":{"b1":{"blocks":[{"type":"tebak","ids":["T1"]},{"type":"lead","text":"Tata artistik membentuk dunia yang dilihat penonton: di mana, kapan, dan siapa. Departemen ini bekerja pada ruang, benda, pakaian, dan wajah."},{"type":"table","head":["Subbidang","Tugas","Contoh pekerjaan"],"rows":[["<b>Penataan set panggung<\/b>","Merancang dan membangun atau menata ruang set sesuai naskah.","Dinding, lantai, pintu, tangga, denah set"],["<b>Dekorasi properti<\/b>","Memilih dan menempatkan benda yang mengisi set.","Perabot, hiasan, benda yang dipakai aktor"],["<b>Tata busana (wardrobe)<\/b>","Memilih, menyiapkan, dan merawat pakaian dan aksesori sesuai karakter, era, dan alur cerita.","Kostum, sepatu, jam tangan, topi"],["<b>Tata rias<\/b>","Mengatur riasan wajah dan rambut sesuai tuntutan peran.","Rias alami, penuaan, luka, tata rambut"]]},{"type":"callout","kind":"penting","tag":"Bedakan","html":"<p>Tata busana menyangkut pakaian. Tata rias menyangkut wajah dan rambut. Dekorasi properti menyangkut benda di ruang. Pencahayaan adalah tugas tata cahaya, bukan tata artistik.<\/p>"},{"type":"html","html":"<h3>Fungsi tata artistik<\/h3>"},{"type":"table","head":["Fungsi","Maksudnya"],"rows":[["Menetapkan latar","Tempat dan waktu cerita (era, daerah, musim)."],["Membangun karakter","Status sosial dan kepribadian lewat pakaian dan rias."],["Membangun suasana","Mood dan palet warna ruang."],["Mendukung cerita","Benda yang bermakna bagi alur."],["Menjaga kontinuitas","Benda, pakaian, dan rias konsisten antar-shot."]]},{"type":"callout","kind":"penting","tag":"Bekerja bersama","html":"<p>Departemen ini berkoordinasi dengan sutradara, penata kamera dan cahaya (warna dan bahan), serta script supervisor (kontinuitas, Modul 5).<\/p>"},{"type":"cek","ids":["C11","C12","C13"]}]},"b2":{"blocks":[{"type":"tebak","ids":["T2"]},{"type":"lead","text":"Klasifikasi benda ditentukan oleh fungsinya dan interaksinya dengan aktor, bukan oleh bentuknya."},{"type":"table","head":["Kategori","Pengertian","Contoh"],"rows":[["<b>Set structure<\/b>","Bagian bangunan set yang dibangun.","Dinding, lantai, pintu, tangga"],["<b>Set dressing<\/b>","Benda dekoratif kecil sampai sedang yang membangun atmosfer latar dan tidak perlu disentuh aktor.","Vas bunga, lukisan, foto di dinding, tirai"],["<b>Set property<\/b>","Perabot atau benda yang lebih besar yang melengkapi fungsi ruang dan menjadi bagian dari set.","Sofa, meja makan, lemari"],["<b>Action prop<\/b>","Benda yang berinteraksi langsung dengan aktor dalam adegan.","Cangkir yang diminum, telepon yang diangkat, pedang mainan"]]},{"type":"html","html":"<h3>Cara menentukan<\/h3>"},{"type":"steps","items":[{"title":"Apakah bagian bangunan set?","desc":"Ya: set structure."},{"title":"Apakah aktor memegang atau memakainya langsung dalam adegan?","desc":"Ya: action prop."},{"title":"Apakah perabot atau benda besar yang melengkapi fungsi ruang?","desc":"Ya: set property."},{"title":"Apakah benda dekoratif yang menunjang suasana tanpa disentuh?","desc":"Ya: set dressing."}]},{"type":"callout","kind":"waspada","tag":"Fungsi menentukan kategori","html":"<p>Cangkir di rak dapur adalah set dressing. Saat aktor mengambil dan meminumnya, cangkir itu menjadi action prop. Wardrobe bukan unsur set; ia adalah pakaian aktor.<\/p>"},{"type":"html","html":"<h3>Kontinuitas dan keselamatan<\/h3>"},{"type":"table","head":["Hal","Penjelasan"],"rows":[["Kontinuitas properti","Action prop paling rawan berubah antar-shot (isi gelas, posisi benda). Catat dan foto dalam log kontinuitas (Modul 5)."],["Keselamatan","Set harus kokoh. Properti senjata dan bahan mudah terbakar dikelola dengan hati-hati dan diberi tahu kepada kru (Modul 9)."]]},{"type":"cek","ids":["C21","C22","C23","C24"]}]},"b3":{"blocks":[{"type":"lead","text":"Pakaian dan rias adalah cara tercepat penonton mengenali karakter. Keduanya juga harus konsisten dari shot ke shot."},{"type":"html","html":"<h3>Wardrobe<\/h3>"},{"type":"table","head":["Hal","Penjelasan"],"rows":[["Fungsi","Menunjukkan karakter, era, status, dan perkembangan cerita."],["Aksesori","Jam tangan, topi, perhiasan, dan sepatu harus sesuai era dan karakter."],["Kontinuitas","Kancing, lengan yang digulung, dan kerapian harus sama antar-shot."],["Cadangan","Pakaian kunci sering disiapkan lebih dari satu agar aman."],["Kaitan dengan kamera","Warna dan pola dapat memengaruhi gambar: pola rapat dapat berkedip, putih murni mudah berlebih eksposur (Modul 1 dan 2)."]]},{"type":"html","html":"<h3>Tata rias<\/h3>"},{"type":"table","head":["Jenis","Pengertian","Contoh"],"rows":[["<b>Rias korektif<\/b>","Menjaga penampilan tetap alami di depan kamera.","Menyamarkan kilap kulit, menyeragamkan warna"],["<b>Rias karakter<\/b>","Mengubah penampilan sesuai peran.","Penuaan, luka, kantung mata"],["<b>Rias efek khusus<\/b>","Perubahan besar dengan bahan khusus.","Luka berat, makhluk fiksi"],["<b>Tata rambut<\/b>","Mengatur gaya rambut sesuai karakter dan era.","Rambut klasik tahun 1960-an"]]},{"type":"html","html":"<h3>Istilah dasar<\/h3>"},{"type":"table","head":["Istilah","Arti"],"rows":[["Breakdown artistik","Daftar kebutuhan set, benda, pakaian, dan rias per adegan dari naskah."],["Mood board","Kumpulan gambar acuan suasana dan gaya visual."],["Palet warna","Susunan warna utama yang dipakai dalam film atau adegan."],["Hero prop","Benda penting yang tampil dekat dan menjadi sorotan cerita."]]},{"type":"cek","ids":["C31","C32","C33"]}]},"latihan":{"blocks":[{"type":"callout","kind":"penting","tag":"Strategi menjawab","html":"<p>Tanyakan pada tiap benda: dipegang aktor atau tidak, bagian bangunan atau bukan. Untuk tugas departemen, ingat pembagiannya: pakaian, wajah dan rambut, ruang, dan benda.<\/p>"},{"type":"qlist","ids":["S1","S2","S3","S4"]}]},"cek":{"blocks":[{"type":"callout","kind":"penting","tag":"Cara mengerjakan","html":"<p>Pembahasan terbuka setelah ketiga soal dikunci.<\/p>"},{"type":"qlist","ids":["L1","L2","L3"]}]},"praktik":{"blocks":[{"type":"panel","html":"<b>Bahan:<\/b> benda dan pakaian yang tersedia di sekolah, kamera atau ponsel untuk foto, kertas label, lembar breakdown. Sesuaikan dengan yang ada."},{"type":"callout","kind":"waspada","tag":"Keselamatan","html":"<ul><li>Properti tajam atau meniru senjata hanya dari bahan aman dan ditunjukkan kepada seluruh kru.<\/li><li>Jangan memanjat set atau menumpuk benda tinggi.<\/li><li>Gunakan bahan rias hanya milik pribadi atau yang aman dan jangan dibagi antar siswa.<\/li><\/ul>"},{"type":"html","html":"<h2>Praktik 1 · Klasifikasi benda <span class=\"small\">(15 menit)<\/span><\/h2><p>Tiap tim memotret atau menulis 10 benda di ruang praktik, lalu menempelkan label: set structure, set dressing, set property, atau action prop, disertai alasan fungsinya.<\/p>"},{"type":"checklist","items":[{"id":"pa1","text":"Sepuluh benda diklasifikasikan"},{"id":"pa2","text":"Alasan fungsi ditulis untuk tiap benda"},{"id":"pa3","text":"Satu benda yang kategorinya berubah menurut adegan ditemukan"},{"id":"pa4","text":"Hasil dibandingkan dengan tim lain"}]},{"type":"html","html":"<textarea data-note=\"pa_r\" placeholder=\"Benda mana yang paling sulit digolongkan dan mengapa?\"><\/textarea>"},{"type":"html","html":"<h2>Praktik 2 · Breakdown artistik satu adegan <span class=\"small\">(15 menit)<\/span><\/h2><p>Ambil satu adegan pendek. Tulis kebutuhan set, benda, pakaian, dan rias, lengkap dengan siapa yang menangani tiap kebutuhan.<\/p>"},{"type":"checklist","items":[{"id":"pb1","text":"Kebutuhan set dan benda ditulis"},{"id":"pb2","text":"Pakaian dan rias ditulis"},{"id":"pb3","text":"Tiap kebutuhan dikaitkan dengan subbidang yang menangani"}]},{"type":"html","html":"<textarea data-note=\"pb_r\" placeholder=\"Hal apa yang tertinggal pada daftar pertamamu?\"><\/textarea>"},{"type":"html","html":"<h2>Praktik 3 · Uji kontinuitas artistik <span class=\"small\">(10 menit)<\/span><\/h2><p>Foto kondisi benda, pakaian, dan rias sebelum take. Ulangi adegan dan bandingkan hasilnya antar-shot.<\/p>"},{"type":"checklist","items":[{"id":"pc1","text":"Foto acuan dibuat sebelum take"},{"id":"pc2","text":"Perbedaan antar-shot dicatat dan diperbaiki"}]},{"type":"html","html":"<textarea data-note=\"pc_r\" placeholder=\"Perbedaan apa yang paling mudah terlewat?\"><\/textarea>"}]},"kartu":{"blocks":[{"type":"html","html":"<p class=\"lead\">Rangkuman Modul 14 untuk dipakai saat Tryout.<\/p>"},{"type":"table","head":["Topik","Intinya"],"rows":[["Subbidang","Penataan set: ruang. Dekorasi properti: benda. Tata busana: pakaian. Tata rias: wajah dan rambut."],["Set structure","Bagian bangunan set: dinding, lantai, pintu, tangga."],["Set dressing","Dekoratif penunjang atmosfer yang tidak disentuh aktor: vas, lukisan."],["Set property","Perabot atau benda besar yang melengkapi fungsi ruang: sofa, meja."],["Action prop","Benda yang dipakai langsung oleh aktor dalam adegan."],["Fungsi menentukan","Benda yang sama dapat berpindah kategori menurut adegan."],["Kontinuitas","Foto dan catat benda, pakaian, dan rias antar-shot."]]}]}}}],"DIAG":{"id":"diagnostik-bcf","judul":"Asesmen Awal Diagnostik BCF","durasiMenit":40,"mapel":"Broadcasting dan Perfilman (BCF)","skema":{"pick":"1 jika benar, 0 jika salah","mcma":"(pilihan benar dipilih - pilihan salah dipilih) / jumlah kunci, minimum 0","tf":"jumlah pernyataan benar / total pernyataan"},"soal":[{"id":"D01","kind":"pick","stem":"Dua hari menjelang syuting, tim belum mengantongi izin lokasi dan kendaraan untuk kru belum tersedia. Profesi yang paling bertanggung jawab mengurus lokasi, perizinan, dan transportasi adalah...","opts":[["Script Supervisor"],["Gaffer"],["Unit Manager",1],["Colorist"],["Sound Mixer"]],"explain":"Unit Manager mengurus lokasi, perizinan, dan transportasi. Script Supervisor menjaga kontinuitas, Gaffer merancang pencahayaan, Colorist bekerja di pascaproduksi, dan Sound Mixer menyatukan audio akhir.","meta":{"elemen":1,"elemenNama":"Dunia Kerja, Profesi, dan Bisnis","sub":"Profesi di Industri BCF","level":"K","modul":[8]},"no":1,"label":"Soal 1 · PG"},{"id":"D02","kind":"pick","stem":"Tim akan syuting malam di sebuah gedung lama. Instalasi listriknya memakai kabel yang sebagian terkelupas tanpa grounding, dan jalur evakuasinya gelap serta sempit. Tindakan pencegahan paling tepat pada tahap pra-produksi adalah...","opts":[["Inspeksi kelayakan listrik oleh teknisi berkompeten dan penyediaan penerangan darurat di jalur evakuasi.",1],["Menyiapkan kotak P3K dan menunggu sampai ada yang terluka."],["Meminta seluruh kru menandatangani pernyataan siap menanggung risiko."],["Tetap syuting, tetapi jam kerja dipercepat agar paparan risiko lebih singkat."],["Mengganti seluruh kru dengan kru yang lebih berpengalaman."]],"explain":"Pencegahan berarti menghilangkan atau menekan sumber bahaya sebelum kejadian: inspeksi listrik dan penerangan darurat. P3K bersifat penanganan setelah kecelakaan, surat pernyataan tidak menghapus hak keselamatan kru, dan opsi lain tidak mengatasi bahaya.","meta":{"elemen":1,"elemenNama":"Dunia Kerja, Profesi, dan Bisnis","sub":"K3","level":"A","modul":[9,2]},"no":2,"label":"Soal 2 · PG"},{"id":"D03","kind":"mcma","stem":"Sebuah produksi sinetron syuting pukul 07.00 sampai 23.00 selama enam hari berturut-turut. Beberapa kru kelelahan ekstrem dan mulai membuat kesalahan teknis. Manajemen tidak ingin menghentikan produksi. Pilih semua tindakan manajerial yang tepat:","opts":[["Mengatur rotasi kru dan batas jam lembur.",1],["Memberikan suplemen penambah stamina agar kru tahan bekerja.",0],["Menyediakan jadwal serta ruang istirahat yang layak.",1],["Menambah shift malam hanya untuk kru yang paling kuat.",0],["Menyediakan komunikasi dua arah dan briefing keselamatan setiap hari.",1],["Mempertahankan jadwal karena sudah tercantum di kontrak.",0]],"explain":"Fatigue adalah risiko psikososial. Solusi manajerialnya: rotasi dan batas jam kerja (A), istirahat terencana dan fasilitasnya (C), serta komunikasi dan briefing keselamatan (E). Suplemen tidak menyelesaikan penyebab, membebani satu kelompok tidak adil, dan kontrak tidak menghapus hak keselamatan.","meta":{"elemen":1,"elemenNama":"Dunia Kerja, Profesi, dan Bisnis","sub":"K3","level":"R","modul":[8,9]},"no":3,"label":"Soal 3 · PGK MCMA"},{"id":"D04","kind":"tf","stem":"Sebuah tim membuat video promosi sekolah. Tentukan benar atau salah untuk setiap pernyataan.","opts":[{"t":"Memakai musik berlisensi bebas royalti dan mencantumkan kreditnya adalah tindakan yang tepat.","c":true,"why":"Lisensi atau izin dan kredit adalah wujud menghormati hak cipta."},{"t":"Rekaman mentah (raw footage) boleh disebar sebelum rilis asalkan diberi watermark.","c":false,"why":"Rekaman mentah tetap materi rahasia produksi; watermark tidak menghapus kewajiban menjaga kerahasiaan."},{"t":"Kru berhak menolak pekerjaan berisiko jika tidak ada APD atau mitigasi risiko yang memadai.","c":true,"why":"Hak keselamatan kerja tidak dapat dikesampingkan oleh kontrak."}],"explain":"","meta":{"elemen":1,"elemenNama":"Dunia Kerja, Profesi, dan Bisnis","sub":"Etos Kerja dan Hak Cipta","level":"A","modul":[9]},"no":4,"label":"Soal 4 · PGK Benar/Salah"},{"id":"D05","kind":"pick","stem":"Seorang kru menerima pesan dari pihak luar yang meminta salinan rekaman mentah film sebelum rilis dengan alasan \"hanya untuk dilihat\". Sikap profesional yang paling tepat adalah...","opts":[["Memberikannya, karena rekaman mentah bukan bagian dari hak cipta."],["Memberikannya jika pihak tersebut berjanji tidak menyebarkan."],["Memberikan sebagian saja agar tidak dicurigai."],["Menolak dan melaporkannya kepada pimpinan produksi, karena menjaga kerahasiaan materi adalah bagian dari etos kerja.",1],["Menjualnya agar menambah pemasukan kru."]],"explain":"Menjaga kerahasiaan materi produksi adalah bagian dari etos kerja profesional. Opsi lain membuka risiko kebocoran dan pelanggaran hak cipta.","meta":{"elemen":1,"elemenNama":"Dunia Kerja, Profesi, dan Bisnis","sub":"Etos Kerja dan Hak Cipta","level":"A","modul":[9]},"no":5,"label":"Soal 5 · PG"},{"id":"D06","kind":"pick","stem":"Peralihan siaran televisi Indonesia dari analog ke digital memberi satu keunggulan: beberapa kanal dapat disiarkan dalam satu kanal frekuensi. Teknologi tersebut disebut...","opts":[["Streaming"],["Multipleksing",1],["Tapeless"],["Terestrial"],["Modulasi analog"]],"explain":"Multipleksing memungkinkan beberapa kanal berbagi satu frekuensi sehingga lebih efisien dan lebih stabil.","meta":{"elemen":2,"elemenNama":"Perkembangan Media, Teknologi, dan Regulasi","sub":"Perkembangan Media","level":"K","modul":[10]},"no":6,"label":"Soal 6 · PG"},{"id":"D07","kind":"pick","stem":"Sebuah film pendek akan ditayangkan di televisi. Di dalamnya ada visual botol minuman keras, dialog dengan kata kotor, dan adegan keintiman. Tindakan penyuntingan yang sesuai standar swasensor adalah...","opts":[["Botol dibungkam (mute), kata kotor di-blur, adegan keintiman dipercepat."],["Dibiarkan semuanya karena akan tayang malam hari."],["Seluruh wajah aktor di-blur."],["Visual dipertegas agar penonton memahami konteks."],["Botol minuman keras di-blur, kata kotor di-mute, adegan keintiman dipotong total.",1]],"explain":"Sesuai pedoman yang dibahas di Modul 10: visual miras di-blur, kata kotor di-mute, adegan keintiman dipotong total.","meta":{"elemen":2,"elemenNama":"Perkembangan Media, Teknologi, dan Regulasi","sub":"Regulasi Penyiaran dan Perfilman","level":"A","modul":[10]},"no":7,"label":"Soal 7 · PG"},{"id":"D08","kind":"tf","stem":"Tentukan benar atau salah untuk setiap pernyataan tentang lembaga dan platform penyiaran.","opts":[{"t":"LSF menyensor dan mengklasifikasikan film sebelum tayang.","c":true,"why":"LSF (Lembaga Sensor Film) berwenang atas film."},{"t":"KPI menetapkan pedoman perilaku dan standar program siaran (P3SPS) untuk televisi dan radio.","c":true,"why":"P3SPS adalah pedoman KPI untuk penyiaran."},{"t":"Platform OTT dapat ditonton tanpa koneksi internet.","c":false,"why":"OTT disalurkan lewat internet dan bersifat on-demand."}],"explain":"","meta":{"elemen":2,"elemenNama":"Perkembangan Media, Teknologi, dan Regulasi","sub":"Regulasi Penyiaran dan Perfilman","level":"K","modul":[10]},"no":8,"label":"Soal 8 · PGK Benar/Salah"},{"id":"D09","kind":"pick","stem":"Seorang warga di sebuah pulau tanpa sinyal internet yang stabil menonton televisi lewat antena UHF di atap rumahnya. Jenis penyiaran tersebut adalah...","opts":[["Terestrial, siaran linear dengan jadwal yang ditentukan stasiun.",1],["OTT, karena dapat ditonton kapan saja."],["Streaming on-demand berbasis aplikasi."],["Siaran kabel berlangganan."],["Podcast."]],"explain":"Siaran yang ditangkap antena adalah terestrial (OTA) dan bersifat linear. OTT dan streaming memerlukan internet.","meta":{"elemen":2,"elemenNama":"Perkembangan Media, Teknologi, dan Regulasi","sub":"Perkembangan Media","level":"A","modul":[10]},"no":9,"label":"Soal 9 · PG"},{"id":"D10","kind":"pick","stem":"Wawancara di halaman sekolah pada siang terik. Kamera 25 fps, shutter 1/50, ISO 100, f/2.8. Gambar kelebihan sekitar 2 stop. Sutradara ingin latar tetap blur dan gerak tetap natural. Tindakan paling tepat adalah...","opts":[["Menaikkan shutter menjadi 1/200."],["Memasang ND filter 0.6.",1],["Menutup aperture menjadi f/5.6."],["Menaikkan ISO menjadi 200."],["Memasang ND filter 0.3."]],"explain":"ND 0.6 mengurangi 2 stop tanpa mengubah aperture, shutter, atau ISO. Shutter 1/200 merusak gerak natural, f/5.6 menghilangkan latar blur, menaikkan ISO justru menambah terang, dan ND 0.3 hanya 1 stop.","meta":{"elemen":3,"elemenNama":"Teknik Dasar Pengoperasian Peralatan Audio Visual","sub":"Dasar Fotografi dan Videografi","level":"A","modul":[1]},"no":10,"label":"Soal 10 · PG"},{"id":"D11","kind":"tf","stem":"Rekaman wawancara 50 fps di ruangan berlampu LED (listrik 50 Hz) tampak berkedip dengan pita gelap. Pada monitor, histogram juga menumpuk dan terpotong di tepi kanan. Tentukan benar atau salah.","opts":[{"t":"Menaikkan ISO menjadi 3200 akan menghilangkan kedipan.","c":false,"why":"Kedipan bergantung pada shutter, bukan ISO."},{"t":"Mengubah shutter menjadi 1/100 menyelaraskan kamera dengan frekuensi listrik dan dapat menghilangkan kedipan.","c":true,"why":"Untuk 50 fps, aturan 180° memberi 1/100 dan aman di listrik 50 Hz."},{"t":"Histogram yang terpotong di sisi kanan menandakan highlight hilang, dan detail itu tidak dapat dipulihkan saat penyuntingan.","c":true,"why":"Sisi kanan adalah area terang; clipping berarti data hilang."}],"explain":"","meta":{"elemen":3,"elemenNama":"Teknik Dasar Pengoperasian Peralatan Audio Visual","sub":"Dasar Fotografi dan Videografi","level":"R","modul":[1,6]},"no":11,"label":"Soal 11 · PGK Benar/Salah"},{"id":"D12","kind":"pick","stem":"Seorang penata cahaya menata wajah narasumber dengan tiga lampu. Pasangan lampu dan fungsinya yang paling tepat adalah...","opts":[["Key light memisahkan subjek dari latar, fill light menentukan eksposur utama, back light melembutkan bayangan."],["Key light melembutkan bayangan, fill light memisahkan subjek dari latar, back light menentukan eksposur utama."],["Ketiganya berfungsi sama dan hanya berbeda warna."],["Key light menentukan eksposur dan arah cahaya utama, fill light melembutkan bayangan yang dibuat key, back light memisahkan subjek dari latar.",1],["Key light dan fill light dipasang di belakang subjek, back light di depan kamera."]],"explain":"Key menjadi sumber utama (sekitar 45° dari kamera, sedikit di atas level mata), fill melembutkan bayangan dan mengatur kontras, back memberi tepi cahaya yang memisahkan subjek dari latar.","meta":{"elemen":3,"elemenNama":"Teknik Dasar Pengoperasian Peralatan Audio Visual","sub":"Dasar Fotografi dan Videografi","level":"K","modul":[2]},"no":12,"label":"Soal 12 · PG"},{"id":"D13","kind":"mcma","stem":"Di studio kelas, enam lampu tungsten 500 W dipasang pada satu terminal berkapasitas 10 A lewat kabel rol 15 meter yang masih tergulung. Terminal terasa hangat dan produksi harus tetap berjalan. Pilih semua tindakan yang tepat:","opts":[["Menghitung total beban (3.000 W : 220 V, sekitar 13,6 A) lalu membaginya ke jalur atau terminal terpisah.",1],["Mengurai kabel rol sepenuhnya sebelum dipakai.",1],["Menyambung terminal kedua pada terminal pertama agar semua lampu tetap menyala.",0],["Mengganti sebagian lampu fill dengan reflector dan mendekatkan lampu utama ke subjek.",1],["Menutup lampu dengan kain rapat agar panasnya berkurang.",0],["Melanjutkan saja karena syuting harus selesai.",0]],"explain":"Beban sekitar 13,6 A melebihi kapasitas 10 A, jadi harus dibagi (A). Gulungan kabel menahan panas dan bisa meleleh (B). Reflector tidak menambah beban listrik (D). Menyambung terminal tidak mengurangi total beban, kain menutup lampu berisiko kebakaran, dan melanjutkan tanpa koreksi membiarkan bahaya.","meta":{"elemen":3,"elemenNama":"Teknik Dasar Pengoperasian Peralatan Audio Visual","sub":"Dasar Fotografi dan Videografi","level":"R","modul":[2]},"no":13,"label":"Soal 13 · PGK MCMA"},{"id":"D14","kind":"pick","stem":"Sutradara ingin tokoh utama tampak kecil dan rentan saat menghadapi bencana, sementara penonton tetap melihat lingkungan sekitar yang luas. Kombinasi camera angle dan shot size yang paling tepat adalah...","opts":[["Low angle dan close-up."],["Eye level dan extreme close-up."],["High angle dan long shot.",1],["Dutch angle dan medium close-up."],["Low angle dan extreme long shot."]],"explain":"High angle membuat subjek tampak kecil atau rentan, dan long shot memperlihatkan lingkungan. Low angle justru membuat subjek tampak kuat.","meta":{"elemen":3,"elemenNama":"Teknik Dasar Pengoperasian Peralatan Audio Visual","sub":"Tata Kamera","level":"A","modul":[3]},"no":14,"label":"Soal 14 · PG"},{"id":"D15","kind":"tf","stem":"Tentukan benar atau salah untuk setiap pernyataan tentang komposisi dan lensa.","opts":[{"t":"Lensa tele memampatkan jarak sehingga latar tampak lebih dekat dengan subjek.","c":true,"why":"Tele memampatkan ruang."},{"t":"Subjek yang menghadap kanan sebaiknya ditempatkan di tepi kanan bingkai agar tampak tegas.","c":false,"why":"Subjek diberi lead room di sisi arah hadapnya, sehingga ditempatkan lebih ke kiri."},{"t":"Konten Reels atau TikTok memakai format bingkai vertikal 9:16.","c":true,"why":"16:9 untuk siaran TV dan YouTube; 9:16 untuk konten vertikal."}],"explain":"","meta":{"elemen":3,"elemenNama":"Teknik Dasar Pengoperasian Peralatan Audio Visual","sub":"Tata Kamera","level":"K","modul":[3]},"no":15,"label":"Soal 15 · PGK Benar/Salah"},{"id":"D16","kind":"mcma","stem":"Tim merekam tracking shot di koridor memakai gimbal. Hasilnya masih bergetar saat operator berjalan, dan awal serta akhir gerakan terasa kasar. Pilih semua tindakan yang tepat:","opts":[["Menyeimbangkan (balance) gimbal sebelum motor dinyalakan.",1],["Berjalan dengan lutut sedikit ditekuk dan siku merapat ke badan.",1],["Memakai lensa tele 150 mm agar objek tampak lebih dekat.",0],["Menaikkan ISO untuk meredam getaran.",0],["Memulai dan mengakhiri gerakan dengan frame diam 1 sampai 2 detik, dengan ease in dan ease out.",1],["Berlari agar getaran tidak terlihat.",0]],"explain":"Gimbal harus seimbang agar motor tidak terbebani (A), teknik berjalan halus tetap diperlukan (B), dan frame diam serta ease in/out membuat gerak halus dan mudah disunting (E). Tele memperbesar guncangan, ISO tidak berpengaruh pada getaran, dan berlari memperburuk.","meta":{"elemen":3,"elemenNama":"Teknik Dasar Pengoperasian Peralatan Audio Visual","sub":"Tata Kamera","level":"R","modul":[4]},"no":16,"label":"Soal 16 · PGK MCMA"},{"id":"D17","kind":"pick","stem":"Dua kamerawan merekam objek yang sama. Kamerawan 1 memakai zoom in optik dari posisi tetap, kamerawan 2 melakukan dolly in dengan kamera berpindah maju. Perbedaan hasil yang paling tepat adalah...","opts":[["Keduanya identik karena sama-sama memperbesar objek."],["Zoom in mengubah perspektif, sedangkan dolly in tidak."],["Dolly in hanya mengubah warna gambar."],["Zoom in selalu lebih natural karena kamera tidak bergerak."],["Zoom in hanya memperbesar gambar sehingga hubungan benda dekat dan jauh tetap, sedangkan dolly in memindahkan kamera sehingga perspektif berubah.",1]],"explain":"Zoom mengubah panjang fokus tanpa memindahkan kamera. Dolly memindahkan kamera sehingga hubungan antara benda dekat dan jauh berubah.","meta":{"elemen":3,"elemenNama":"Teknik Dasar Pengoperasian Peralatan Audio Visual","sub":"Tata Kamera","level":"A","modul":[4]},"no":17,"label":"Soal 17 · PG"},{"id":"D18","kind":"tf","stem":"Seorang editor menyusun dialog dua tokoh. Penonton bingung karena tokoh A berpindah sisi bingkai dan menghadap arah berbeda antar shot, dan dua shot berurutan terasa melompat. Tentukan benar atau salah.","opts":[{"t":"Dua shot berurutan dengan sudut dan ukuran hampir sama sudah aman dari jump cut selama warnanya seragam.","c":false,"why":"Jump cut dihindari dengan mengubah ukuran atau sudut minimal sekitar 30°."},{"t":"Perpindahan sisi dan arah hadap terjadi karena kamera menyeberangi axis of action tanpa persiapan.","c":true,"why":"Menyeberang garis tanpa persiapan membuat arah hadap tampak terbalik."},{"t":"Neutral shot atau cutaway dapat dipakai sebagai jembatan saat kamera perlu berpindah sisi garis aksi.","c":true,"why":"Neutral shot atau cutaway adalah cara yang sah menyeberangi garis."}],"explain":"","meta":{"elemen":3,"elemenNama":"Teknik Dasar Pengoperasian Peralatan Audio Visual","sub":"Editing dan Kontinuitas","level":"R","modul":[5]},"no":18,"label":"Soal 18 · PGK Benar/Salah"},{"id":"D19","kind":"pick","stem":"Hasil rekaman tampak buram. Saat kamera dipasang di tripod dan objeknya diam, bagian terpenting tetap buram dan tidak mengikuti arah gerak apa pun. Penyebab paling mungkin adalah...","opts":[["Fokus tidak tepat.",1],["Motion blur akibat shutter yang lambat."],["Rolling shutter."],["Flicker lampu."],["White balance salah."]],"explain":"Buram yang tetap ada pada objek diam dengan kamera di tripod menunjukkan fokus salah. Motion blur mengikuti arah gerak, dan rolling shutter muncul pada pan cepat.","meta":{"elemen":3,"elemenNama":"Teknik Dasar Pengoperasian Peralatan Audio Visual","sub":"Dasar Fotografi dan Videografi","level":"A","modul":[6]},"no":19,"label":"Soal 19 · PG"},{"id":"D20","kind":"pick","stem":"Riset, penulisan naskah, penyusunan storyboard, dan pembuatan call sheet dikerjakan pada tahap...","opts":[["Produksi"],["Pasca-produksi"],["Distribusi"],["Pra-produksi",1],["Mastering"]],"explain":"Semua kegiatan itu adalah perencanaan, yaitu pra-produksi.","meta":{"elemen":4,"elemenNama":"Proses Produksi dan Media Baru","sub":"Alur Produksi","level":"K","modul":[11]},"no":20,"label":"Soal 20 · PG"},{"id":"D21","kind":"pick","stem":"Dalam simulasi proyek video pendek kelas, pembagian tugas yang paling tepat adalah...","opts":[["Produser mengarahkan akting, sutradara mengelola anggaran, editor mengatur lampu."],["Penata suara menyunting warna, penata kamera menyusun call sheet, sutradara merekam suara."],["Sutradara mengarahkan akting dan visi kreatif, penata kamera mengatur komposisi, editor menyusun hasil rekaman, produser mengelola anggaran dan jadwal.",1],["Semua kru mengerjakan semua tugas tanpa pembagian agar lebih fleksibel."],["Hanya sutradara yang bekerja, kru lain menunggu."]],"explain":"Tiap peran punya tanggung jawab yang jelas; pembagian tugas yang jelas adalah dasar SOP kerja tim.","meta":{"elemen":4,"elemenNama":"Proses Produksi dan Media Baru","sub":"Alur Produksi","level":"A","modul":[11]},"no":21,"label":"Soal 21 · PG"},{"id":"D22","kind":"mcma","stem":"Tim menyelesaikan video dokumenter. Pilih semua kegiatan yang termasuk tahap pasca-produksi:","opts":[["Editing gambar (rough cut).",1],["Mixing audio.",1],["Mastering dan pengemasan hasil akhir.",1],["Penyusunan storyboard.",0],["Penyusunan call sheet.",0],["Pengambilan gambar di lokasi.",0]],"explain":"Pasca-produksi mencakup editing, mixing, dan mastering. Storyboard dan call sheet adalah pra-produksi, pengambilan gambar adalah produksi.","meta":{"elemen":4,"elemenNama":"Proses Produksi dan Media Baru","sub":"Alur Produksi","level":"A","modul":[11]},"no":22,"label":"Soal 22 · PGK MCMA"},{"id":"D23","kind":"pick","stem":"Data analitik yang menunjukkan seberapa lama penonton bertahan menonton sebuah video disebut...","opts":[["Engagement rate"],["Retention rate",1],["Click rate"],["Jumlah tayangan"],["Pertumbuhan pengikut"]],"explain":"Retention rate mengukur lama penonton bertahan. Engagement rate mengukur interaksi (like, komentar, share).","meta":{"elemen":4,"elemenNama":"Proses Produksi dan Media Baru","sub":"Media Baru dan Konten Kreatif","level":"K","modul":[12]},"no":23,"label":"Soal 23 · PG"},{"id":"D24","kind":"pick","stem":"Tim kreatif menyiapkan live streaming talkshow dan ingin mengoptimalkan karakteristik interactivity. Tindakan operasional yang paling tepat adalah...","opts":[["Menyetel audio dengan mikrofon kondensor yang mahal."],["Menyisipkan tautan artikel di kolom chat."],["Mematikan kolom komentar agar penonton fokus."],["Memutar rekaman ulang tanpa host."],["Memasang polling real-time dan membacakan pertanyaan penonton dari kolom Q&A.",1]],"explain":"Interactivity berarti komunikasi dua arah: polling dan Q&A. Tautan artikel mengoptimalkan hypertextuality, bukan interactivity.","meta":{"elemen":4,"elemenNama":"Proses Produksi dan Media Baru","sub":"Media Baru dan Konten Kreatif","level":"A","modul":[12]},"no":24,"label":"Soal 24 · PG"},{"id":"D25","kind":"tf","stem":"Video A memiliki 100.000 tayangan dengan retention rate 25%. Video B memiliki 30.000 tayangan dengan retention rate 70% dan banyak komentar. Tentukan benar atau salah.","opts":[{"t":"Video A lebih layak dijadikan acuan gaya konten karena tayangannya lebih banyak.","c":false,"why":"Jumlah tayangan saja bukan indikator utama; retention dan interaksi lebih menunjukkan kualitas."},{"t":"Video B lebih layak dijadikan acuan karena penonton bertahan lama dan berinteraksi.","c":true,"why":"Retention tinggi dan banyak komentar menunjukkan konten benar-benar dinikmati."},{"t":"Retention rate rendah pada Video A menandakan banyak penonton berhenti di awal, sehingga bagian pembuka perlu dievaluasi.","c":true,"why":"Retention rendah berarti penonton cepat berhenti."}],"explain":"","meta":{"elemen":4,"elemenNama":"Proses Produksi dan Media Baru","sub":"Media Baru dan Konten Kreatif","level":"R","modul":[12]},"no":25,"label":"Soal 25 · PGK Benar/Salah"}]},"TO2":{"id":"tryout2-bcf","judul":"Tryout 2 BCF","durasiMenit":60,"mapel":"Broadcasting dan Perfilman (BCF)","soal":[{"id":"U01","kind":"pick","stem":"Sebuah produksi iklan membutuhkan seseorang yang mengelola anggaran harian, menyusun jadwal syuting, dan mengatur logistik. Profesi yang paling sesuai adalah...","opts":[["Script Supervisor"],["Focus Puller"],["Line Producer",1],["Colorist"],["Sound Mixer"]],"explain":"Line Producer mengelola anggaran harian, jadwal, dan logistik. Script Supervisor menjaga kontinuitas, Focus Puller mengatur fokus kamera, Sound Mixer menyatukan audio, dan Colorist bekerja pada warna di pascaproduksi.","meta":{"elemen":1,"elemenNama":"Dunia Kerja, Profesi, dan Bisnis","sub":"Profesi di Industri BCF","level":"K","modul":[8]},"no":1,"label":"Soal 1 · PG"},{"id":"U02","kind":"pick","stem":"Tim akan syuting di tepi sungai berarus dan lereng yang licin. Tindakan manajerial yang paling tepat sebelum syuting dimulai adalah...","opts":[["Membiarkan kru yang berani mendekati tepi sungai tanpa pengaman."],["Melanjutkan syuting karena jadwal sudah padat dan kru diminta berhati-hati."],["Mengadakan safety briefing, menyediakan APD seperti pelampung dan safety harness, dan menetapkan jalur aman.",1],["Meminta kru bekerja lebih cepat agar selesai sebelum gelap."],["Memindahkan tanggung jawab keselamatan sepenuhnya kepada masing-masing kru."]],"explain":"Risiko fisik dicegah secara manajerial: briefing keselamatan, APD yang memadai, dan jalur aman ditetapkan sebelum pekerjaan dimulai.","meta":{"elemen":1,"elemenNama":"Dunia Kerja, Profesi, dan Bisnis","sub":"K3","level":"A","modul":[9]},"no":2,"label":"Soal 2 · PG"},{"id":"U03","kind":"mcma","stem":"Seorang kru diminta memanjat rangka lampu setinggi empat meter di set tanpa harness dan tanpa pengaman lain. Pilih semua pernyataan yang tepat:","opts":[["Kru yang menolak dianggap melanggar etos kerja dan boleh langsung diganti."],["Kru berhak menolak pekerjaan itu sampai APD dan mitigasi risiko yang memadai tersedia.",1],["Pekerjaan boleh dilanjutkan jika kru menandatangani surat yang menyatakan ia menanggung risiko sendiri."],["Kontrak kerja tidak dapat menghapus hak keselamatan pekerja.",1],["Produksi perlu menyediakan harness dan safety briefing sebelum pekerjaan dilakukan.",1]],"explain":"Hak menolak pekerjaan berisiko tanpa APD melekat pada pekerja dan tidak bisa dihapus kontrak maupun surat pernyataan. Kewajiban menyediakan pengaman ada pada produksi.","meta":{"elemen":1,"elemenNama":"Dunia Kerja, Profesi, dan Bisnis","sub":"K3","level":"A","modul":[9]},"no":3,"label":"Soal 3 · PGK MCMA"},{"id":"U04","kind":"tf","stem":"Sebuah produksi film pendek sedang berjalan. Tentukan benar atau salah untuk setiap pernyataan.","opts":[{"t":"Memakai cuplikan film orang lain tanpa izin untuk tugas sekolah pasti aman karena tidak dijual.","c":false,"why":"Tanpa izin atau lisensi tetap berpotensi melanggar hak cipta, walau untuk tugas sekolah."},{"t":"Mengunggah foto di balik layar yang membocorkan adegan kejutan sebelum film dirilis bertentangan dengan pilar kerahasiaan.","c":true,"why":"Kerahasiaan mencakup naskah dan materi produksi sebelum rilis."},{"t":"Kru yang akan terlambat sebaiknya memberi kabar dan bertanggung jawab atas dampaknya pada jadwal.","c":true,"why":"Disiplin waktu berarti konfirmasi dan tanggung jawab."}],"explain":"","meta":{"elemen":1,"elemenNama":"Dunia Kerja, Profesi, dan Bisnis","sub":"Etos Kerja dan Hak Cipta","level":"R","modul":[9,10]},"no":4,"label":"Soal 4 · PGK Kategori"},{"id":"U05","kind":"mcma","stem":"Sebuah kelompok membuat video tugas sekolah yang akan diunggah ke kanal YouTube sekolah dan ingin memakai lagu populer sebagai latar. Pilih semua tindakan yang tepat:","opts":[["Memotong lagu menjadi sepuluh detik agar dianggap tidak melanggar."],["Mencantumkan judul dan penyanyi di deskripsi video sudah cukup tanpa izin."],["Meminta izin atau lisensi resmi dari pemegang hak lagu tersebut.",1],["Membuat musik sendiri atau memakai karya yang izin penggunaannya jelas.",1],["Memakai musik bebas royalti atau musik yang berlisensi sesuai penggunaannya.",1]],"explain":"Penggunaan harus berdasarkan izin atau lisensi. Mencantumkan nama atau memotong durasi tidak menggantikan izin.","meta":{"elemen":1,"elemenNama":"Dunia Kerja, Profesi, dan Bisnis","sub":"Etos Kerja dan Hak Cipta","level":"R","modul":[10]},"no":5,"label":"Soal 5 · PGK MCMA"},{"id":"U06","kind":"tf","stem":"Tentukan benar atau salah untuk setiap pernyataan tentang profesi di industri BCF.","opts":[{"t":"Script Supervisor mencatat kontinuitas properti, kostum, dan dialog.","c":true,"why":"Itulah tugas utama Script Supervisor."},{"t":"Colorist bertugas menyatukan dan menyeimbangkan dialog, musik, dan efek suara.","c":false,"why":"Itu tugas Sound Mixer. Colorist mengatur warna."},{"t":"1st Assistant Director mengatur urutan shot dan menjaga jadwal di lapangan.","c":true,"why":"1st AD menjadi jembatan sutradara dengan tim lapangan."}],"explain":"","meta":{"elemen":1,"elemenNama":"Dunia Kerja, Profesi, dan Bisnis","sub":"Profesi di Industri BCF","level":"K","modul":[8]},"no":6,"label":"Soal 6 · PGK Kategori"},{"id":"U07","kind":"pick","stem":"Dalam alur kerja tapeless pada produksi televisi, materi direkam...","opts":[["ke pita kaset lalu disalin ulang berkali-kali sebelum disunting."],["dengan menggunting pita film secara manual."],["tanpa naskah dan tanpa kamera."],["hanya pada siaran yang ditonton lewat internet."],["langsung ke media digital seperti kartu memori atau hard disk sehingga dapat disalin dan disunting tanpa pita.",1]],"explain":"Tapeless berarti perekaman ke media digital, bukan pita. Materi langsung berupa berkas yang dapat disalin dan disunting.","meta":{"elemen":2,"elemenNama":"Perkembangan Media, Teknologi, dan Regulasi","sub":"Perkembangan Media","level":"K","modul":[10]},"no":7,"label":"Soal 7 · PG"},{"id":"U08","kind":"pick","stem":"Sebuah sekolah ingin film dokumenternya dapat ditonton siswa kapan saja sesuai waktu luang mereka. Jalur distribusi yang paling sesuai adalah...","opts":[["Siaran televisi terestrial pada jam tertentu yang diatur stasiun."],["Menyiarkan ulang setiap hari pada pukul yang sama lewat satelit."],["Siaran radio pada frekuensi tetap."],["Platform OTT yang bersifat on-demand lewat internet.",1],["Memutar film hanya saat upacara sekolah."]],"explain":"OTT bersifat on-demand: penonton memilih sendiri waktu menonton. Terestrial bersifat linear, jadwal ditentukan stasiun.","meta":{"elemen":2,"elemenNama":"Perkembangan Media, Teknologi, dan Regulasi","sub":"Perkembangan Media","level":"A","modul":[10]},"no":8,"label":"Soal 8 · PG"},{"id":"U09","kind":"mcma","stem":"Sebuah dokumenter akan ditayangkan di televisi. Di dalamnya terdapat visual korban kecelakaan yang tampak jelas, botol minuman keras di atas meja, dan umpatan kasar. Pilih semua tindakan penyuntingan yang tepat:","opts":[["Umpatan kasar cukup diberi efek blur pada layar."],["Umpatan kasar di-mute.",1],["Botol minuman keras di-blur.",1],["Seluruh suara pada adegan itu di-mute."],["Visual korban kecelakaan di-blur.",1]],"explain":"Visual sensitif di-blur, kata kotor di-mute. Blur tidak berlaku untuk suara, dan membungkam seluruh suara berlebihan.","meta":{"elemen":2,"elemenNama":"Perkembangan Media, Teknologi, dan Regulasi","sub":"Regulasi Penyiaran dan Perfilman","level":"A","modul":[8,10]},"no":9,"label":"Soal 9 · PGK MCMA"},{"id":"U10","kind":"tf","stem":"Tentukan benar atau salah untuk setiap pernyataan tentang distribusi dan klasifikasi.","opts":[{"t":"Klasifikasi usia film oleh LSF meliputi SU, 13+, 17+, dan 21+.","c":true,"why":"Itulah klasifikasi LSF."},{"t":"Siaran berlangganan lewat satelit atau kabel fiber optik adalah jalur distribusi selain terestrial.","c":true,"why":"Satelit dan kabel adalah jalur berlangganan."},{"t":"Siaran terestrial bersifat on-demand sehingga penonton menentukan sendiri jam tayang.","c":false,"why":"Terestrial bersifat linear: jadwal diatur stasiun."}],"explain":"","meta":{"elemen":2,"elemenNama":"Perkembangan Media, Teknologi, dan Regulasi","sub":"Regulasi Penyiaran dan Perfilman","level":"A","modul":[10]},"no":10,"label":"Soal 10 · PGK Kategori"},{"id":"U11","kind":"pick","stem":"Pada set ruang makan terdapat tirai jendela yang hanya memperindah ruangan (P), meja makan yang melengkapi fungsi ruang (Q), dan telepon yang diangkat aktor dalam adegan (R). Klasifikasi P, Q, dan R secara berurutan adalah...","opts":[["Set dressing, Action prop, Set property"],["Set dressing, Set property, Action prop",1],["Set structure, Set property, Action prop"],["Set property, Set dressing, Action prop"],["Action prop, Set property, Set dressing"]],"explain":"Tirai dekoratif yang tidak disentuh aktor adalah set dressing. Meja makan melengkapi fungsi ruang sebagai set property. Telepon yang diangkat aktor adalah action prop.","meta":{"elemen":3,"elemenNama":"Teknik Dasar Pengoperasian Peralatan Audio Visual","sub":"Tata Artistik","level":"K","modul":[14]},"no":11,"label":"Soal 11 · PG"},{"id":"U12","kind":"tf","stem":"Tentukan benar atau salah untuk setiap pernyataan tentang tata busana dan tata rias.","opts":[{"t":"Wardrobe adalah unsur set yang dibangun, seperti dinding dan lantai.","c":false,"why":"Wardrobe adalah pakaian dan aksesori aktor, bukan bagian set."},{"t":"Penataan rambut sesuai karakter dan era termasuk pekerjaan tata rias.","c":true,"why":"Tata rias mencakup wajah dan rambut."},{"t":"Rias korektif menyamarkan kilap kulit agar tampilan wajah tetap alami di depan kamera.","c":true,"why":"Itulah fungsi rias korektif."}],"explain":"","meta":{"elemen":3,"elemenNama":"Teknik Dasar Pengoperasian Peralatan Audio Visual","sub":"Tata Artistik","level":"K","modul":[14]},"no":12,"label":"Soal 12 · PGK Kategori"},{"id":"U13","kind":"pick","stem":"Seorang pewawancara memegang mikrofon di aula. Di belakangnya ada kipas dan obrolan penonton yang tidak diinginkan. Pola tangkap yang dominan dari depan dan meredam suara dari belakang adalah...","opts":[["Shotgun yang diarahkan ke langit-langit"],["Omnidirectional"],["Mikrofon diletakkan di belakang pembicara"],["Omnidirectional dengan gain dinaikkan"],["Cardioid",1]],"explain":"Cardioid dominan dari depan dan meredam belakang, sehingga cocok untuk memisahkan pembicara dari noise di belakangnya.","meta":{"elemen":3,"elemenNama":"Teknik Dasar Pengoperasian Peralatan Audio Visual","sub":"Tata Suara","level":"K","modul":[13]},"no":13,"label":"Soal 13 · PG"},{"id":"U14","kind":"pick","stem":"Dialog aktor terdengar menipis dan berubah warna setiap kali aktor menoleh ke samping, padahal jarak mikrofon boom tetap sama. Penyebab dan tindakan yang tepat adalah...","opts":[["Mikrofon berada off-axis, sehingga boom diarahkan lagi agar ujungnya mengikuti dan menunjuk ke mulut aktor.",1],["Terjadi dengung listrik, sehingga kabel diganti."],["Gain terlalu tinggi, sehingga gain diturunkan."],["Angin menerpa kapsul, sehingga dipasang deadcat."],["Mikrofon terlalu dekat, sehingga dijauhkan dua meter."]],"explain":"Berubahnya warna suara saat aktor menoleh menandakan mikrofon tidak lagi on-axis. Boom operator mengikuti gerak agar tetap mengarah ke mulut.","meta":{"elemen":3,"elemenNama":"Teknik Dasar Pengoperasian Peralatan Audio Visual","sub":"Tata Suara","level":"A","modul":[13]},"no":14,"label":"Soal 14 · PG"},{"id":"U15","kind":"mcma","stem":"Wawancara di ruang rapat ber-AC direkam dengan mikrofon omnidirectional. Hasilnya: desis AC terus-menerus, dengung saat kabel mikrofon sejajar adaptor laptop, dan suara pecah ketika narasumber berbicara keras. Pilih semua tindakan yang tepat:","opts":[["Mematikan AC saat take atau pindah ke ruang yang lebih sepi.",1],["Menurunkan gain input dan mengaktifkan limiter.",1],["Menaikkan gain agar narasumber terdengar di atas desis AC."],["Membiarkan semuanya dan menunggu noise reduction di penyuntingan."],["Menjauhkan kabel dari adaptor laptop dan memakai kabel berpelindung.",1]],"explain":"Desis AC ditangani di sumber, dengung lewat penataan dan pelindung kabel, suara pecah lewat gain dan limiter. Menaikkan gain memperbesar semua masalah, dan noise reduction tidak memperbaiki distorsi.","meta":{"elemen":3,"elemenNama":"Teknik Dasar Pengoperasian Peralatan Audio Visual","sub":"Tata Suara","level":"R","modul":[13]},"no":15,"label":"Soal 15 · PGK MCMA"},{"id":"U16","kind":"pick","stem":"Editor ingin suara kalimat tokoh A tetap terdengar ketika gambar sudah berpindah ke wajah tokoh B yang mendengarkan. Teknik pemotongan yang tepat adalah...","opts":[["Match cut"],["Memotong audio dan gambar tepat pada titik yang sama"],["J-cut"],["Jump cut"],["L-cut",1]],"explain":"L-cut membuat audio shot sebelumnya berlanjut ke gambar berikutnya. J-cut kebalikannya: audio shot berikutnya mulai lebih dulu.","meta":{"elemen":3,"elemenNama":"Teknik Dasar Pengoperasian Peralatan Audio Visual","sub":"Editing dan Kontinuitas","level":"A","modul":[5]},"no":16,"label":"Soal 16 · PG"},{"id":"U17","kind":"tf","stem":"Tentukan benar atau salah untuk setiap pernyataan tentang kontinuitas.","opts":[{"t":"Gelas yang isinya berubah antar-shot pada adegan yang sama adalah kesalahan kontinuitas properti.","c":true,"why":"Properti harus konsisten antar-shot."},{"t":"Cahaya matahari yang tiba-tiba berubah antar-shot dalam satu adegan melanggar kontinuitas waktu.","c":true,"why":"Waktu mencakup jam, cahaya matahari, dan cuaca."},{"t":"Kontinuitas hanya perlu dijaga pada shot close-up.","c":false,"why":"Kontinuitas dijaga pada semua shot."}],"explain":"","meta":{"elemen":3,"elemenNama":"Teknik Dasar Pengoperasian Peralatan Audio Visual","sub":"Editing dan Kontinuitas","level":"R","modul":[5]},"no":17,"label":"Soal 17 · PGK Kategori"},{"id":"U18","kind":"pick","stem":"Wawancara di dalam ruangan hanya diterangi bohlam tungsten berwarna kuning. Kamera memakai white balance Daylight dan gambar tampak oranye kemerahan. Tindakan yang tepat adalah...","opts":[["Memperkecil bukaan menjadi f/16."],["Mengubah shutter menjadi 1/200."],["Menaikkan ISO."],["Mengatur white balance ke preset tungsten atau manual sekitar 3200 K.",1],["Menambah kontras pada saat penyuntingan saja."]],"explain":"Warna oranye berasal dari ketidaksesuaian suhu warna. White balance disetel sesuai sumber cahaya, tungsten sekitar 3200 K.","meta":{"elemen":3,"elemenNama":"Teknik Dasar Pengoperasian Peralatan Audio Visual","sub":"Dasar Fotografi dan Videografi","level":"A","modul":[2,1]},"no":18,"label":"Soal 18 · PG"},{"id":"U19","kind":"mcma","stem":"Adegan kejar-kejaran direkam handheld. Hasilnya terlalu bergoyang sehingga penonton sulit mengikuti aksi, padahal sutradara ingin ketegangan tetap terasa. Pilih semua tindakan yang tepat:","opts":[["Memakai lensa yang lebih lebar dan mendekatkan kamera ke subjek.",1],["Memakai lensa tele agar subjek tampak lebih dekat."],["Merapatkan siku ke badan dan memakai strap atau layar sebagai tumpuan.",1],["Memasang semua shot di tripod agar goyangan hilang."],["Mengaktifkan stabilisasi kamera atau lensa dengan shutter sesuai aturan 180°.",1]],"explain":"Lensa lebar meredam guncangan, teknik tubuh dan stabilisasi membantu, dan ketegangan tetap terjaga. Lensa tele memperbesar guncangan, sedangkan tripod pada semua shot menghilangkan energi adegan.","meta":{"elemen":3,"elemenNama":"Teknik Dasar Pengoperasian Peralatan Audio Visual","sub":"Tata Kamera","level":"R","modul":[4]},"no":19,"label":"Soal 19 · PGK MCMA"},{"id":"U20","kind":"tf","stem":"Tentukan benar atau salah untuk setiap pernyataan.","opts":[{"t":"Memperkecil bukaan (angka f lebih besar) membuat gambar lebih gelap dan kedalaman ruang tajam lebih besar.","c":true,"why":"Bukaan kecil mengurangi cahaya dan memperdalam DoF."},{"t":"Menaikkan ISO tinggi pada ruangan gelap tidak menambah noise.","c":false,"why":"ISO tinggi menambah noise. Tambah cahaya lebih dulu."},{"t":"Overexposure pada siang terik dapat diatasi dengan ND filter tanpa mengubah shutter.","c":true,"why":"ND mengurangi cahaya yang masuk sehingga shutter tetap sesuai aturan 180°."}],"explain":"","meta":{"elemen":3,"elemenNama":"Teknik Dasar Pengoperasian Peralatan Audio Visual","sub":"Dasar Fotografi dan Videografi","level":"R","modul":[1,2]},"no":20,"label":"Soal 20 · PGK Kategori"},{"id":"U21","kind":"pick","stem":"Dokumen yang berisi jadwal harian syuting, lokasi, daftar kru, dan pemeran, serta dipakai di lapangan, adalah...","opts":[["Call sheet",1],["Storyboard"],["Script"],["Shot list"],["Mood board"]],"explain":"Call sheet adalah dokumen operasional lapangan berisi jadwal, lokasi, kru, dan pemeran. Storyboard berisi sketsa shot, shot list daftar teknis shot, dan script naskah.","meta":{"elemen":4,"elemenNama":"Proses Produksi dan Media Baru","sub":"Alur Produksi","level":"K","modul":[11]},"no":21,"label":"Soal 21 · PG"},{"id":"U22","kind":"mcma","stem":"Tim produksi video dokumenter sekolah akan memulai syuting hari pertama. Pilih semua tindakan yang sesuai SOP kerja tim:","opts":[["Tidak mengambil gambar tambahan tanpa koordinasi sutradara atau produser.",1],["Kamerawan menambah adegan baru sesuai selera tanpa memberi tahu."],["Mengadakan evaluasi bersama setelah syuting.",1],["Melewatkan evaluasi agar tim cepat pulang."],["Mengadakan briefing sebelum syuting untuk menyamakan persepsi.",1]],"explain":"SOP kerja tim: briefing sebelum, koordinasi saat, dan evaluasi sesudah syuting.","meta":{"elemen":4,"elemenNama":"Proses Produksi dan Media Baru","sub":"Alur Produksi","level":"A","modul":[11]},"no":22,"label":"Soal 22 · PGK MCMA"},{"id":"U23","kind":"tf","stem":"Tentukan benar atau salah untuk setiap pernyataan tentang format konten media baru.","opts":[{"t":"Video pendek dirancang untuk konsumsi cepat dengan hook di awal.","c":true,"why":"Durasinya singkat sehingga awal harus menarik."},{"t":"Vlog umumnya berdurasi 15 sampai 60 detik dan tidak bersifat personal.","c":false,"why":"Vlog bersifat personal dan berdurasi sedang sampai panjang."},{"t":"Podcast adalah konten audio on-demand yang cocok didengarkan sambil beraktivitas.","c":true,"why":"Podcast berupa audio dan dapat diputar kapan saja."}],"explain":"","meta":{"elemen":4,"elemenNama":"Proses Produksi dan Media Baru","sub":"Media Baru dan Konten Kreatif","level":"A","modul":[12]},"no":23,"label":"Soal 23 · PGK Kategori"},{"id":"U24","kind":"mcma","stem":"Tim membandingkan dua video. Video X: 80.000 tayangan, retention rate 20%, sedikit komentar. Video Y: 25.000 tayangan, retention rate 65%, banyak komentar. Pilih semua analisis yang tepat:","opts":[["Jumlah tayangan perlu dibaca bersama retention rate dan engagement.",1],["Retention rate tidak relevan untuk mengevaluasi konten."],["X pasti lebih baik karena tayangannya terbanyak."],["Y lebih layak dijadikan acuan gaya konten.",1],["Retention rate rendah pada X menunjukkan penonton cepat berhenti menonton.",1]],"explain":"Tayangan tinggi belum berarti konten baik. Retention rate dan engagement menunjukkan seberapa kuat konten menahan dan melibatkan penonton.","meta":{"elemen":4,"elemenNama":"Proses Produksi dan Media Baru","sub":"Media Baru dan Konten Kreatif","level":"R","modul":[12]},"no":24,"label":"Soal 24 · PGK MCMA"},{"id":"U25","kind":"pick","stem":"Dalam live streaming bertema wisata, pembawa acara menyisipkan tautan artikel pendukung di kolom obrolan saat membahas sebuah destinasi. Tindakan itu menerapkan karakt function mergeRec(L,R){
  if(!L) return R||null; if(!R) return L;
  const lu=L.updatedAt||0, ru=R.updatedAt||0, W=lu>=ru?L:R, O=lu>=ru?R:L;
  const out={name:L.name||R.name,createdAt:Math.min(L.createdAt||Infinity,R.createdAt||Infinity),updatedAt:Math.max(lu,ru),mod:{},paket:{}};
  if(!isFinite(out.createdAt)) out.createdAt=Date.now();
  const mk=new Set([...Object.keys(L.mod||{}),...Object.keys(R.mod||{})]);
  mk.forEach(n=>{ const a=(W.mod||{})[n], b=(O.mod||{})[n]; if(!a||!b){ out.mod[n]=a||b; return; }
    const m={...b,...a}; m.done=!!(a.done||b.done);
    ["visited","q","s","notes","checks","lab"].forEach(k=>{ m[k]={...(b[k]||{}),...(a[k]||{})}; }); out.mod[n]=m; });
  const pk=new Set([...Object.keys(L.paket||{}),...Object.keys(R.paket||{})]);
  pk.forEach(k=>{ const a=(W.paket||{})[k], b=(O.paket||{})[k]; if(!a||!b){ out.paket[k]=a||b; return; }
    if(a.finished&&b.finished) out.paket[k]=(a.finishedAt||0)<=(b.finishedAt||0)?a:b;   // pengumpulan pertama yang berlaku
    else if(a.finished) out.paket[k]=a; else if(b.finished) out.paket[k]=b; else out.paket[k]=a; });
  return out;
}
function syncStatus(){
  if(!CL||SY.mode!=="online") return {cls:"lokal",text:"Mode lokal · hanya di perangkat ini"};
  if(!CL.online()) return {cls:"off",text:CL.pending()?"Offline · menunggu jaringan":"Offline"};
  if(!SY.loaded) return {cls:"wait",text:"Menyambung…"};
  if(CL.pending()) return {cls:"wait",text:"Mengirim…"};
  return {cls:"ok",text:"Tersimpan di server"};
}
function drawSync(){
