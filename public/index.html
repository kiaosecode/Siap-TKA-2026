ialog, musik, dan efek suara menjadi satu track final adalah...","opts":[["Sound Designer"],["Colorist"],["Sound Mixer",1],["Foley Artist"]],"explain":"Sound Mixer menyatukan dan menyeimbangkan audio final."},{"id":"T3","kind":"pick","label":"Soal 3 · K3","stem":"Menggunakan safety harness saat di medan lereng adalah tindakan pencegahan risiko...","opts":[["Fisik",1],["Kimia"],["Psikososial"],["Biologis"]],"explain":"Safety harness melindungi dari risiko fisik jatuh."},{"id":"T4","kind":"pick","label":"Soal 4 · K3","stem":"Mengabaikan komitmen waktu dan datang terlambat melanggar prinsip...","opts":[["Etos Kerja dan Kedisiplinan",1],["Hak Cipta"],["K3"],["Regulasi"]],"explain":"Kedisiplinan adalah bagian dari etos kerja profesional."},{"id":"T5","kind":"pick","label":"Soal 5 · Regulasi","stem":"Teknologi yang memungkinkan beberapa kanal TV disiarkan dalam satu frekuensi disebut...","opts":[["Analog"],["Multipleksing",1],["Tapeless"],["Streaming"]],"explain":"Multipleksing adalah keunggulan siaran digital."},{"id":"T6","kind":"pick","label":"Soal 6 · Regulasi","stem":"Platform OTT (seperti Netflix) memiliki karakteristik...","opts":[["Linear (jadwal tetap)"],["On-demand (penonton memilih waktu)",1],["Hanya bisa diakses via antena"],["Tidak memerlukan internet"]],"explain":"OTT bersifat on-demand."},{"id":"T7","kind":"pick","label":"Soal 7 · Alur Produksi","stem":"Dokumen berupa sketsa visual urutan adegan sebelum syuting disebut...","opts":[["Script"],["Storyboard",1],["Call Sheet"],["Shot List"]],"explain":"Storyboard adalah sketsa visual adegan."},{"id":"T8","kind":"pick","label":"Soal 8 · Media Baru","stem":"Konten dengan durasi sangat singkat untuk konsumsi cepat di platform seperti TikTok disebut...","opts":[["Podcast"],["Vlog"],["Video Pendek (Shorts/Reels)",1],["Film Layar Lebar"]],"explain":"Video pendek dirancang untuk konsumsi cepat."},{"id":"T9","kind":"mcma","label":"Soal 9 · K3 (PGK)","stem":"Manakah tindakan yang tepat untuk mencegah risiko fatigue pada kru?","opts":[["Mengatur rotasi kerja.",1],["Memberikan batas jam lembur.",1],["Memberikan obat perangsang.",0],["Menyediakan ruang istirahat.",1],["Membebankan semua kerja ke satu orang.",0]],"explain":"Rotasi, batas jam, dan ruang istirahat adalah solusi manajerial yang tepat."},{"id":"T10","kind":"mcma","label":"Soal 10 · Regulasi (PGK)","stem":"Tindakan penyuntingan yang wajib untuk film remaja yang mengandung adegan minuman keras dan kata kotor adalah...","opts":[["Memblur (blur) visual botol minuman keras.",1],["Memotong total adegan keintiman.",1],["Mute (bungkam) kata-kata kotor.",1],["Memblur seluruh wajah aktor.",0],["Mempercepat durasi film.",0]],"explain":"Sesuai P3SPS: blur miras, cut keintiman, mute kata kotor."},{"id":"T11","kind":"mcma","label":"Soal 11 · Media Baru (PGK)","stem":"Tindakan yang mengoptimalkan interactivity pada live streaming adalah...","opts":[["Memasang polling real-time.",1],["Membacakan pertanyaan dari kolom Q&A.",1],["Menggunakan kamera otomatis.",0],["Menyetel audio dengan mikrofon kondensor.",0],["Mengabaikan komentar penonton.",0]],"explain":"Polling dan Q&A adalah bentuk interaksi dua arah."},{"id":"T12","kind":"tf","label":"Soal 12 · Profesi (BS)","stem":"Tentukan Benar atau Salah.","opts":[{"t":"Unit Manager bertanggung jawab mengatur lokasi, perizinan, dan transportasi.","c":true,"why":"Itu adalah tugas Unit Manager."},{"t":"Gaffer bertugas menyunting warna di pasca-produksi.","c":false,"why":"Colorist yang menyunting warna. Gaffer mengurus cahaya."},{"t":"Script Supervisor menjaga kontinuitas adegan.","c":true,"why":"Script supervisor mencatat dan menjaga kontinuitas."}]},{"id":"T13","kind":"tf","label":"Soal 13 · Regulasi (BS)","stem":"Tentukan Benar atau Salah.","opts":[{"t":"Film dengan klasifikasi D (18+) boleh ditayangkan pada pukul 18.30 WIB.","c":false,"why":"Klasifikasi D (18+) hanya tayang pukul 22.00-03.00."},{"t":"Menggunakan musik populer tanpa izin untuk tugas sekolah melanggar hak cipta.","c":true,"why":"Penggunaan tanpa izin tetap melanggar meski untuk tugas."},{"t":"LSF bertugas menyensor film sebelum tayang di bioskop.","c":true,"why":"LSF memiliki wewenang sensor film."}]},{"id":"T14","kind":"tf","label":"Soal 14 · Alur Produksi (BS)","stem":"Tentukan Benar atau Salah.","opts":[{"t":"Tahap pra-produksi meliputi riset, penulisan naskah, dan perencanaan.","c":true,"why":"Itu adalah bagian dari pra-produksi."},{"t":"Editing dan mixing dilakukan pada tahap produksi lapangan.","c":false,"why":"Editing dan mixing dilakukan di pasca-produksi."},{"t":"Call sheet memuat jadwal harian dan daftar kru.","c":true,"why":"Call sheet adalah dokumen operasional harian."}]},{"id":"T15","kind":"tf","label":"Soal 15 · Media Baru (BS)","stem":"Tentukan Benar atau Salah.","opts":[{"t":"Podcast umumnya berdurasi panjang dan bersifat audio-on-demand.","c":true,"why":"Podcast adalah audio-on-demand."},{"t":"Mengabaikan data analitik adalah strategi terbaik untuk media baru.","c":false,"why":"Data analitik (engagement, retention) penting untuk evaluasi."},{"t":"Video pendek dirancang untuk konsumsi cepat.","c":true,"why":"Video pendek dirancang untuk durasi singkat."}]}],"sectionsContent":{"pre":{"blocks":[{"type":"lead","text":"Kerjakan 5 soal berikut untuk mengukur pengetahuan awal Anda. Klik 'Periksa Jawaban' pada setiap soal untuk melihat pembahasan."},{"type":"actions","items":[{"label":"Mulai Timer & Acak Soal Pre-test","go":"tryout","pri":true}]},{"type":"html","html":"<p class='small'>Atau kerjakan langsung di bawah ini tanpa timer:<\/p>"},{"type":"qlist","ids":["P1","P2","P3","P4","P5"]}]},"materi":{"blocks":[{"type":"lead","text":"Bacalah ringkasan mendalam dari 4 Elemen BCF Non-TKTC ini. Pahami setiap peran dan aturannya, karena ini adalah fondasi dunia industri."},{"type":"html","html":"<h2>1. Profesi dan Struktur Kru<\/h2><p>Produksi film dan siaran adalah kerja tim. Memahami peran spesifik kru sangat penting agar tidak terjadi tumpang tindih tugas.<\/p>"},{"type":"table","head":["Departemen","Profesi","Peran & Tanggung Jawab Utama"],"rows":[["<b>Produksi<\/b>","<b>Produser<\/b>","Memimpin keseluruhan proyek, mencari dana, dan memegang keputusan bisnis."],["<b>Produksi<\/b>","<b>Line Producer<\/b>","Mengelola anggaran harian, menyusun jadwal (schedule), dan logistik."],["<b>Produksi<\/b>","<b>Unit Manager<\/b>","Mengurus perizinan lokasi, akomodasi, transportasi, dan keamanan set."],["<b>Penyutradaraan<\/b>","<b>Sutradara<\/b>","Pemimpin kreatif, mengarahkan akting, dan menentukan visi cerita."],["<b>Penyutradaraan<\/b>","<b>1st AD<\/b>","Jembatan sutradara dengan tim lapangan; mengatur urutan shot dan menjaga jadwal."],["<b>Penyutradaraan<\/b>","<b>Script Supervisor<\/b>","Mencatat kontinuitas (kesinambungan) properti, kostum, dan dialog agar tidak 'jump cut'."],["<b>Kamera<\/b>","<b>DOP / Penata Kamera<\/b>","Merancang komposisi, pencahayaan, dan pergerakan kamera."],["<b>Kamera<\/b>","<b>Steadicam Operator<\/b>","Mengoperasikan rig penstabil (Steadicam) untuk gerakan kamera yang halus."],["<b>Kamera<\/b>","<b>Focus Puller (1st AC)<\/b>","Asisten kamera yang memutar ring fokus agar subjek selalu tajam."],["<b>Kamera<\/b>","<b>DIT<\/b>","Bertanggung jawab atas backup data, kontrol kualitas gambar, dan workflow digital."],["<b>Cahaya & Grip<\/b>","<b>Gaffer<\/b>","Kepala departemen listrik/cahaya (merancang jenis, arah, dan warna lampu)."],["<b>Cahaya & Grip<\/b>","<b>Best Boy<\/b>","Tangan kanan Gaffer; mengurus logistik, kabel, dan administrasi."],["<b>Cahaya & Grip<\/b>","<b>Key Grip<\/b>","Kepala tim grip; menyiapkan peralatan penunjang kamera (rigging, dolly, tripod)."],["<b>Suara<\/b>","<b>Sound Recordist<\/b>","Merekam dan menyeimbangkan seluruh elemen audio menjadi track final."],["<b>Suara<\/b>","<b>Boom Operator<\/b>","Memegang stik mikrofon (boom pole) sedekat mungkin dengan aktor tanpa masuk bingkai."],["<b>Pasca<\/b>","<b>Editor<\/b>","Menyusun dan memotong gambar sesuai naskah dan tempo cerita."],["<b>Pasca<\/b>","<b>Colorist<\/b>","Menyelaraskan warna (color grading) agar visual konsisten."],["<b>Pasca<\/b>","<b>Foley Artist<\/b>","Membuat efek suara manual (langkah kaki, pintu) di studio."]]},{"type":"html","html":"<h2>2. Keselamatan dan Kesehatan Kerja (K3)<\/h2><p>K3 di industri kreatif bukan sekadar formalitas. Ada dua kategori risiko utama yang harus dikelola:<\/p>"},{"type":"table","head":["Jenis Risiko","Contoh Kasus di Lapangan","Solusi Pencegahan (Manajerial)"],"rows":[["<b>Risiko Fisik<\/b>","Kabel lampu terkelupas, terminal listrik kelebihan beban, kabel melintang di lantai, syuting di lereng/sungai.","Inspeksi instalasi listrik, penggunaan <i>safety harness<\/i>, <i>safety briefing<\/i>, memasang <i>cable protector<\/i> (lakban karet) di jalur kabel."],["<b>Risiko Psikososial (Fatigue)<\/b>","Jam kerja ekstrem (07.00-23.00 selama 6 hari berturut-turut), kru kelelahan, konsentrasi turun, terjadi kesalahan teknis berulang.","Menerapkan rotasi kru, menetapkan batas jam lembur sesuai ketenagakerjaan, menyediakan ruang istirahat yang layak, dan komunikasi dua arah."]]},{"type":"callout","kind":"waspada","tag":"Hak Pekerja","html":"<p>Kru berhak menolak pekerjaan berisiko jika tidak ada mitigasi/APD (Alat Pelindung Diri) yang memadai. Kontrak kerja tidak bisa menghapus hak keselamatan pekerja.<\/p>"},{"type":"html","html":"<h2>3. Etos Kerja dan Budaya Profesional<\/h2><p>Etos kerja adalah sikap mental yang menunjukkan tanggung jawab. Ada tiga pilar utama:<\/p>"},{"type":"tiles","items":[{"small":"Pilar 1","big":"Disiplin Waktu","foot":"Tepat waktu, jika terlambat harus konfirmasi dan bertanggung jawab."},{"small":"Pilar 2","big":"Kerahasiaan","foot":"Tidak membocorkan naskah atau raw footage sebelum rilis."},{"small":"Pilar 3","big":"Hak Cipta","foot":"Tidak menggunakan musik/film orang lain tanpa izin/lisensi."}]},{"type":"html","html":"<h2>4. Regulasi Penyiaran dan Perkembangan Media<\/h2><p>Industri penyiaran Indonesia sangat diatur untuk melindungi masyarakat dari konten negatif.<\/p>"},{"type":"table","head":["Istilah / Lembaga","Fungsi & Aturan"],"rows":[["<b>Multipleksing<\/b>","Keunggulan siaran digital: beberapa kanal TV dapat disiarkan dalam satu frekuensi secara bersamaan."],["<b>Platform OTT<\/b>","Over-The-Top (Netflix, Vidio). Bersifat <i>on-demand<\/i> (penonton bebas memilih waktu tayang), berbeda dengan TV terestrial yang <i>linear<\/i> (jadwal diatur stasiun)."],["<b>LSF (Lembaga Sensor Film)<\/b>","Lembaga yang berwenang menyensor dan mengklasifikasikan film sebelum tayang di bioskop/TV."],["<b>P3SPS KPI<\/b>","Pedoman Perilaku Penyiaran. Contoh aturan: Program dengan Klasifikasi D (Dewasa/18+) hanya boleh ditayangkan pukul <b>22.00 - 03.00 WIB<\/b>."],["<b>Sensor Wajib<\/b>","Visual keintiman tubuh harus dipotong total (tidak cukup di-blur), botol miras di-blur, kata-kata kotor dibungkam (mute)."]]},{"type":"html","html":"<h2>5. Alur Produksi dan Karakteristik Media Baru<\/h2>"},{"type":"steps","items":[{"title":"Pra-Produksi","desc":"Riset, menulis Script (naskah), membuat Storyboard (sketsa visual), dan menyusun Call Sheet (jadwal harian & daftar kru)."},{"title":"Produksi","desc":"Proses pengambilan gambar (syuting) dan perekaman suara di lapangan. Semua kru bekerja sesuai SOP."},{"title":"Pasca-Produksi","desc":"Editing (penyuntingan gambar), Mixing (penyelarasan audio), dan Mastering (finalisasi)."}]},{"type":"table","head":["Karakter Media Baru","Contoh Penerapan"],"rows":[["<b>Interactivity<\/b> (Interaksi dua arah)","Memasang fitur <i>polling<\/i> real-time, membacakan pertanyaan dari kolom Q&A saat live streaming."],["<b>Hypertextuality<\/b> (Keterhubungan)","Menyisipkan <i>hyperlink<\/i> atau tautan artikel di kolom obrolan (chat) saat topik sedang dibahas."],["<b>Data Analitik<\/b>","Melihat <i>engagement rate<\/i> dan <i>retention rate<\/i> (berapa lama penonton bertahan menonton) untuk mengevaluasi konten."]]},{"type":"actions","items":[{"label":"Saya sudah membaca, lanjut ke Asesmen Pasca","go":"post","pri":true}]}]},"post":{"blocks":[{"type":"lead","text":"Bandingkan hasil Anda dengan Pre-test. Kerjakan 5 soal berikut untuk melihat peningkatan."},{"type":"qlist","ids":["Q1","Q2","Q3","Q4","Q5"]},{"type":"actions","items":[{"label":"Lanjut ke Tryout (15 Soal)","go":"tryout","pri":true}]}]},"tryout":{"blocks":[{"type":"lead","text":"Mode Ujian: 15 soal. Klik tombol di bawah untuk memulai timer dan mengunci jawaban."},{"type":"actions","items":[{"label":"Mulai Tryout BCF (15 Soal)","act":"startExam","pri":true}]}]},"rekap":{"blocks":[{"type":"lead","text":"Analisis hasil Tryout Wawasan BCF Anda."},{"type":"html","html":"<div class=\"res\" id=\"rekap-container\">Memuat rekap...<\/div>"},{"type":"actions","items":[{"label":"Kembali ke Daftar Modul","go":"home","pri":true}]}]}}},{"meta":{"id":9,"storageKey":"fke-modul9-mandiri-v1","topKick":"Modul 9","kicker":"Modul 9 · Elemen 1 BCF","title":"K3 & Etos Kerja Profesional","intro":"Memahami mitigasi risiko fisik, psikososial, dan pilar etos kerja di industri penyiaran.","chips":[{"label":"Memahami","color":"#ffb454"},{"label":"Menerapkan","color":"#7cc0ff"},{"label":"Menalar","color":"#7fe0a8"}],"howto":["<b>1. Asesmen Awal.<\/b> Uji pengetahuan awal Anda.","<b>2. Materi.<\/b> Pelajari tabel risiko K3 dan pilar etos kerja.","<b>3. Asesmen Pasca.<\/b> Uji pemahaman setelah membaca.","<b>4. Tryout.<\/b> Uji kesiapan Anda dengan 10 soal."],"objectives":["<b>Memahami:<\/b> Mengidentifikasi risiko K3 dan prinsip etos kerja.","<b>Menalar:<\/b> Menganalisis solusi pencegahan risiko K3 dan kasus pelanggaran etos kerja."]},"sections":[{"id":"mulai","nav":"Mulai","title":"K3 & Etos Kerja"},{"id":"pre","nav":"Asesmen Awal","title":"Asesmen Awal"},{"id":"materi","nav":"Materi","title":"Materi K3 & Etos Kerja"},{"id":"post","nav":"Asesmen Pasca","title":"Asesmen Pasca"},{"id":"tryout","nav":"Tryout","title":"Tryout K3 & Etos Kerja"},{"id":"rekap","nav":"Rekap","title":"Rekap"}],"sectionQuestions":{"pre":["P1","P2","P3"],"post":["Q1"," dua arah)","Memasang fitur <i>polling<\/i> real-time, membacakan pertanyaan dari kolom Q&A saat live streaming."],["<b>Hypertextuality<\/b> (Keterhubungan)","Menyisipkan <i>hyperlink<\/i> atau tautan artikel di kolom obrolan (chat) saat topik sedang dibahas."],["<b>Data Analitik<\/b>","Melihat <i>engagement rate<\/i> (like/komen) dan <i>retention rate<\/i> (berapa lama penonton bertahan menonton) untuk mengevaluasi konten."]]},{"type":"html","html":"<h2>Format Konten Media Baru<\/h2>"},{"type":"table","head":["Format Konten","Karakteristik Utama"],"rows":[["<b>Vlog<\/b>","Dokumentasi kegiatan/perjalanan, durasi sedang hingga panjang, bersifat personal."],["<b>Podcast<\/b>","Konten audio on-demand, umumnya berdurasi panjang, cocok untuk didengarkan sambil beraktivitas."],["<b>Video Pendek (Reels/TikTok)<\/b>","Durasi sangat singkat (15-60 detik), dirancang untuk konsumsi cepat dengan <i>hook<\/i> di awal."],["<b>Live Streaming<\/b>","Disiarkan secara real-time, sangat interaktif (polling, Q&A, chat)."]]},{"type":"callout","kind":"penting","tag":"Evaluasi Konten","html":"<p>Jangan hanya melihat jumlah tayangan (<i>views<\/i>). Video dengan 100.000 tayangan tetapi <i>retention rate<\/i> rendah (25%) berarti penonton cepat bosan. Video dengan 30.000 tayangan tetapi <i>retention<\/i> tinggi (70%) dan banyak komentar lebih layak dijadikan acuan gaya konten.<\/p>"},{"type":"actions","items":[{"label":"Saya sudah membaca, lanjut ke Asesmen Pasca","go":"post","pri":true}]}]},"post":{"blocks":[{"type":"lead","text":"Uji pemahaman Anda setelah membaca materi."},{"type":"qlist","ids":["Q1","Q2","Q3"]},{"type":"actions","items":[{"label":"Lanjut ke Tryout","go":"tryout","pri":true}]}]},"tryout":{"blocks":[{"type":"lead","text":"Klik tombol di bawah untuk memulai ujian (10 soal)."},{"type":"actions","items":[{"label":"Mulai Tryout Media Baru","act":"startExam","pri":true}]}]},"rekap":{"blocks":[{"type":"lead","text":"Analisis hasil Tryout Media Baru Anda."},{"type":"html","html":"<div class=\"res\" id=\"rekap-container\">Memuat rekap...<\/div>"},{"type":"actions","items":[{"label":"Kembali ke Daftar Modul","go":"home","pri":true}]}]}}},{"meta":{"id":13,"storageKey":"fke-modul13-mandiri-v1","topKick":"Modul 13","kicker":"Modul 13 · Elemen 3 BCF · Persiapan TKA 2026","title":"Tata Suara","intro":"Memilih mikrofon, menempatkannya dengan benar, menjalankan SOP perekaman, dan menganalisis dengung, distorsi, serta suara angin. Untuk siswa kelas XII Produksi Film, Elemen 3 sub-elemen Tata Suara.","chips":[{"label":"Memahami","color":"#ffb454"},{"label":"Menerapkan","color":"#7cc0ff"},{"label":"Menalar","color":"#7fe0a8"}],"howto":["<b>1. Tebak dulu, baru baca.<\/b> Tiap bagian dibuka dengan kotak <span class=\"small\">Tebak dulu<\/span>.","<b>2. Cek paham.<\/b> Setelah penjelasan, jawab kotak <span class=\"small\">Cek paham<\/span> untuk melihat umpan balik langsung.","<b>3. Praktik.<\/b> Bagian Praktik dikerjakan bersama fasilitator memakai alat suara yang tersedia di sekolah."],"objectives":["<b>Memahami:<\/b> menyebutkan jenis dan fungsi peralatan suara, serta membedakan pola tangkap omnidirectional, cardioid, dan shotgun.","<b>Menerapkan:<\/b> menentukan penempatan mikrofon dan boom pole, serta menjalankan SOP perekaman suara di lapangan.","<b>Menalar:<\/b> menganalisis dengung, distorsi, desis, dan suara angin, lalu memilih solusi yang tepat tanpa merusak kualitas dialog."]},"sections":[{"id":"mulai","nav":"Mulai","title":"Tata Suara"},{"id":"b1","nav":"Bagian 1","title":"Rantai suara dan peralatan","time":"20 menit"},{"id":"b2","nav":"Bagian 2","title":"Pola tangkap mikrofon","time":"20 menit"},{"id":"b3","nav":"Bagian 3","title":"Penempatan mikrofon dan boom pole","time":"25 menit"},{"id":"b4","nav":"Bagian 4","title":"SOP perekaman suara di lapangan","time":"20 menit"},{"id":"b5","nav":"Bagian 5","title":"Analisis noise dan distorsi","time":"25 menit"},{"id":"latihan","nav":"Latihan","title":"Latihan soal bergaya TKA","time":"25 menit"},{"id":"cek","nav":"Cek akhir","title":"Uji dirimu sendiri","time":"10 menit"},{"id":"praktik","nav":"Praktik","title":"Bengkel suara","time":"60 menit"},{"id":"kartu","nav":"Kartu","title":"Kartu tata suara"}],"sectionQuestions":{"b1":["T1","C11","C12","C13"],"b2":["T2","C21","C22","C23"],"b3":["T3","C31","C32","C33"],"b4":["T4","C41","C42","C43"],"b5":["T5","C51","C52","C53","C54"],"latihan":["S1","S2","S3","S4"],"cek":["L1","L2","L3"]},"praktikChecks":["pa1","pa2","pa3","pa4","pb1","pb2","pb3","pb4","pc1","pc2","pc3","pd1","pd2"],"labs":{},"questions":[{"id":"T1","kind":"pick","label":"T1","stem":"Urutan rantai suara dari sumber sampai pemantauan yang benar adalah...","opts":[["Sumber suara → mikrofon → kabel → recorder → headphone",1],["Mikrofon → recorder → sumber suara → headphone",0],["Recorder → mikrofon → headphone → sumber suara",0]],"explain":"Suara berasal dari sumber, ditangkap mikrofon, dibawa kabel, direkam recorder, lalu dipantau lewat headphone.","bare":true},{"id":"C11","kind":"pick","label":"1.1","stem":"Mikrofon yang membutuhkan phantom power 48 V adalah...","opts":[["Mikrofon kondensor",1],["Mikrofon dinamis",0],["Clapper board",0]],"explain":"Mikrofon kondensor peka dan memerlukan phantom power dari recorder atau mixer. Mikrofon dinamis tidak memerlukannya.","bare":true},{"id":"C12","kind":"pick","label":"1.2","stem":"Alat yang meredam getaran tangan atau tiang boom agar tidak terekam sebagai bunyi gesekan adalah...","opts":[["Shock mount",1],["Windscreen",0],["Clapper board",0]],"explain":"Shock mount menggantung mikrofon pada karet atau pegas sehingga getaran tidak sampai ke kapsul.","bare":true},{"id":"C13","kind":"pick","label":"1.3","stem":"Narasumber berjalan di shot lebar sehingga boom sulit dekat tanpa masuk bingkai. Mikrofon yang paling praktis adalah...","opts":[["Lavalier yang dijepit pada pakaian",1],["Kondensor studio di atas meja",0],["Mikrofon omnidirectional di lantai",0]],"explain":"Lavalier selalu dekat dengan mulut dan tidak terlihat di bingkai lebar.","bare":true},{"id":"T2","kind":"pick","label":"T2","stem":"Mikrofon omnidirectional menangkap suara dari...","opts":[["Segala arah dengan kekuatan yang sama",1],["Depan saja",0],["Belakang saja",0]],"explain":"Omnidirectional tidak memilih arah, sehingga noise dan pantulan ruangan ikut masuk.","bare":true},{"id":"C21","kind":"tf","label":"Soal 2.1 · benar atau salah","stem":"Tentukan benar atau salah untuk tiap pernyataan tentang pola tangkap.","opts":[{"t":"Cardioid menangkap dominan dari depan dan meredam suara dari belakang.","c":true,"why":"Bentuk polarnya seperti jantung: kuat di depan, lemah di belakang."},{"t":"Omnidirectional paling tepat untuk dialog di tempat bising karena menangkap semua suara.","c":false,"why":"Justru karena menangkap semua suara, noise ikut terekam."},{"t":"Shotgun sangat terarah ke depan sehingga harus diarahkan tepat ke sumber suara.","c":true,"why":"Bila melenceng (off-axis), suara menjadi tipis dan berubah warna."}],"explain":""},{"id":"C22","kind":"pick","label":"2.2","stem":"Tim ingin merekam suasana pasar sebagai ambience dari segala arah. Pola tangkap yang cocok adalah...","opts":[["Omnidirectional",1],["Shotgun yang diarahkan ke satu penjual",0],["Cardioid yang menghadap tembok",0]],"explain":"Ambience berasal dari segala arah, sehingga pola omnidirectional paling sesuai.","bare":true},{"id":"C23","kind":"pick","label":"2.3","stem":"Dialog dua aktor direkam di tepi jalan ramai dengan mikrofon boom. Pola yang paling tepat adalah...","opts":[["Terarah (shotgun) yang diarahkan ke aktor",1],["Omnidirectional agar semua suara masuk",0],["Mikrofon diletakkan di lantai",0]],"explain":"Pola terarah dan dekat dengan sumber memperbesar dialog dibanding noise di sekelilingnya.","bare":true},{"id":"T3","kind":"pick","label":"T3","stem":"Boom operator menempatkan mikrofon...","opts":[["Sedekat mungkin ke mulut aktor, tetapi di luar bingkai",1],["Sejauh mungkin agar aman dari bingkai",0],["Di belakang aktor agar tidak terlihat",0]],"explain":"Dekat berarti dialog lebih kuat dibanding noise ruangan. Syaratnya mikrofon tetap di luar bingkai.","bare":true},{"id":"C31","kind":"pick","label":"3.1","stem":"Pada medium shot setinggi dada, posisi boom yang paling tepat adalah...","opts":[["Tepat di atas batas bingkai, diarahkan ke mulut aktor",1],["Di lantai di antara aktor",0],["Di belakang aktor",0]],"explain":"Ada ruang di atas kepala pada medium shot, sehingga mikrofon dapat berada sangat dekat di atas batas bingkai.","bare":true},{"id":"C32","kind":"pick","label":"3.2","stem":"Mikrofon yang tidak mengarah ke mulut aktor (off-axis) menghasilkan...","opts":[["Suara menipis dan berubah warna",1],["Suara lebih jernih",0],["Volume otomatis naik",0]],"explain":"Mikrofon terarah paling baik menangkap dari depannya. Di luar sumbu, suara kehilangan bagian frekuensi dan berubah warna.","bare":true},{"id":"C33","kind":"tf","label":"Soal 3.3 · benar atau salah","stem":"Tentukan benar atau salah untuk tiap pernyataan.","opts":[{"t":"Menjauhkan mikrofon dari aktor membuat dialog lebih bersih karena noise ruangan berkurang.","c":false,"why":"Sebaliknya. Dialog melemah sementara noise ruangan tetap sama, sehingga perbandingannya memburuk."},{"t":"Bayangan boom di wajah atau dinding perlu dikoordinasikan dengan penata cahaya.","c":true,"why":"Posisi lampu atau boom dapat digeser agar bayangan tidak masuk bingkai."},{"t":"Pada ruangan berpantulan, mikrofon didekatkan dan penyerap seperti selimut ditaruh di luar bingkai.","c":true,"why":"Dekat dan penyerap mengurangi pantulan yang terekam."}],"explain":""},{"id":"T4","kind":"tf","label":"T4","stem":"Tentukan benar atau salah.","opts":[{"t":"Sound check dengan headphone dilakukan sebelum take dimulai.","c":true,"why":"Level dan kebersihan suara diperiksa sebelum merekam."},{"t":"Headphone cukup dipakai sesudah syuting selesai.","c":false,"why":"Headphone dipakai sepanjang take untuk memantau yang benar-benar terekam."},{"t":"Gain diatur supaya puncak dialog menyentuh 0 dBFS.","c":false,"why":"Menyentuh 0 dBFS berarti clipping."}],"explain":""},{"id":"C41","kind":"pick","label":"4.1","stem":"Urutan SOP perekaman yang benar adalah...","opts":[["Cek alat → sound check dan atur gain → rekam dengan slate → room tone → backup",1],["Rekam → cek alat → backup → sound check",0],["Backup → rekam → atur gain → cek alat",0]],"explain":"Persiapan dan sound check mendahului take. Room tone dan backup dilakukan sesudahnya.","bare":true},{"id":"C42","kind":"pick","label":"4.2","stem":"Room tone direkam untuk...","opts":[["Menambal jeda dan menyamakan suasana ruangan saat penyuntingan",1],["Mengeraskan dialog aktor",0],["Menggantikan musik latar",0]],"explain":"Room tone adalah suara ruangan tanpa dialog selama sekitar 30 sampai 60 detik.","bare":true},{"id":"C43","kind":"pick","label":"4.3","stem":"Phantom power sebaiknya dimatikan sebelum...","opts":[["Mencabut atau memasang mikrofon kondensor",1],["Memakai headphone",0],["Memberi nama file",0]],"explain":"Mencabut atau memasang saat phantom power menyala dapat menimbulkan letupan keras dan merusak peralatan.","bare":true},{"id":"T5","kind":"pick","label":"T5","stem":"Dengung listrik (hum) dihilangkan dengan menaikkan volume rekaman. Benar atau salah?","opts":[["Benar",0],["Salah",1]],"explain":"Salah. Menaikkan volume memperkuat dengung juga. Penyebabnya harus ditangani di kabel dan peralatan.","bare":true},{"id":"C51","kind":"pick","label":"5.1","stem":"Dengung (hum) diatasi dengan...","opts":[["Kabel berpelindung (shielded) dan ground loop isolator",1],["Menaikkan gain recorder",0],["Mengganti ke mikrofon omnidirectional",0]],"explain":"Dengung berasal dari gangguan listrik. Pelindung kabel dan isolator memutus jalur gangguan.","bare":true},{"id":"C52","kind":"pick","label":"5.2","stem":"Suara pecah hanya pada bagian keras dialog. Tindakan yang tepat adalah...","opts":[["Menurunkan gain input dan mengaktifkan limiter",1],["Menaikkan gain agar lebih keras",0],["Memasang windscreen",0]],"explain":"Suara pecah (clipping) terjadi saat level terlalu tinggi. Gain diturunkan dan limiter menahan puncak.","bare":true},{"id":"C53","kind":"pick","label":"5.3","stem":"Gemuruh rendah saat angin menerpa mikrofon di luar ruangan diatasi dengan...","opts":[["Windscreen busa atau deadcat",1],["Kabel XLR yang lebih panjang",0],["Limiter",0]],"explain":"Windscreen dan deadcat menahan embusan angin sebelum mengenai kapsul mikrofon.","bare":true},{"id":"C54","kind":"mcma","label":"Soal 5.4 · pilihan majemuk","stem":"Manakah yang dapat menimbulkan dengung pada rekaman? Pilih semua yang benar.","opts":[["Kabel audio sejajar dan berimpitan dengan kabel daya.",1,"Medan listrik kabel daya menginduksi sinyal audio."],["Ground loop antar peralatan.",1,"Beda potensial ground menimbulkan dengung."],["Kabel yang tidak berpelindung.",1,"Tanpa pelindung, kabel mudah menerima gangguan."],["Windscreen yang terlalu tebal.",0,"Windscreen berurusan dengan angin, bukan dengung."],["Gain terlalu rendah.",0,"Gain rendah membuat sinyal kecil, bukan menimbulkan dengung."]],"explain":"Dengung berasal dari gangguan listrik: kabel sejajar daya, ground loop, dan kabel tanpa pelindung."},{"id":"S1","kind":"pick","label":"Soal 1 · penerapan · pilihan ganda","stem":"Tim merekam dialog dua aktor di ruang tamu berlantai keramik dan dinding kosong. Hasilnya bergema dan terdengar jauh. Mikrofon shotgun di boom berada sekitar 1,5 meter dari aktor karena bingkai lebar, dan sutradara tidak mau bingkai diubah. Tindakan paling tepat adalah...","opts":[["Menaikkan gain recorder agar dialog lebih keras.",0,"Gain menaikkan gema dan noise sekaligus."],["Memasang lavalier pada aktor sebagai sumber utama, boom sebagai cadangan, dan menaruh penyerap seperti selimut di luar bingkai.",1,"Lavalier dekat dengan mulut sehingga gema berkurang. Penyerap mengurangi pantulan tanpa mengubah bingkai."],["Mengganti mikrofon menjadi omnidirectional agar lebih banyak suara masuk.",0,"Memperbanyak pantulan yang terekam."],["Meletakkan mikrofon di lantai di antara aktor.",0,"Lantai keramik memantulkan suara dan menambah gema."],["Mengandalkan mikrofon bawaan kamera.",0,"Letaknya jauh dari aktor sehingga kualitasnya paling rendah."]],"explain":"Masalah utama adalah jarak dan pantulan. Mendekatkan sumber dan mengurangi pantulan menyelesaikannya tanpa mengubah bingkai."},{"id":"S2","kind":"mcma","label":"Soal 2 · penalaran · pilihan majemuk","stem":"Rekaman wawancara di tepi pantai bermasalah: gemuruh saat angin bertiup, desis halus yang konstan, dan suara pecah ketika narasumber tertawa. Recorder diatur pada gain tinggi dan mikrofon berjarak sekitar 1 meter. Pilih semua tindakan yang tepat.","opts":[["Memasang windscreen busa dan deadcat pada mikrofon.",1,"Mengatasi gemuruh angin."],["Mendekatkan mikrofon ke narasumber lalu menurunkan gain.",1,"Gain rendah mengurangi desis dan potensi pecah."],["Mengaktifkan limiter pada recorder.",1,"Menahan puncak saat tertawa."],["Menaikkan gain lebih tinggi agar narasumber lebih keras daripada angin.",0,"Angin, desis, dan pecah justru bertambah."],["Mengganti ke mikrofon omnidirectional agar angin terbagi merata.",0,"Omnidirectional tidak menahan angin dan menangkap lebih banyak noise."],["Membiarkan semuanya lalu memperbaiki dengan noise reduction saja.",0,"Distorsi dan angin sulit diperbaiki di penyuntingan."]],"explain":"Tiga masalah punya tiga penyebab: angin, gain tinggi dengan jarak jauh, dan puncak tak terkendali. Tiap tindakan benar menangani satu atau lebih penyebab."},{"id":"S3","kind":"tf","label":"Soal 3 · penerapan · benar atau salah","stem":"Tentukan benar atau salah untuk tiap pernyataan.","opts":[{"t":"Mikrofon kondensor yang sangat peka selalu lebih baik di lokasi bising karena menangkap detail dialog.","c":false,"why":"Karena peka, noise sekitar juga tertangkap."},{"t":"Pada boom, mikrofon diarahkan on-axis ke mulut aktor.","c":true,"why":"Off-axis menipiskan dan mengubah warna suara."},{"t":"Phantom power dimatikan sebelum mikrofon kondensor dicabut.","c":true,"why":"Mencegah letupan dan kerusakan."}],"explain":""},{"id":"S4","kind":"pick","label":"Soal 4 · penerapan · pilihan ganda","stem":"Editor mengeluh bahwa setelah dialog dipotong, jeda terdengar mati tanpa suasana ruangan. Langkah SOP di lokasi yang seharusnya dilakukan adalah...","opts":[["Merekam room tone sekitar 30 sampai 60 detik di tiap ruang saat semua kru diam.",1,"Room tone dipakai untuk menambal jeda."],["Menaikkan gain saat merekam dialog.",0,"Tidak ada hubungannya dengan jeda."],["Merekam musik latar tambahan.",0,"Musik bukan pengganti suasana ruangan."],["Memakai omnidirectional pada semua adegan.",0,"Tidak menyelesaikan jeda yang mati."],["Menghapus file yang berisi jeda.",0,"Memperburuk masalah."]],"explain":"Room tone adalah bahan penyambung suasana ruangan saat penyuntingan."},{"id":"L1","kind":"pick","label":"Cek 1 · memahami","stem":"Tiga mikrofon dibandingkan. Mikrofon X menangkap sama kuat dari segala arah. Mikrofon Y dominan dari depan dan meredam dari belakang. Mikrofon Z sangat sempit dan terarah, dipasang di boom. Pola tangkap X, Y, dan Z secara berurutan adalah...","opts":[["Omnidirectional, Cardioid, Shotgun",1],["Cardioid, Omnidirectional, Shotgun",0],["Shotgun, Cardioid, Omnidirectional",0],["Cardioid, Shotgun, Omnidirectional",0],["Omnidirectional, Shotgun, Cardioid",0]],"explain":"X segala arah adalah omnidirectional. Y dominan depan adalah cardioid. Z sangat terarah adalah shotgun."},{"id":"L2","kind":"pick","label":"Cek 2 · menerapkan","stem":"Adegan dua aktor duduk berhadapan di ruang kelas, direkam dua-shot setinggi dada. Lampu di atas membuat bayangan boom jatuh ke dinding belakang. Tindakan boom operator yang tepat adalah...","opts":[["Menurunkan mikrofon tepat di depan wajah aktor.",0,"Masuk bingkai."],["Tetap di atas batas bingkai dan on-axis, lalu berkoordinasi dengan penata cahaya untuk menggeser lampu atau posisi boom agar bayangan tidak masuk bingkai.",1,"Menjaga jarak dekat dan arah tepat tanpa merusak gambar."],["Menempelkan mikrofon pada kamera.",0,"Terlalu jauh dari aktor."],["Menaruh mikrofon di belakang aktor.",0,"Suara off-axis dan menipis."],["Meminta lampu dimatikan.",0,"Merusak eksposur gambar."]],"explain":"Suara dan gambar saling bergantung. Solusi yang baik menjaga keduanya."},{"id":"L3","kind":"mcma","label":"Cek 3 · menalar","stem":"Rekaman studio memiliki dengung konstan yang terdengar saat tidak ada yang bicara. Meter hanya mencapai sekitar −40 dBFS pada dialog, dan ketika editor menaikkan volume, desisnya ikut bertambah. Pilih semua analisis dan solusi yang tepat.","opts":[["Dengung diselidiki dari kabel yang tidak berpelindung, kabel sejajar kabel daya, atau ground loop.",1,"Itu penyebab dengung yang paling umum."],["Level terlalu rendah. Dekatkan mikrofon dan naikkan gain secukupnya sampai puncak sekitar −12 sampai −6 dBFS.",1,"Level yang cukup di sumber mengurangi desis relatif."],["Menaikkan volume di penyuntingan menaikkan noise bersama dialog sehingga bukan solusi utama.",1,"Noise dan dialog diperkuat sama banyak."],["Mengaktifkan limiter akan menghilangkan dengung.",0,"Limiter menahan puncak, bukan menghapus dengung."],["Mengganti ke omnidirectional agar dengung terbagi merata.",0,"Tidak ada kaitannya dan menambah noise ruang."]],"explain":"Dengung berasal dari gangguan listrik, sedangkan desis menunjukkan gain pada level yang terlalu rendah di sumber. Keduanya diperbaiki di lokasi."}],"sectionsContent":{"b1":{"blocks":[{"type":"tebak","ids":["T1"]},{"type":"lead","text":"Suara yang buruk sulit diselamatkan di penyuntingan. Karena itu hampir semua pekerjaan penting terjadi di lokasi, sebelum dan saat merekam."},{"type":"html","html":"<h3>Rantai suara<\/h3>"},{"type":"steps","items":[{"title":"Sumber suara","desc":"Aktor, efek, atau suasana tempat (ambience)."},{"title":"Mikrofon","desc":"Mengubah getaran udara menjadi sinyal listrik."},{"title":"Kabel atau transmitter","desc":"Membawa sinyal ke recorder. Kabel XLR seimbang lebih tahan gangguan listrik."},{"title":"Recorder atau mixer","desc":"Mengatur gain dan merekam. Di sekolah tersedia Zoom H6."},{"title":"Headphone","desc":"Memantau apa yang benar-benar terekam."}]},{"type":"html","html":"<h3>Jenis mikrofon<\/h3>"},{"type":"table","head":["Jenis","Ciri","Cocok untuk","Catatan"],"rows":[["<b>Shotgun (boom)<\/b>","Sangat terarah, dipasang di ujung boom pole.","Dialog di lokasi, aktor yang bergerak.","Butuh boom operator dan windscreen."],["<b>Lavalier<\/b>","Kecil, dijepit pada pakaian dekat dada. Kabel atau nirkabel.","Wawancara, shot lebar, aktor berjalan.","Rawan gesekan kain."],["<b>Handheld<\/b>","Dipegang dekat mulut, umumnya dinamis.","Reportase, pembawa acara, siaran langsung.","Dekatkan ke mulut."],["<b>Kondensor studio<\/b>","Sangat peka dan detail, perlu phantom power 48 V.","Ruang tenang: voice over, studio.","Karena peka, noise ruangan ikut terekam."]]},{"type":"html","html":"<h3>Dinamis dan kondensor<\/h3>"},{"type":"table","head":["","Dinamis","Kondensor"],"rows":[["Kepekaan","Lebih rendah","Tinggi, menangkap detail"],["Daya","Tanpa phantom power","Perlu phantom power 48 V"],["Ketahanan","Tahan benturan","Lebih rapuh"],["Lokasi bising","Lebih aman","Menangkap noise lebih banyak"]]},{"type":"html","html":"<h3>Peralatan pendukung<\/h3>"},{"type":"table","head":["Alat","Fungsi"],"rows":[["Boom pole","Tiang penyangga agar mikrofon dapat berada di atas bingkai."],["Shock mount","Meredam getaran dan bunyi sentuhan."],["Windscreen, blimp, deadcat","Menahan embusan angin."],["Pop filter","Meredam letupan huruf P dan B pada voice over."],["Kabel XLR","Kabel seimbang yang tahan dengung."],["Recorder","Mengatur gain, memberi phantom power, merekam."],["Headphone","Memantau suara sebenarnya."],["Clapper board","Penanda sinkron gambar dan suara."]]},{"type":"callout","kind":"penting","tag":"Di sekolah kita","html":"<p>Zoom H6 dan headphone tersedia untuk praktik. Pilih mikrofon sesuai alat yang ada dan tanyakan fasilitator.<\
