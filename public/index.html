[["Zoom in optik dari posisi tetap",0,"Zoom tidak mengubah perspektif."],["Dolly in dengan kamera berpindah maju",1,"Dolly memindahkan kamera sehingga perspektif ruang berubah."],["Digital zoom pada kamera",0,"Digital zoom menurunkan kualitas gambar dan tidak mengubah perspektif."],["Tilt up dari lantai ke langit-langit",0,"Tilt hanya rotasi vertikal, bukan perpindahan."],["Pan dari kiri ke kanan",0,"Pan hanya rotasi horizontal."]]},{"id":"S3","kind":"mcma","label":"Soal 3 · penalaran · pilihan majemuk","stem":"Tim merekam pengantin berjalan di lapangan dengan kamera handheld tanpa gimbal. Hasil bergoyang, dan saat kamera diputar cepat, bangunan tampak miring melengkung. Manakah tindakan yang tepat?","opts":[["Memperlambat gerak pan, dengan frame diam di awal dan akhir.",1,"Memperlambat gerak mengurangi rolling shutter."],["Mengaktifkan stabilisasi, merapatkan siku, dan memakai strap.",1,"Teknik tangan dan stabilisasi menekan guncangan."],["Memakai lensa lebar dan mendekatkan kamera ke subjek.",1,"Lensa lebar meredam goyangan."],["Memakai lensa tele 150 mm dari jarak jauh.",0,"Memperbesar goyangan."],["Memutar kamera lebih cepat agar goyangan tidak terlihat.",0,"Memperparah rolling shutter."],["Menaikkan ISO untuk mengurangi goyangan.",0,"ISO tidak memengaruhi goyangan."]]},{"id":"S4","kind":"tf","label":"Soal 4 · penalaran · benar atau salah","stem":"Tim memakai gimbal untuk tracking shot di sebuah koridor. Tentukan benar atau salah untuk tiap pernyataan.","opts":[{"t":"Gimbal harus diseimbangkan (balance) sebelum motornya dinyalakan.","c":true,"why":"Gimbal harus seimbang agar motor tidak terbebani."},{"t":"Pada mode lock, kamera selalu mengikuti gerak operator ke kiri dan kanan.","c":false,"why":"Mode follow yang mengikuti gerak operator; mode lock menjaga arah kamera."},{"t":"Dengan gimbal, teknik berjalan yang halus tidak lagi diperlukan.","c":false,"why":"Gimbal tidak menggantikan teknik berjalan yang baik."}]},{"id":"L1","kind":"pick","label":"Soal L1 · penalaran · pilihan ganda","stem":"Adegan kejar-kejaran di lorong sempit. Kamera handheld tanpa gimbal, lensa 35 mm, gerakan pan cepat. Hasil: goyangan dan rolling shutter. Tindakan paling tepat tanpa mengubah gaya dokumenter adalah...","instant":false,"exam":true,"opts":[["Memakai lensa tele 150 mm dari jauh.",0,"Tele memperbesar goyangan."],["Memperlambat pan, aktifkan stabilisasi, rapatkan siku, dan pakai strap.",1,"Mengurangi guncangan dan rolling shutter tanpa mengubah gaya."],["Memutar kamera lebih cepat agar goyangan tidak terlihat.",0,"Memperparah rolling shutter."],["Menaikkan ISO ke 6400.",0,"ISO tidak mengubah goyangan."],["Mengganti lensa menjadi makro.",0,"Tidak relevan."]]},{"id":"L2","kind":"mcma","label":"Soal L2 · penalaran · pilihan majemuk","stem":"Sutradara ingin membuat reveal lokasi dengan drone di area sekolah. Pilih semua tindakan K3 yang tepat:","exam":true,"opts":[["Memilih area terbuka jauh dari orang dan kabel listrik.",1,"Area terbuka aman."],["Memeriksa baterai dan cuaca sebelum terbang.",1,"Baterai dan cuaca adalah faktor keselamatan utama."],["Melibatkan spotter selain operator.",1,"Spotter mengamati sekitar."],["Terbang di atas kerumunan agar shot lebih dramatis.",0,"Berbahaya bagi orang di bawah."],["Mengabaikan aturan karena lokasi di lingkungan sekolah.",0,"Aturan tetap berlaku."],["Tetap terbang saat angin kencang.",0,"Angin kencang membahayakan."]]},{"id":"L3","kind":"tf","label":"Soal L3 · penalaran · benar atau salah","stem":"Kamerawan merekam wawancara di ruang sempit dengan lensa tele 150 mm, kamera handheld, dan pan cepat. Tentukan benar atau salah untuk tiap pernyataan.","exam":true,"opts":[{"t":"Lensa tele dan jarak jauh memperbesar guncangan handheld.","c":true,"why":"Tele memperbesar guncangan."},{"t":"Pan cepat dapat menimbulkan rolling shutter.","c":true,"why":"Rolling shutter muncul pada pan cepat."},{"t":"Menaikkan ISO akan memperbaiki guncangan dan rolling shutter.","c":false,"why":"ISO tidak memengaruhi guncangan atau rolling shutter."}]}],"sectionsContent":{"b1":{"blocks":[{"type":"tebak","ids":["T1"]},{"type":"lead","text":"Kunci membedakan gerakan kamera: apakah kamera hanya berputar pada porosnya, atau berpindah tempat."},{"type":"table","head":["Gerakan","Cara melakukan","Fungsi atau kesan"],"rows":[["<b>Pan<\/b>","Kamera berputar horizontal (kiri atau kanan) pada porosnya.","Mengikuti subjek atau menghubungkan dua objek."],["<b>Tilt<\/b>","Kamera berputar vertikal (atas atau bawah) pada porosnya.","Menunjukkan ketinggian atau mengungkap (reveal) subjek."],["<b>Dolly in atau out<\/b>","Kamera maju atau mundur di atas alat beroda atau rel.","Mendekat atau menjauh dengan perspektif ruang berubah."],["<b>Truck (track)<\/b>","Kamera bergeser ke samping sejajar subjek.","Menyertai subjek secara lateral."],["<b>Pedestal<\/b>","Kamera naik atau turun tanpa mengubah sudut.","Mengubah ketinggian pandang."],["<b>Tracking atau follow<\/b>","Kamera bergerak mengikuti subjek dari belakang, depan, atau samping.","Menyertai gerak karakter; terasa dinamis."],["<b>Arc<\/b>","Kamera bergerak melingkar mengelilingi subjek.","Memberi dimensi dan kesan dramatis."],["<b>Crane atau jib<\/b>","Lengan menaikkan, menurunkan, atau mengayunkan kamera.","Reveal besar dan kesan skala."],["<b>Handheld<\/b>","Kamera dipegang tangan.","Spontan, dokumenter, atau tegang."],["<b>Drone (aerial)<\/b>","Kamera terbang pada wahana tak berawak.","Perspektif luas dan reveal lokasi."]]},{"type":"cek","ids":["C11","C12"]}]},"b2":{"blocks":[{"type":"tebak","ids":["T2"]},{"type":"lead","text":"Zoom bukan gerakan kamera, melainkan perubahan panjang fokus lensa. Dolly adalah perpindahan kamera."},{"type":"table","head":["Aspek","Zoom","Dolly"],"rows":[["<b>Apa yang bergerak<\/b>","Elemen lensa; kamera diam.","Kamera berpindah posisi."],["<b>Perspektif<\/b>","Tetap; seluruh gambar hanya diperbesar.","Berubah; benda dekat dan jauh bergeser berbeda."],["<b>Kesan<\/b>","Mengamati dari jauh; terasa mekanis.","Masuk ke dalam adegan; lebih imersif."],["<b>Penggunaan umum<\/b>","Berita langsung, dokumenter.","Film dan drama."]]},{"type":"callout","kind":"penting","tag":"Dolly zoom","html":"<p>Dolly zoom memadukan dolly dan zoom berlawanan arah (kamera maju sambil zoom out, atau sebaliknya) sehingga subjek tampak tetap, tetapi latar berubah. Efeknya dipakai untuk kesan cemas atau disorientasi.<\/p>"},{"type":"cek","ids":["C21","C22"]}]},"b3":{"blocks":[{"type":"tebak","ids":["T3"]},{"type":"lead","text":"Setiap gerakan kamera harus punya alasan. Tiga motivasi umum: mengikuti subjek, mengungkap informasi baru, dan membangun emosi atau ritme."},{"type":"callout","kind":"penting","tag":"Prinsip ritme","html":"<ul><li>Mulai dan akhiri dengan frame diam selama satu sampai dua detik; ini memudahkan penyuntingan.<\/li><li>Mulai dan berhenti perlahan (ease in dan ease out) agar gerak terasa halus, bukan kasar.<\/li><li>Kecepatan membawa kesan: lambat terasa tenang atau penuh antisipasi, cepat terasa tegang.<\/li><li>Cocokkan dengan blocking: koordinasikan gerak kamera dengan gerak pemeran.<\/li><\/ul>"},{"type":"callout","kind":"waspada","tag":"Whip pan","html":"<p>Pan sangat cepat (whip pan) dapat berfungsi sebagai transisi antar-shot. Namun di video, pan terlalu cepat dapat memicu rolling shutter.<\/p>"},{"type":"cek","ids":["C31","C32"]}]},"b4":{"blocks":[{"type":"tebak","ids":["T4"]},{"type":"lead","text":"Memilih alat adalah keputusan teknis yang diuji di soal. Tidak ada alat yang selalu paling baik; yang tepat adalah yang sesuai kebutuhan dan lokasi."},{"type":"table","head":["Alat","Kegunaan","Keterbatasan"],"rows":[["<b>Tripod fluid head<\/b>","Pan dan tilt yang halus dan terkontrol.","Tidak untuk berpindah posisi; perlu dilevel."],["<b>Monopod<\/b>","Stabil secara vertikal dan mudah dibawa.","Tidak sehalus tripod untuk pan; tetap perlu tangan stabil."],["<b>Mini tripod<\/b>","Low angle atau posisi dekat permukaan.","Terbatas ketinggian dan beban."],["<b>Gimbal (RS 3)<\/b>","Menstabilkan gerakan berjalan atau tracking.","Perlu diseimbangkan, baterai, dan teknik berjalan tetap penting."],["<b>Stabilisasi internal<\/b>","OIS pada lensa, IBIS pada sensor, EIS secara digital.","EIS biasanya memangkas bingkai; tidak menggantikan gimbal untuk gerak besar."],["<b>Drone<\/b>","Gerak aerial dengan gimbal bawaan.","Cuaca, aturan penerbangan, baterai, dan risiko."]]},{"type":"callout","kind":"penting","tag":"Di sekolah kita","html":"<p>Sony A6600 memiliki stabilisasi di dalam bodi (IBIS), sedangkan Canon 750D dan Nikon D5500 bergantung pada stabilisasi lensa (cek apakah lensa kit bertanda IS atau VR). Camcorder Panasonic HC-X2000 dan Canon Legria HF-G70 umumnya memiliki stabilisasi optik; cek di menu masing-masing. Gimbal RS 3 punya batas beban dan perlu diseimbangkan sebelum dinyalakan.<\/p>"},{"type":"cek","ids":["C41","C42"]}]},"b5":{"blocks":[{"type":"tebak","ids":["T5"]},{"type":"lead","text":"Tidak setiap lokasi memungkinkan penstabil, sehingga teknik tangan menjadi keterampilan dasar."},{"type":"callout","kind":"penting","tag":"Kunci teknik handheld","html":"<ul><li>Berdiri dengan kaki selebar bahu, siku merapat ke badan, dan gunakan strap atau layar sebagai titik tumpu tambahan.<\/li><li>Berjalan dengan lutut sedikit ditekuk, dari tumit ke ujung kaki, agar langkah tidak memantul.<\/li><li>Pakai lensa lebar dan dekatkan kamera ke subjek; lensa tele memperbesar guncangan.<\/li><li>Aktifkan stabilisasi kamera atau lensa, dan tetap pakai shutter sesuai aturan 180° dari Modul 1.<\/li><li>Hindari gerakan tiba-tiba; lakukan gerak yang lambat dan terukur.<\/li><\/ul>"},{"type":"cek","ids":["C51","C52"]}]},"b6":{"blocks":[{"type":"tebak","ids":["T6"]},{"type":"lead","text":"Latih membaca gejala, menebak penyebab, lalu memilih penanganan."},{"type":"table","head":["Gejala","Penyebab","Penanganan"],"rows":[["Gambar bergoyang liar","Tanpa penstabil atau memakai lensa tele","Pakai lensa lebar dan dekat, aktifkan stabilisasi, teknik jalan, atau gimbal."],["Gerak mulai atau berhenti kasar (jerky)","Drag fluid head terlalu lemah atau gerak mendadak","Atur drag dan counterbalance; latih start-stop halus."],["Horizon miring saat pan","Tripod tidak level","Ratakan kaki tripod dengan waterpass."],["Gambar tampak miring atau melengkung saat pan cepat (rolling shutter)","Sensor membaca gambar baris demi baris","Perlambat gerak dan gunakan stabilisasi."],["Fokus hilang saat dolly atau tracking","Jarak kamera ke subjek berubah","Pakai aperture lebih kecil, lensa lebar, atau libatkan pengatur fokus."],["Bayangan kru atau alat masuk bingkai","Posisi lampu dan lintasan gerak","Atur ulang blocking atau posisi lampu (Modul 2)."],["Gerak tidak terasa bertujuan","Tidak ada motivasi","Ganti dengan shot statis atau tentukan tujuan gerak."]]},{"type":"cek","ids":["C61","C62"]}]},"b7":{"blocks":[{"type":"tebak","ids":["T7"]},{"type":"lead","text":"Drone membuka gerakan aerial seperti reveal, orbit, dan fly-by. Keuntungannya perspektif luas, tetapi risikonya juga lebih besar."},{"type":"table","head":["Hal yang perlu diperhatikan","Penjelasan"],"rows":[["Area dan aturan","Terbang di area terbuka, jauh dari orang dan kabel listrik, dan patuhi aturan penerbangan serta zona larangan yang berlaku."],["Cuaca dan baterai","Periksa angin, hujan, dan baterai sebelum terbang; siapkan rencana pendaratan darurat."],["Pengawas (spotter)","Libatkan satu orang untuk mengamati sekitar selain operator."],["Eksposur","Drone di siang terik memerlukan ND; cek set ND yang tersedia (Modul 1)."]]},{"type":"callout","kind":"waspada","tag":"K3 gerakan kamera darat","html":"<ul><li>Kunci kaki tripod dan beri pemberat bila perlu.<\/li><li>Bersihkan jalur tracking dari kabel dan benda lain.<\/li><li>Sediakan spotter untuk operator yang berjalan mundur atau fokus pada layar.<\/li><li>Jangan menyilangkan kabel pada jalur gerak kamera.<\/li><\/ul>"},{"type":"html","html":"<h2>Alur keputusan gerakan kamera<\/h2>"},{"type":"steps","items":[{"title":"Tujuan","desc":"Apa yang perlu dirasakan atau diungkap oleh gerakan ini?"},{"title":"Jenis gerak","desc":"Rotasi (pan, tilt) atau perpindahan (dolly, truck, tracking)?"},{"title":"Alat","desc":"Tripod, monopod, gimbal, handheld, atau drone sesuai lokasi?"},{"title":"Lensa dan jarak","desc":"Lebar dan dekat untuk meredam guncangan, tele untuk kompresi."},{"title":"Ritme","desc":"Mulai dan akhiri dengan frame diam, gerak halus dan terukur."},{"title":"Cek anomali","desc":"Goyang, horizon, rolling shutter, fokus, bayangan."},{"title":"Keselamatan","desc":"Jalur bersih, alat terkunci, ada spotter, dan aturan terpenuhi."}]},{"type":"cek","ids":["C71","C72"]}]},"latihan":{"blocks":[{"type":"callout","kind":"penting","tag":"Strategi menjawab","html":"<p>Soal penalaran menilai alasan di balik pilihanmu.<\/p>"},{"type":"qlist","ids":["S1","S2","S3","S4"]}]},"cek":{"blocks":[{"type":"callout","kind":"penting","tag":"Cara mengerjakan","html":"Pembahasan terbuka setelah ketiga soal dikunci."},{"type":"qlist","ids":["L1","L2","L3"]}]},"praktik":{"blocks":[{"type":"panel","html":"<b>Gear:<\/b> tripod fluid head Takara, monopod, mini tripod, gimbal DJI RS 3, Sony A6600, Canon 750D, DJI Air 2S, DJI Mini 2, TV 32\"."},{"type":"callout","kind":"waspada","tag":"Keselamatan","html":"<ul><li>Praktik 2 dan 3 dipandu fasilitator.<\/li><li>Jalur berjalan bersih dari kabel dan benda lain.<\/li><li>Operator didampingi spotter.<\/li><li>Drone hanya diterbangkan oleh operator terlatih di area terbuka.<\/li><\/ul>"},{"type":"html","html":"<h2>Praktik 1 · Pan dan tilt halus dengan fluid head <span class=\"small\">(15 menit)<\/span><\/h2><p>Ratakan tripod; atur drag dan counterbalance. Pan mengikuti model berjalan 5 meter. Tilt dari kaki ke kepala (reveal). Ulangi dengan gerak mendadak, lalu dengan start-stop halus. Lakukan satu pan cepat dan amati rolling shutter.<\/p>"},{"type":"checklist","items":[{"id":"pa1","text":"Tripod diratakan"},{"id":"pa2","text":"Drag dan counterbalance diatur"},{"id":"pa3","text":"Pan mengikuti model"},{"id":"pa4","text":"Membandingkan gerak halus dan kasar"}]},{"type":"html","html":"<textarea data-note=\"pa_r\" placeholder=\"Apa yang membuat gerak terasa halus? Mengapa horizon miring saat tripod tidak level?\"><\/textarea>"},{"type":"html","html":"<h2>Praktik 2 · Handheld, stabilisasi, dan gimbal <span class=\"small\">(15 menit)<\/span><\/h2><p>Rekam model berjalan dengan handheld, stabilisasi mati. Ulangi dengan stabilisasi menyala. Ulangi dengan teknik berjalan. Pasang di RS 3, seimbangkan, rekam tracking. Bandingkan lensa lebar dan tele.<\/p>"},{"type":"checklist","items":[{"id":"pb1","text":"Handheld tanpa stabilisasi"},{"id":"pb2","text":"Handheld dengan stabilisasi"},{"id":"pb3","text":"Handheld dengan teknik berjalan"},{"id":"pb4","text":"Gimbal RS 3 diseimbangkan dan dipakai"}]},{"type":"html","html":"<textarea data-note=\"pb_r\" placeholder=\"Kondisi apa yang membuat gimbal tidak praktis? Mengapa lensa lebar lebih toleran?\"><\/textarea>"},{"type":"html","html":"<h2>Praktik 3 · Demonstrasi drone <span class=\"small\">(10 menit)<\/span><\/h2><p>Operator terlatih menjelaskan pemeriksaan sebelum terbang. Demonstrasikan reveal dan orbit; siswa mengamati dari area aman.<\/p>"},{"type":"checklist","items":[{"id":"pc1","text":"Pemeriksaan sebelum terbang dijelaskan"},{"id":"pc2","text":"Reveal didemonstrasikan"},{"id":"pc3","text":"Siswa mengidentifikasi jenis gerak dan fungsi"}]},{"type":"html","html":"<textarea data-note=\"pc_r\" placeholder=\"Apa untung dan rugi drone dibanding gimbal? Kapan ND dipakai?\"><\/textarea>"},{"type":"html","html":"<h2>Praktik 4 · Shot list dan notasi gerak <span class=\"small\">(10 menit)<\/span><\/h2><p>Pilih adegan singkat. Buat lima shot dengan shot size, angle, gerakan, dan alat. Tulis alasan tiap gerakan dalam satu kalimat.<\/p>"},{"type":"checklist","items":[{"id":"pd1","text":"Lima shot dengan shot size dan angle"},{"id":"pd2","text":"Gerakan dan alat dicatat"},{"id":"pd3","text":"Alasan tiap gerakan ditulis"}]},{"type":"html","html":"<textarea data-note=\"pd_r\" placeholder=\"Gerakan mana yang bisa diganti shot statis tanpa mengurangi makna?\"><\/textarea>"}]},"kartu":{"blocks":[{"type":"html","html":"<p class=\"lead\">Gejala, penyebab, dan penanganan yang tidak merusak tujuan estetika. Kartu ini dipakai lagi di Modul 6.<\/p>"},{"type":"cards","items":[{"title":"Gambar bergoyang liar","penyebab":"Tanpa penstabil atau lensa tele","solusi":"Lensa lebar dan dekat, stabilisasi, teknik jalan, atau gimbal"},{"title":"Gerak kasar (jerky)","penyebab":"Drag fluid head terlalu lemah atau gerak mendadak","solusi":"Atur drag dan counterbalance; latih start-stop halus"},{"title":"Horizon miring saat pan","penyebab":"Tripod tidak level","solusi":"Ratakan kaki tripod dengan waterpass"},{"title":"Rolling shutter saat pan cepat","penyebab":"Sensor membaca baris demi baris","solusi":"Perlambat gerak dan gunakan stabilisasi"},{"title":"Fokus hilang saat dolly","penyebab":"Jarak kamera ke subjek berubah","solusi":"Aperture lebih kecil, lensa lebar, atau pengatur fokus"},{"title":"Gerak tidak bertujuan","penyebab":"Tidak ada motivasi","solusi":"Ganti dengan shot statis atau tentukan tujuan"}]},{"type":"html","html":"<h2>Alur 7 langkah gerakan<\/h2>"},{"type":"steps","items":[{"title":"Tujuan"},{"title":"Jenis gerak"},{"title":"Alat"},{"title":"Lensa dan jarak"},{"title":"Ritme"},{"title":"Cek anomali"},{"title":"Keselamatan"}]},{"type":"two","items":[{"cls":"g","html":"<b>Rotasi<\/b><br>Pan · Tilt"},{"cls":"g","html":"<b>Perpindahan<\/b><br>Dolly · Truck · Pedestal · Tracking · Arc · Crane"}]}]}}},{"meta":{"id":5,"storageKey":"fke-modul5-mandiri-v1","topKick":"Modul 5","kicker":"Modul 5 · Persiapan TKA 2026 · Belajar mandiri","title":"Kontinuitas, Coverage, dan Dokumen Produksi","intro":"Cara agar kumpulan gambar bisa disusun menjadi cerita yang rapi: shot yang cocok satu sama lain, cukup jumlahnya untuk disunting, dan direncanakan lewat dokumen produksi.","chips":[{"label":"Memahami","color":"#ffb454"},{"label":"Menerapkan","color":"#7cc0ff"},{"label":"Menalar","color":"#7fe0a8"}],"howto":["<b>1. Tebak dulu, baru baca.<\/b> Tiap bagian dibuka dengan kotak <span class=\"small\">Tebak dulu<\/span>.","<b>2. Cek paham.<\/b> Setelah penjelasan, jawab kotak <span class=\"small\">Cek paham<\/span>.","<b>3. Praktik.<\/b> Empat praktik dengan gear sekolah ada di bagian akhir."],"objectives":["<b>Memahami:<\/b> menjelaskan arti kontinuitas, axis of action, dan aturan 30°; menyebutkan jenis transisi dan dokumen produksi.","<b>Menerapkan:<\/b> merencanakan coverage satu adegan dialog dan merekam dengan clapper board.","<b>Menalar:<\/b> menganalisis kesalahan kontinuitas dan memilih perbaikan yang tepat."]},"sections":[{"id":"mulai","nav":"Mulai","title":"Kontinuitas, Coverage, dan Dokumen Produksi"},{"id":"b1","nav":"Bagian 1","title":"Kontinuitas","time":"15 menit"},{"id":"b2","nav":"Bagian 2","title":"Axis of action dan aturan 180°","time":"20 menit"},{"id":"b3","nav":"Bagian 3","title":"Aturan 30° dan jump cut","time":"15 menit"},{"id":"b4","nav":"Bagian 4","title":"Coverage","time":"20 menit"},{"id":"b5","nav":"Bagian 5","title":"Transisi dan penyambungan","time":"15 menit"},{"id":"b6","nav":"Bagian 6","title":"Dokumen produksi dan pembagian tugas","time":"20 menit"},{"id":"b7","nav":"Bagian 7","title":"Hubungan dengan Modul 1–4","time":"10 menit"},{"id":"latihan","nav":"Latihan","title":"Latihan soal bergaya TKA","time":"25 menit"},{"id":"cek","nav":"Cek akhir","title":"Uji dirimu sendiri","time":"10 menit"},{"id":"praktik","nav":"Praktik","title":"Praktik dengan gear sekolah","time":"50 menit"},{"id":"kartu","nav":"Kartu","title":"Kartu diagnosis kontinuitas"}],"sectionQuestions":{"b1":["T1","C11","C12"],"b2":["T2","C21","C22","C23"],"b3":["T3","C31","C32"],"b4":["T4","C41","C42"],"b5":["T5","C51","C52"],"b6":["T6","C61","C62"],"b7":["T7","C71"],"latihan":["S1","S2","S3","S4"],"cek":["L1","L2","L3"]},"praktikChecks":["pa1","pa2","pa3","pa4","pb1","pb2","pb3","pb4","pc1","pc2","pc3","pd1","pd2","pd3"],"labs":{},"questions":[{"id":"T1","kind":"pick","label":"T1","stem":"Kontinuitas adalah konsistensi visual dan naratif antar-shot. Benar atau salah?","bare":true,"opts":[["Benar",1],["Salah"]],"explain":"Kontinuitas menjaga agar penonton merasakan adegan sebagai satu kejadian utuh."},{"id":"T2","kind":"pick","label":"T2","stem":"Kamera boleh menyeberang garis aksi tanpa persiapan. Benar atau salah?","bare":true,"opts":[["Benar"],["Salah",1]],"explain":"Menyeberang tanpa persiapan membuat arah hadap tampak terbalik. Perlu neutral shot atau cutaway."},{"id":"T3","kind":"pick","label":"T3","stem":"Jump cut terjadi ketika dua shot berurutan dari subjek yang sama terlalu mirip. Benar atau salah?","bare":true,"opts":[["Benar",1],["Salah"]],"explain":"Perlu mengubah ukuran atau sudut minimal 30° untuk menghindari jump cut."},{"id":"T4","kind":"pick","label":"T4","stem":"Coverage berarti merekam sebanyak mungkin tanpa rencana. Benar atau salah?","bare":true,"opts":[["Benar"],["Salah",1]],"explain":"Coverage direncanakan lewat shot list agar efisien."},{"id":"T5","kind":"pick","label":"T5","stem":"Dissolve aman dipakai di antara adegan apa pun tanpa mengubah makna. Benar atau salah?","bare":true,"opts":[["Benar"],["Salah",1]],"explain":"Dissolve menandakan perpindahan waktu atau tempat."},{"id":"T6","kind":"pick","label":"T6","stem":"Storyboard adalah naskah dialog tanpa gambar. Benar atau salah?","bare":true,"opts":[["Benar"],["Salah",1]],"explain":"Storyboard berupa gambar sketsa tiap shot; script berupa teks dialog dan aksi."},{"id":"T7","kind":"pick","label":"T7","stem":"Pilihan kamera di lokasi memengaruhi mudah tidaknya penyuntingan. Benar atau salah?","bare":true,"opts":[["Benar",1],["Salah"]],"explain":"Shot size yang bervariasi, sudut yang berbeda, dan pengaturan yang sama antar-shot memudahkan penyuntingan."},{"id":"C11","kind":"pick","label":"1.1","stem":"Konsistensi arah hadap antar-shot termasuk kontinuitas...","bare":true,"opts":[["Posisi dan arah",1],["Waktu"],["Suara"]],"explain":"Arah hadap harus konsisten antarshot."},{"id":"C12","kind":"pick","label":"1.2","stem":"Jam atau cahaya matahari yang berubah antar-shot melanggar kontinuitas...","bare":true,"opts":[["Waktu",1],["Properti"],["Suara"]],"explain":"Waktu mencakup jam, cahaya matahari, dan cuaca."},{"id":"C21","kind":"pick","label":"2.1","stem":"Axis of action adalah...","bare":true,"opts":[["Garis imajiner antara dua tokoh atau arah gerak subjek",1],["Garis horizon"],["Garis sepertiga"]],"explain":"Axis of action adalah garis imajiner antara dua tokoh atau arah gerak."},{"id":"C22","kind":"pick","label":"2.2","stem":"Aturan 180° menyatakan bahwa kamera sebaiknya...","bare":true,"opts":[["Berpindah-pindah sisi"],["Tetap di satu sisi garis aksi",1],["Selalu di belakang subjek"]],"explain":"Aturan 180°: kamera tetap di satu sisi garis aksi."},{"id":"C23","kind":"pick","label":"2.3","stem":"Untuk menyeberang garis aksi dengan benar, bisa memakai...","bare":true,"opts":[["Neutral shot atau cutaway",1],["Zoom cepat"],["White balance berbeda"]],"explain":"Neutral shot atau cutaway sebagai jembatan saat menyeberang garis."},{"id":"C31","kind":"pick","label":"3.1","stem":"Aturan 30° menyatakan bahwa dua shot berurutan sebaiknya...","bare":true,"opts":[["Sama persis"],["Berbeda sudut minimal sekitar 30° atau ukuran",1],["Berbeda warna"]],"explain":"Agar tidak jump cut, ubah sudut minimal 30° atau ukuran shot."},{"id":"C32","kind":"pick","label":"3.2","stem":"Jump cut bisa dipakai dengan sengaja sebagai...","bare":true,"opts":[["Kesalahan"],["Gaya (vlog, video musik)",1],["Aturan wajib"]],"explain":"Jump cut bisa disengaja sebagai gaya."},{"id":"C41","kind":"pick","label":"4.1","stem":"Fungsi master shot adalah...","bare":true,"opts":[["Dasar kontinuitas; direkam lengkap",1],["Menutup lompatan"],["Memberi informasi cerita"]],"explain":"Master shot mencakup seluruh adegan dan menjadi dasar kontinuitas."},{"id":"C42","kind":"pick","label":"4.2","stem":"Room tone direkam untuk...","bare":true,"opts":[["Menambah audio suasana ruangan",1],["Menambah cahaya"],["Menambah warna"]],"explain":"Room tone adalah suasana ruangan tanpa dialog, untuk menambah audio."},{"id":"C51","kind":"pick","label":"5.1","stem":"J-cut berarti...","bare":true,"opts":[["Audio shot berikutnya mulai sebelum gambarnya",1],["Audio berlanjut ke gambar berikutnya"],["Gambar berubah warna"]],"explain":"J-cut: audio mendahului gambar."},{"id":"C52","kind":"pick","label":"5.2","stem":"Match cut menyambung dua shot lewat...","bare":true,"opts":[["Kemiripan bentuk atau gerak",1],["Warna"],["Audio"]],"explain":"Match cut menghubungkan ide atau waktu lewat kemiripan bentuk atau gerak."},{"id":"C61","kind":"pick","label":"6.1","stem":"Call sheet memuat...","bare":true,"opts":[["Jadwal, lokasi, daftar kru dan pemeran",1],["Dialog lengkap"],["Sketsa shot"]],"explain":"Call sheet adalah dokumen operasional harian."},{"id":"C62","kind":"pick","label":"6.2","stem":"Script supervisor bertugas...","bare":true,"opts":[["Menjaga kontinuitas dan mencatat setiap take",1],["Menyutradarai"],["Menyunting"]],"explain":"Script supervisor menjaga kontinuitas dan mencatat take."},{"id":"C71","kind":"pick","label":"7.1","stem":"Frame rate dan shutter yang sama antar-shot menjaga...","bare":true,"opts":[["Kesan gerak",1],["Warna"],["Fokus"]],"explain":"Frame rate dan shutter yang sama menjaga kesan gerak konsisten."},{"id":"S1","kind":"pick","label":"Soal 1 · pengetahuan · pilihan ganda","stem":"Garis imajiner yang menghubungkan dua tokoh yang berdialog dan membatasi sisi penempatan kamera disebut...","instant":false,"opts":[["Garis horizon",0,"Garis horizon adalah garis pemisah langit dan tanah."],["Axis of action",1,"Axis of action adalah garis imajiner antara dua tokoh atau arah gerak."],["Garis sepertiga",0,"Garis sepertiga adalah panduan komposisi."],["Eyeline match",0,"Eyeline match adalah teknik penyuntingan, bukan garis."],["Garis headroom",0,"Headroom adalah ruang di atas kepala."]]},{"id":"S2","kind":"pick","label":"Soal 2 · aplikasi · pilihan ganda","stem":"Adegan dialog: tokoh A di sisi kiri bingkai menghadap kanan pada shot pertama. Pada shot berikutnya, A tampak di sisi kanan dan menghadap kiri. Penyebab dan perbaikan paling tepat adalah...","instant":false,"opts":[["White balance berbeda; samakan white balance",0,"Bukan masalah warna."],["Kamera menyeberangi axis of action; kembalikan kamera ke sisi semula atau sisipkan neutral shot",1,"Arah hadap yang terbalik menunjukkan kamera menyeberangi garis aksi."],["Shutter terlalu lambat; percepat shutter",0,"Bukan masalah shutter."],["Lensa terlalu lebar; ganti ke tele",0,"Bukan masalah lensa."],["Cahaya terlalu terang; kurangi ISO",0,"Bukan masalah eksposur."]]},{"id":"S3","kind":"mcma","label":"Soal 3 · penalaran · pilihan majemuk","stem":"Dua shot berurutan memperlihatkan tokoh dari sudut hampir sama dan ukuran sama, tetapi hasilnya tampak melompat pada penyuntingan. Tindakan apa saja yang tepat?","opts":[["Mengganti salah satu shot menjadi close-up.",1,"Mengubah ukuran shot."],["Menggeser kamera sekitar 30° atau lebih untuk shot berikutnya.",1,"Mengubah sudut."],["Menyisipkan cutaway atau insert di antara dua shot.",1,"Memutus perhatian dari loncatan."],["Memakai dissolve panjang agar loncatan tidak terlihat, walaupun maknanya berubah menjadi perpindahan waktu.",0,"Mengubah makna adegan."],["Memutar kamera 180° melintasi garis aksi.",0,"Menimbulkan kesalahan axis."],["Mengabaikan karena penonton tidak akan peduli.",0,"Membiarkan kesalahan."]]},{"id":"S4","kind":"tf","label":"Soal 4 · penalaran · benar atau salah","stem":"Tentang dokumen produksi. Tentukan benar atau salah untuk tiap pernyataan.","opts":[{"t":"Call sheet memuat jadwal, lokasi, daftar kru dan pemeran untuk hari syuting.","c":true,"why":"Call sheet adalah dokumen operasional harian."},{"t":"Storyboard adalah naskah dialog lengkap tanpa gambar.","c":false,"why":"Storyboard berisi sketsa visual tiap shot."},{"t":"Log kontinuitas mencatat detail seperti properti dan posisi pemeran pada tiap take.","c":true,"why":"Log kontinuitas membantu menjaga konsistensi antar-take."}]},{"id":"L1","kind":"pick","label":"Soal L1 · penalaran · pilihan ganda","stem":"Adegan dialog tiga tokoh di meja makan. Setelah master shot, kamu merekam over the shoulder untuk tiap tokoh. Pada shot ketiga, salah satu tokoh tampak bertukar tempat dengan tokoh lain. Penyebab dan perbaikan paling tepat adalah...","instant":false,"exam":true,"opts":[["White balance berbeda; samakan",0,"Bukan masalah warna."],["Kamera menyeberang axis of action; kembalikan ke sisi semula atau sisipkan neutral shot",1,"Arah hadap terbalik karena kamera menyeberang garis aksi."],["Shutter terlalu cepat; perlambat",0,"Bukan masalah shutter."],["Lensa terlalu lebar; ganti tele",0,"Bukan masalah lensa."],["ISO terlalu tinggi; turunkan",0,"Bukan masalah ISO."]]},{"id":"L2","kind":"mcma","label":"Soal L2 · penalaran · pilihan majemuk","stem":"Tim menyiapkan adegan dialog dua tokoh dengan dua kamera. Coverage yang mendukung penyuntingan meliputi...","exam":true,"opts":[["Master shot yang mencakup seluruh adegan.",1,"Dasar kontinuitas."],["Over the shoulder untuk masing-masing tokoh.",1,"Hubungan dua tokoh."],["Insert dan cutaway.",1,"Bahan penyuntingan."],["Hanya satu close-up panjang tanpa master shot.",0,"Tidak ada dasar kontinuitas."],["Mengganti kostum tokoh antar-take.",0,"Merusak kontinuitas."],["Memindahkan kamera menyeberangi garis aksi pada tiap shot tanpa alasan.",0,"Merusak arah hadap."]]},{"id":"L3","kind":"tf","label":"Soal L3 · penalaran · benar atau salah","stem":"Tim merekam adegan aksi. Tentukan benar atau salah untuk tiap pernyataan.","exam":true,"opts":[{"t":"Cut on action (memotong di tengah gerakan) menyembunyikan sambungan.","c":true,"why":"Memotong di tengah gerakan membuat sambungan terasa mulus."},{"t":"Aturan 30° hanya berlaku untuk dialog, bukan untuk aksi.","c":false,"why":"Aturan 30° berlaku untuk semua shot berurutan dari subjek yang sama."},{"t":"Memvariasikan shot size antara dua shot berurutan dapat mencegah jump cut.","c":true,"why":"Ukuran yang berbeda jelas mencegah kesan loncatan."}]}],"sectionsContent":{"b1":{"blocks":[{"type":"tebak","ids":["T1"]},{"type":"lead","text":"Konsistensi visual dan naratif antar-shot, sehingga penonton merasakan adegan sebagai satu kejadian yang utuh, walaupun direkam terpotong-potong dan tidak berurutan."},{"type":"table","head":["Jenis kontinuitas","Contoh yang harus konsisten","Contoh kesalahan"],"rows":[["<b>Posisi dan arah<\/b>","Arah hadap, letak tokoh, arah gerak di layar.","Tokoh menghadap kanan di satu shot dan kiri di shot berikutnya."],["<b>Aksi<\/b>","Gerakan yang berlanjut antar-shot.","Tangan sudah memegang gelas di shot 1, kosong di shot 2."],["<b>Properti dan kostum<\/b>","Isi gelas, posisi buku, kancing baju.","Isi gelas berubah antar-shot."],["<b>Waktu<\/b>","Jam, cahaya matahari, cuaca.","Matahari terik lalu mendadak mendung di dalam satu adegan."],["<b>Cahaya dan warna<\/b>","Arah, intensitas, dan suhu warna (Modul 1 dan 2).","Bayangan wajah pindah sisi antar-shot."],["<b>Suara<\/b>","Ambience dan level suara latar.","Suara ruangan hilang ketika berpindah shot."]]},{"type":"callout","kind":"penting","tag":"Penyebab paling umum","html":"<p>Hampir semua kesalahan kontinuitas muncul karena shot direkam di waktu atau posisi yang berbeda. Karena itu, pencatatan take (clapper dan log) dan pengulangan aksi di tiap shot sangat penting.<\/p>"},{"type":"cek","ids":["C11","C12"]}]},"b2":{"blocks":[{"type":"tebak","ids":["T2"]},{"type":"lead","text":"Axis of action adalah garis imajiner yang menghubungkan dua tokoh yang berinteraksi, atau mengikuti arah gerak subjek. Aturan 180° menyatakan bahwa kamera sebaiknya tetap berada di satu sisi garis tersebut."},{"type":"table","head":["Situasi","Akibat"],"rows":[["<b>Kamera tetap di satu sisi garis<\/b>","Tokoh A selalu menghadap ke kanan dan tokoh B ke kiri; ruang terasa konsisten."],["<b>Kamera menyeberang garis tanpa persiapan<\/b>","Arah hadap tampak terbalik, tokoh seolah bertukar tempat atau tidak lagi berhadapan."],["<b>Gerak subjek ke kanan lalu kamera menyeberang<\/b>","Subjek tampak berbalik arah, penonton mengira ia kembali."]]},{"type":"callout","kind":"penting","tag":"Cara menyeberang garis dengan benar","html":"<ul><li>Sisipkan <b>neutral shot<\/b> (tepat di garis atau menghadap sumbu) sebagai jembatan.<\/li><li>Gerakkan kamera menyeberang garis di dalam satu shot yang terlihat oleh penonton.<\/li><li>Gunakan <b>cutaway<\/b> atau <b>insert<\/b> sebelum pindah sisi.<\/li><li>Atau buat tokoh yang bergerak sehingga garisnya sendiri berpindah.<\/li><\/ul>"},{"type":"html","html":"<p>Shot-reverse-shot (bergantian antara dua tokoh, biasanya over the shoulder) adalah penerapan paling umum dari aturan ini. Karena kedua kamera berada di sisi yang sama dari garis, tokoh A tampak selalu di sisi kiri, dan tokoh B selalu di sisi kanan.<\/p>"},{"type":"cek","ids":["C21","C22","C23"]}]},"b3":{"blocks":[{"type":"tebak","ids":["T3"]},{"type":"lead","text":"Jika dua shot berurutan memperlihatkan subjek yang sama, kamera sebaiknya berpindah minimal sekitar 30° atau ukuran shot berubah cukup jelas."},{"type":"table","head":["Cara memperbaiki jump cut","Penjelasan"],"rows":[["Ubah ukuran shot","Misalnya dari medium shot ke close-up."],["Geser kamera sekitar 30° atau lebih","Sudut pandang berbeda cukup jelas."],["Sisipkan cutaway atau insert","Memutus perhatian dari loncatan."],["Gunakan cut on action","Pemotongan di tengah gerakan menyembunyikan sambungan."]]},{"type":"callout","kind":"penting","tag":"Jump cut tidak selalu salah","html":"<p>Jump cut bisa dipakai dengan sengaja sebagai gaya, misalnya pada vlog, video musik, atau untuk menunjukkan lompatan waktu. Dalam soal TKA, biasanya yang dipertanyakan adalah jump cut yang tidak disengaja.<\/p>"},{"type":"cek","ids":["C31","C32"]}]},"b4":{"blocks":[{"type":"tebak","ids":["T4"]},{"type":"lead","text":"Rekaman satu adegan dari beberapa ukuran dan sudut, sehingga editor punya cukup bahan. Prinsipnya: <b>rekam untuk penyuntingan.<\/b>"},{"type":"table","head":["Shot","Fungsi","Catatan"],"rows":[["<b>Master shot<\/b>","Seluruh adegan dalam satu bingkai lebar.","Dasar kontinuitas; direkam lengkap."],["<b>Medium shot<\/b>","Dialog dan aksi dengan detail.","Satu per tokoh."],["<b>Close-up<\/b>","Emosi dan reaksi.","Satu per tokoh."],["<b>Over the shoulder<\/b>","Hubungan dua tokoh.","Sesuai axis of action."],["<b>Cutaway<\/b>","Gambar di luar aksi utama.","Menutup lompatan atau memberi jeda."],["<b>Insert<\/b>","Detail benda (surat, jam, layar).","Memberi informasi cerita."],["<b>Reaction shot<\/b>","Reaksi tokoh yang mendengarkan.","Menyambung emosi."]]},{"type":"callout","kind":"penting","tag":"Kebiasaan di lokasi","html":"<ul><li>Ulang aksi yang sama di tiap shot (gerak, posisi properti, kalimat) agar sambungan mulus.<\/li><li>Beri jeda pada awal dan akhir setiap rekaman (head dan tail) sebelum dan sesudah aksi.<\/li><li>Rekam <b>room tone<\/b> (suasana ruangan tanpa dialog) untuk menambah audio.<\/li><li>Catat setiap take pada clapper board: adegan, shot, dan pengambilan.<\/li><\/ul>"},{"type":"callout","kind":"penting","tag":"Di sekolah kita","html":"<p>Dua clapper board tersedia untuk menandai adegan, shot, dan take serta membantu sinkronisasi gambar dan suara dengan Zoom H6. Dua kamera dengan tipe sama (dua Sony A6600 atau dua Canon 750D) cocok untuk coverage dua sudut sekaligus; <b>samakan frame rate, shutter, white balance, dan profil gambarnya<\/b> supaya warna dan gerak tidak berbeda.<\/p>"},{"type":"cek","ids":["C41","C42"]}]},"b5":{"blocks":[{"type":"tebak","ids":["T5"]},{"type":"lead","text":"Istilah transisi termasuk bahan soal Editing. Siswa perlu paham fungsi tiap transisi, bukan sekadar nama."},{"type":"table","head":["Transisi","Arti","Fungsi umum"],"rows":[["<b>Cut<\/b>","Pergantian langsung antar-shot.","Standar; kontinu dan natural."],["<b>Dissolve<\/b>","Satu gambar memudar menjadi gambar berikutnya.","Perpindahan waktu atau tempat yang halus."],["<b>Fade in/out<\/b>","Dari atau menuju layar hitam.","Awal dan akhir adegan atau program."],["<b>Wipe<\/b>","Gambar baru menyapu gambar lama.","Gaya; sering di berita atau olahraga."],["<b>Match cut<\/b>","Dua shot disambung lewat kemiripan bentuk atau gerak.","Menghubungkan ide atau waktu."],["<b>J-cut<\/b>","Audio shot berikutnya mulai sebelum gambarnya.","Sambungan dialog yang mulus."],["<b>L-cut<\/b>","Audio shot sebelumnya berlanjut ke gambar berikutnya.","Menjaga alur suara."]]},{"type":"callout","kind":"penting","tag":"Catatan","html":"<p>Cut adalah transisi standar. Dissolve, fade, dan wipe punya makna naratif spesifik. Jangan gunakan dissolve untuk semua sambungan; itu mengubah makna adegan menjadi perpindahan waktu atau tempat.<\/p>"},{"type":"cek","ids":["C51","C52"]}]},"b6":{"blocks":[{"type":"tebak","ids":["T6"]},{"type":"lead","text":"Dokumen membantu tim bekerja dengan SOP yang sama dan mengurangi kesalahan di lokasi."},{"type":"table","head":["Dokumen","Isi","Dipakai oleh"],"rows":[["<b>Script (naskah)<\/b>","Dialog dan aksi per adegan (scene heading, deskripsi, dialog).","Seluruh tim."],["<b>Storyboard<\/b>","Gambar sketsa tiap shot beserta keterangan angle dan gerakan.","Sutradara dan kamerawan."],["<b>Shot list<\/b>","Daftar shot yang akan direkam: ukuran, angle, gerakan, lensa.","Kamerawan dan asisten."],["<b>Call sheet<\/b>","Jadwal, lokasi, daftar kru dan pemeran, kebutuhan alat untuk hari suting.","Seluruh kru dan pemeran."],["<b>Log kontinuitas<\/b>","Catatan detail setiap take: properti, posisi, kostum, arah hadap.","Script supervisor dan editor."]]},{"type":"table","head":["Peran","Tugas utama"],"rows":[["<b>Sutradara<\/b>","Memimpin pembuatan karya dan memutuskan hasil kreatif."],["<b>Kamerawan (DOP)<\/b>","Menentukan shot, angle, gerak, dan cahaya bersama sutradara."],["<b>Asisten kamera<\/b>","Menyiapkan alat, fokus, dan baterai."],["<b>Script supervisor<\/b>","Menjaga kontinuitas dan mencatat setiap take."],["<b>Kru lampu<\/b>","Memasang dan mengatur cahaya sesuai arahan."],["<b>Editor<\/b>","Menyusun gambar dan suara menjadi urutan akhir."]]},{"type":"cek","ids":["C61","C62"]}]},"b7":{"blocks":[{"type":"tebak","ids":["T7"]},{"type":"lead","text":"Kontinuitas bukan hanya urusan editor. Pilihan kamera di lokasi menentukan mudah tidaknya penyuntingan."},{"type":"callout","kind":"penting","tag":"Kaitan antar modul","html":"<ul><li>Shot size yang bervariasi dan sudut yang cukup berbeda mencegah jump cut (Modul 3).<\/li><li>White balance, eksposur, dan arah cahaya yang tetap menjaga warna antar-shot (Modul 1 dan 2).<\/li><li>Frame rate dan shutter yang sama menjaga kesan gerak (Modul 1 dan 4).<\/li><li>Kamera yang tetap di sisi garis aksi menjaga arah hadap (Modul 5).<\/li><\/ul>"},{"type":"html","html":"<h2>Alur keputusan kontinuitas dan coverage<\/h2>"},{"type":"steps","items":[{"title":"Pahami adegan","desc":"Siapa berinteraksi dan ke arah mana mereka menghadap atau bergerak."},{"title":"Tentukan axis of action","desc":"Pilih satu sisi untuk kamera."},{"title":"Rencanakan coverage","desc":"Master, medium, close-up, cutaway, insert."},{"title":"Atur shot berbeda cukup jauh","desc":"Ukuran atau sudut lebih dari 30°."},{"title":"Samakan pengaturan kamera dan cahaya","desc":"Frame rate, shutter, WB, profil gambar."},{"title":"Catat setiap take","desc":"Clapper dan log; rekam head, tail, dan room tone."},{"title":"Cek di monitor","desc":"Arah hadap, properti, dan sambungan sebelum pindah lokasi."}]},{"type":"cek","ids":["C71"]}]},"latihan":{"blocks":[{"type":"callout","kind":"penting","tag":"Strategi menjawab","html":"<p>Soal penalaran menilai alasan di balik pilihanmu.<\/p>"},{"type":"qlist","ids":["S1","S2","S3","S4"]}]},"cek":{"blocks":[{"type":"callout","kind":"penting","tag":"Cara mengerjakan","html":"<p>Pembahasan terbuka setelah ketiga soal dikunci.<\/p>"},{"type":"qlist","ids":["L1","L2","L3"]}]},"praktik":{"blocks":[{"type":"panel","html":"<b>Gear:<\/b> Sony A6600, Canon 750D, clapper board, tripod Takara, Zoom H6, headphone, lakban hitam, Feelworld 7\", TV 32\", NAS 8 TB."},{"type":"callout","kind":"penting","tag":"Pembagian peran","html":"<p>Siswa bekerja dalam kelompok berempat: dua kamerawan, dua pemeran. Satu orang lain bertugas mencatat sebagai script supervisor.<\/p>"},{"type":"callout","kind":"waspada","tag":"Catatan","html":"<p>Jika komputer dan perangkat lunak penyuntingan belum tersedia, Praktik 4 dilakukan dengan memutar klip berurutan di TV 32\" dan menandai kesalahan pada lembar catatan.<\/p>"},{"type":"html","html":"<h2>Praktik 1 · Axis of action <span class=\"small\">(15 menit)<\/span><\/h2><p>Tempelkan lakban hitam di lantai sebagai garis antara dua pemeran yang berdialog (axis). Rekam shot-reverse-shot dengan kamera tetap di satu sisi garis. Ulangi dengan kamera kedua berada di sisi seberang garis. Putar kedua versi dan bandingkan arah hadap.<\/p>"},{"type":"checklist","items":[{"id":"pa1","text":"Garis aksi ditandai lakban"},{"id":"pa2","text":"Shot-reverse-shot dengan kamera satu sisi"},{"id":"pa3","text":"Merekam dari sisi seberang"},{"id":"pa4","text":"Membandingkan arah hadap dua versi"}]},{"type":"html","html":"<textarea data-note=\"pa_r\" placeholder=\"Kapan menyeberang garis boleh dilakukan, dan dengan cara apa?\"><\/textarea>"},{"type":"html","html":"<h2>Praktik 2 · Coverage dengan clapper board <span class=\"small\">(15 menit)<\/span><\/h2><p>Samakan frame rate, shutter, white balance, dan profil gambar pada kedua kamera. Rekam adegan dialog 30 detik dengan master shot, over the shoulder untuk tiap tokoh, close-up, dan satu insert. Gunakan clapper board dengan nomor adegan, shot, dan take. Beri jeda awal dan akhir, rekam room tone 10 detik.<\/p>"},{"type":"checklist","items":[{"id":"pb1","text":"Pengaturan dua kamera disamakan"},{"id":"pb2","text":"Master dan OTS direkam"},{"id":"pb3","text":"Close-up dan insert direkam"},{"id":"pb4","text":"Room tone direkam"}]},{"type":"html","html":"<textarea data-note=\"pb_r\" placeholder=\"Shot mana yang paling berguna bagi editor? Apa akibatnya jika tidak ada insert atau cutaway?\"><\/textarea>"},{"type":"html","html":"<h2>Praktik 3 · Dokumen produksi <span class=\"small\">(10 menit)<\/span><\/h2><p>Tulis script satu adegan dengan scene heading, deskripsi, dan dialog. Turunkan menjadi shot list lima baris dan satu storyboard sederhana. Buat call sheet singkat: waktu, lokasi, daftar kru, dan alat. Bagikan peran kru.<\/p>"},{"type":"checklist","items":[{"id":"pc1","text":"Script ditulis"},{"id":"pc2","text":"Shot list dan storyboard dibuat"},{"id":"pc3","text":"Call sheet dibuat dan peran dibagi"}]},{"type":"html","html":"<textarea data-note=\"pc_r\" placeholder=\"Dokumen mana yang paling sering terlupa dan apa akibatnya di lokasi?\"><\/textarea>"},{"type":"html","html":"<h2>Praktik 4 · Uji kontinuitas <span class=\"small\">(10 menit)<\/span><\/h2><p>Susun shot dari Praktik 1 dan 2 menjadi urutan sederhana di timeline atau secara berurutan di TV. Cari satu kesalahan kontinuitas (arah hadap, properti, cahaya). Cari satu jump cut dan perbaiki dengan mengganti shot. Coba satu cut, satu dissolve, dan satu J-cut jika perangkat lunak tersedia.<\/p>"},{"type":"checklist","items":[{"id":"pd1","text":"Urutan shot disusun"},{"id":"pd2","text":"Kesalahan kontinuitas ditemukan"},{"id":"pd3","text":"Jump cut diperbaiki dan transisi dicoba"}]},{"type":"html","html":"<textarea data-note=\"pd_r\" placeholder=\"Perbaikan mana yang bisa dilakukan di lokasi dan mana yang hanya bisa di penyuntingan?\"><\/textarea>"}]},"kartu":{"blocks":[{"type":"html","html":"<p class=\"lead\">Gejala, penyebab, dan perbaikan yang tidak merusak tujuan naratif. Kartu ini dipakai lagi di Modul 6.<\/p>"},{"type":"cards","items":[{"title":"Tokoh tampak bertukar arah hadap","penyebab":"Kamera menyeberang axis of action","solusi":"Kembali ke satu sisi atau pakai neutral shot"},{"title":"Loncatan pada subjek (jump cut)","penyebab":"Dua shot berurutan terlalu mirip","solusi":"Ubah ukuran atau sudut lebih dari 30° atau sisipkan cutaway"},{"title":"Isi gelas berubah antar-shot","penyebab":"Properti tidak konsisten","solusi":"Catat di log kontinuitas; ulangi take"},{"title":"Bayangan wajah pindah sisi","penyebab":"Arah cahaya berbeda antar-shot","solusi":"Samakan arah dan intensitas cahaya"},{"title":"Suara ruangan hilang","penyebab":"Tidak ada room tone","solusi":"Rekam room tone dan gunakan di penyuntingan"},{"title":"Dokumen tidak lengkap","penyebab":"Storyboard atau call sheet terlupa","solusi":"Cek daftar dokumen sebelum hari syuting"}]},{"type":"html","html":"<h2>Alur 7 langkah<\/h2>"},{"type":"steps","items":[{"title":"Pahami adegan"},{"title":"Tentukan axis"},{"title":"Rencanakan coverage"},{"title":"Atur shot berbeda"},{"title":"Samakan pengaturan"},{"title":"Catat take"},{"title":"Cek monitor"}]},{"type":"two","items":[{"cls":"g","html":"<b>Aturan 180°<\/b><br>Kamera tetap di satu sisi garis aksi"},{"cls":"g","html":"<b>Aturan 30°<\/b><br>Ubah sudut minimal 30° atau ukuran shot"}]}]}}},{"meta":{"id":6,"storageKey":"fke-modul6-mandiri-v1","topKick":"Modul 6","kicker":"Modul 6 · Persiapan TKA 2026","title":"Troubleshooting Terintegrasi","intro":"Menyatukan semua yang dipelajari di Modul 1 sampai 5 menjadi satu keterampilan: mendiagnosis gambar yang bermasalah lalu memilih perbaikan yang tepat.","chips":[{"label":"Memahami","color":"#ffb454"},{"label":"Menerapkan","color":"#7cc0ff"},{"label":"Menalar","color":"#7fe0a8"}],"howto":["<b>1. Tebak dulu, baru baca.<\/b> Tiap bagian dibuka dengan kotak <span class=\"small\">Tebak dulu<\/span>.","<b>2. Cek paham.<\/b> Setelah penjelasan, jawab kotak <span class=\"small\">Cek paham<\/span>.","<b>3. Praktik.<\/b> Bengkel gejala ada di bagian akhir. Fasilitator menyiapkan sabotase terkontrol."],"objectives":["<b>Memahami:<\/b> menyebutkan gejala gangguan visual utama dan penyebabnya; menjelaskan efek samping tiap pengaturan.","<b>Menerapkan:<\/b> memeriksa dan memperbaiki satu masalah gambar dengan urutan intervensi yang tepat.","<b>Menalar:<\/b> menganalisis skenario dan memilih solusi yang menjaga tujuan estetika dan memenuhi kendala; menolak solusi yang merusak tujuan atau melanggar K3."]},"sections":[{"id":"mulai","nav":"Mulai","title":"Troubleshooting Terintegrasi"},{"id":"b1","nav":"Bagian 1","title":"Kerangka diagnosis","time":"15 menit"},{"id":"b2","nav":"Bagian 2","title":"Matriks gejala","time":"25 menit"},{"id":"b3","nav":"Bagian 3","title":"Gejala mirip, penyebab beda","time":"15 menit"},{"id":"b4","nav":"Bagian 4","title":"Tuas dan harga","time":"20 menit"},{"id":"b5","nav":"Bagian 5","title":"Kendala lapangan dan K3","time":"20 menit"},{"id":"b6","nav":"Bagian 6","title":"Strategi menjawab soal skenario","time":"15 menit"},{"id":"latihan","nav":"Latihan","title":"Latihan soal bergaya TKA","time":"25 menit"},{"id":"cek","nav":"Cek akhir","title":"Uji dirimu sendiri","time":"10 menit"},{"id":"praktik","nav":"Praktik","title":"Bengkel gejala","time":"60 menit"},{"id":"kartu","nav":"Kartu","title":"Kartu diagnosis lengkap"}],"sectionQuestions":{"b1":["T1","C11","C12"],"b2":["T2","C21","C22","C23","C24"],"b3":["T3","C31","C32"],"b4":["T4","C41","C42"],"b5":["T5","C51","C52"],"b6":["T6","C61","C62"],"latihan":["S1","S2","S3","S4"],"cek":["L1","L2","L3"]},"praktikChecks":["pa1","pa2","pa3","pa4","pb1","pb2","pb3","pb4","pc1","pc2","pc3","pd1","pd2"],"labs":{},"questions":[{"id":"T1","kind":"pick","label":"T1","stem":"Menaikkan ISO adalah langkah pertama untuk gambar yang kurang terang. Benar atau salah?","bare":true,"opts":[["Benar"],["Salah",1]],"explain":"Salah. Tambah cahaya dulu agar noise tidak bertambah."},{"id":"T2","kind":"pick","label":"T2","stem":"Flicker diatasi dengan menyelaraskan shutter dengan frekuensi listrik 50 Hz. Benar atau salah?","bare":true,"opts":[["Benar",1],["Salah"]],"explain":"Gunakan 1/50 atau 1/100."},{"id":"T3","kind":"pick","label":"T3","stem":"Blur bisa berasal dari fokus, gerak subjek, atau guncangan kamera. Benar atau salah?","bare":true,"opts":[["Benar",1],["Salah"]],"explain":"Uji pembeda diperlukan untuk menentukan penyebabnya."},{"id":"T4","kind":"pick","label":"T4","stem":"Penyuntingan dapat memulihkan highlight yang sudah clipping. Benar atau salah?","bare":true,"opts":[["Benar"],["Salah",1]],"explain":"Salah. Detail yang hilang tidak bisa dipulihkan."},{"id":"T5","kind":"pick","label":"T5","stem":"Solusi yang melanggar K3 tetap boleh jika waktu sangat mendesak. Benar atau salah?","bare":true,"opts":[["Benar"],["Salah",1]],"explain":"Salah. Keselamatan selalu didahulukan."},{"id":"T6","kind":"pick","label":"T6","stem":"Strategi menjawab soal skenario: baca tujuan dan kendala lebih dulu. Benar atau salah?","bare":true,"opts":[["Benar",1],["Salah"]],"explain":"Baca tujuan dan kendala, cari penyebab, lalu nilai opsi."},{"id":"C11","kind":"pick","label":"1.1","stem":"Langkah pertama kerangka diagnosis adalah...","bare":true,"opts":[["Gejala",1],["Penyebab"],["Solusi"]],"explain":"Mulai dari gejala: apa yang tampak salah, di bagian mana, sejak kapan."},{"id":"C12","kind":"pick","label":"1.2","stem":"Langkah terakhir kerangka diagnosis adalah...","bare":true,"opts":[["Verifikasi",1],["Solusi"],["Kategori"]],"explain":"Verifikasi: apakah hasilnya benar-benar membaik."},{"id":"C21","kind":"pick","label":"2.1","stem":"Wajah tampak putih dan zebra menumpuk di kanan. Penyebabnya...","bare":true,"opts":[["Overexposure",1],["Underexposure"],["Noise"]],"explain":"Clipping di area terang."},{"id":"C22","kind":"pick","label":"2.2","stem":"Gambar gelap dan histogram menumpuk di kiri. Solusi pertama...","bare":true,"opts":[["Tambah atau dekatkan cahaya",1],["Naikkan ISO"],["Kurangi shutter"]],"explain":"Tambah cahaya dulu, lalu reflector atau aperture, ISO secukupnya."},{"id":"C23","kind":"pick","label":"2.3","stem":"Warna kuning atau biru merata. Penyebabnya...","bare":true,"opts":[["White balance tidak cocok",1],["Gel salah"],["Lensa kotor"]],"explain":"WB manual atau preset yang sesuai."},{"id":"C24","kind":"pick","label":"2.4","stem":"Warna berbeda di area berbeda. Penyebabnya...","bare":true,"opts":[["Cahaya campuran",1],["WB salah"],["ISO tinggi"]],"explain":"Seragamkan sumber atau pasang gel CTB atau CTO."},{"id":"C31","kind":"pick","label":"3.1","stem":"Blur yang tidak mengikuti arah gerak dan tetap ada saat kamera di tripod menunjukkan...","bare":true,"opts":[["Fokus salah",1],["Motion blur"],["Rolling shutter"]],"explain":"Uji pembeda: pasang di tripod dan fokus ulang."},{"id":"C32","kind":"pick","label":"3.2","stem":"Kedip yang hilang setelah shutter disetel 1/50 menunjukkan...","bare":true,"opts":[["Flicker lampu",1],["Auto exposure hunting"],["WB salah"]],"explain":"Flicker tergantung shutter; auto exposure tidak terpengaruh setelan shutter manual."},{"id":"C41","kind":"pick","label":"4.1","stem":"Tuas yang mengubah DoF adalah...","bare":true,"opts":[["Aperture",1],["Shutter"],["ISO"]],"explain":"Aperture mengubah terang dan DoF."},{"id":"C42","kind":"pick","label":"4.2","stem":"Urutan intervensi eksposur yang disarankan adalah...","bare":true,"opts":[["Cahaya, ND, aperture, ISO",1],["ISO, aperture, cahaya"],["ND, ISO, cahaya"]],"explain":"Cahaya dulu, lalu ND, aperture, ISO secukupnya. Shutter dipertahankan."},{"id":"C51","kind":"pick","label":"5.1","stem":"Jika daya listrik terbatas, solusi paling tepat adalah...","bare":true,"opts":[["Reflector sebagai fill dan dekatkan sumber utama",1],["Tambah lampu"],["Naikkan ISO"]],"explain":"Reflector tidak menambah beban listrik."},{"id":"C52","kind":"pick","label":"5.2","stem":"Jika bahaya K3 bertentangan dengan target siaran, prioritasnya...","bare":true,"opts":[["Keselamatan",1],["Estetika"],["Efisiensi"]],"explain":"Urutan prioritas: keselamatan, tujuan cerita, efisiensi, preferensi."},{"id":"C61","kind":"pick","label":"6.1","stem":"Langkah pertama saat membaca soal skenario adalah...","bare":true,"opts":[["Baca tujuan dan kendala",1],["Lihat opsi"],["Pilih jawaban pertama"]],"explain":"Baca tujuan dan kendala lebih dulu, lalu cari penyebab."},{"id":"C62","kind":"pick","label":"6.2","stem":"Untuk soal pilihan majemuk, caranya adalah...","bare":true,"opts":[["Nilai tiap pernyataan secara terpisah",1],["Pilih satu pernyataan"],["Pilih yang paling panjang"]],"explain":"Jumlah jawaban benar bisa lebih dari satu."},{"id":"S1","kind":"pick","label":"Soal 1 · penalaran · pilihan ganda","stem":"Tim merekam wawancara malam di bawah lampu jalan dengan kamera 25 fps. ISO 6400, f/4, shutter 1/50. Hasil penuh bintik (noise). Sutradara ingin mengurangi noise tanpa mengubah gerak natural dan kedalaman ruang tajam. Tindakan paling tepat adalah...","instant":false,"opts":[["Menaikkan shutter menjadi 1/200.",0,"Merusak gerak natural."],["Menambah cahaya (misalnya lampu LED atau reflector) lalu menurunkan ISO.",1,"Noise disebabkan ISO tinggi karena cahaya kurang; solusinya menambah cahaya lalu menurunkan ISO."],["Menutup aperture menjadi f/11.",0,"Mengubah DoF dan memperparah kekurangan cahaya."],["Memasang ND filter.",0,"Mengurangi cahaya, memperparah."],["Memperlambat shutter menjadi 1/25.",0,"Merusak gerak natural."]]},{"id":"S2","kind":"mcma","label":"Soal 2 · penalaran · pilihan majemuk","stem":"Studio berlampu fluorescent, rekaman 25 fps tampak berkedip dengan pita gelap bergerak dan wajah kehijauan. Kamera memakai shutter 1/60 dan WB Daylight. Tindakan yang tepat adalah...","opts":[["Mengubah shutter menjadi 1/50.",1,"Selaras dengan listrik 50 Hz."],["Mengatur white balance manual atau preset yang sesuai dengan lampu.",1,"Mengatasi warna kehijauan."],["Menaikkan ISO ke 3200.",0,"Tidak menyentuh penyebab."],["Mengganti lampu fluorescent dengan lampu LED flicker-free.",1,"Menghilangkan sumber masalah."],["Mengubah shutter menjadi 1/125.",0,"Tidak selaras dengan 50 Hz."],["Menutup aperture sampai f/16.",0,"Tidak menyentuh penyebab."]]},{"id":"S3","kind":"tf","label":"Soal 3 · penalaran · benar atau salah","stem":"Rekaman pengantin berjalan menunjukkan tiga masalah: gambar bergoyang, bangunan tampak melengkung saat kamera diputar cepat, dan horizon miring saat pan di atas tripod.","opts":[{"t":"Memperlambat gerak pan dapat mengurangi efek melengkung (rolling shutter).","c":true,"why":"Pan lambat mengurangi rolling shutter."},{"t":"Horizon miring saat pan dapat diatasi dengan menaikkan ISO.","c":false,"why":"Horizon miring disebabkan tripod tidak level."},{"t":"Lensa lebar dan jarak dekat dapat mengurangi guncangan yang tampak.","c":true,"why":"Lensa lebar meredam guncangan."}]},{"id":"S4","kind":"pick","label":"Soal 4 · penalaran · pilihan ganda","stem":"Ruang kecil, wajah narasumber gelap. Tujuan DoF dangkal dan gerak natural, daya listrik hampir penuh, terminal sudah penuh. Tindakan paling tepat adalah...","instant":false,"opts":[["Menambah dua lampu pada terminal yang sama.",0,"Membebani terminal; risiko K3."],["Memakai reflector untuk memantulkan cahaya dan mendekatkan lampu utama ke narasumber.",1,"Tidak menambah beban listrik; tidak merusak DoF atau gerak."],["Memperlambat shutter menjadi 1/12.",0,"Merusak gerak natural."],["Menutup aperture menjadi f/16.",0,"Merusak DoF."],["Menaikkan ISO ke batas tertinggi.",0,"Noise berlebihan."]]},{"id":"L1","kind":"pick","label":"Soal L1 · penalaran · pilihan ganda","stem":"Adegan siang terik di luar ruangan, 25 fps, shutter 1/50, ISO 100, f/2.8 (untuk latar blur). Wajah overexposed parah. Tindakan paling tepat tanpa mengubah tujuan estetika adalah...","instant":false,"exam":true,"opts":[["Memasang ND filter.",1,"Mengurangi cahaya tanpa mengubah aperture, shutter, atau WB."],["Shutter menjadi 1/2000.",0,"Merusak gerak natural."],["Menutup aperture ke f/16.",0,"Menghilangkan latar blur."],["Menaikkan ISO ke 800.",0,"Makin overexposed."],["Mengubah white balance.",0,"Bukan masalah warna."]]},{"id":"L2","kind":"mcma","label":"Soal L2 · penalaran · pilihan majemuk","stem":"Wawancara di kantor berlampu fluorescent, kamera 25 fps, shutter 1/60. Muncul pita gelap bergerak. Pilih semua tindakan yang tepat tanpa merusak gerak natural:","exam":true,"opts":[["Mengubah shutter menjadi 1/50.",1,"Selaras dengan 50 Hz dan aturan 180°."],["Mengubah white balance ke 3200 K.",0,"WB mengatur warna, bukan kedipan."],["Mengganti lampu fluorescent dengan LED flicker-free.",1,"Menghilangkan sumber masalah."],["Menaikkan ISO ke 3200.",0,"ISO mengatur terang dan noise."],["Menutup aperture ke f/16.",0,"Aperture mengatur DoF dan terang."],["Menurunkan shutter ke 1/25.",0,"Motion blur berlebih dan melanggar aturan 180°."]]},{"id":"L3","kind":"tf","label":"Soal L3 · penalaran · benar atau salah","stem":"Kamerawan merekam wawancara dengan lensa wide dari jarak sangat dekat, dan hasilnya wajah tampak melebar.","exam":true,"opts":[{"t":"Distorsi wajah disebabkan lensa wide dari jarak sangat dekat.","c":true,"why":"Wide dari jarak dekat melebarkan wajah."},{"t":"Untuk memperbaiki, kamerawan sebaiknya mundur dan memakai lensa lebih panjang.","c":true,"why":"Mundur dan lensa lebih panjang mengurangi distorsi."},{"t":"Menaikkan ISO akan memperbaiki distorsi wajah.","c":false,"why":"ISO tidak mengubah bentuk wajah."}]}],"sectionsContent":{"b1":{"blocks":[{"type":"tebak","ids":["T1"]},{"type":"lead","text":"Lima langkah yang bisa dipakai pada gejala apa pun. Membuat penalaran terarah dan mencegah menebak-nebak."},{"type":"html","html":"<div class=\"flow\"><div><div class=\"n\">1<\/div><div class=\"l\">Gejala<\/div><div class=\"d\">Apa yang tampak salah, di bagian mana, sejak kapan?<\/div><\/div><div><div class=\"n\">2<\/div><div class=\"l\">Kategori<\/div><div class=\"d\">Eksposur, cahaya, warna, optik, komposisi, kontinuitas, atau listrik?<\/div><\/div><div><div class=\"n\">3<\/div><div class=\"l\">Penyebab<\/div><div class=\"d\">Penyebab paling mungkin; uji cepat apa yang membuktikan?<\/div><\/div><div><div class=\"n\">4<\/div><div class=\"l\">Solusi<\/div><div class=\"d\">Memperbaiki penyebab, menjaga tujuan estetika, sesuai kendala.<\/div><\/div><div><div class=\"n\">5<\/div><div class=\"l\">Verifikasi<\/div><div class=\"d\">Histogram, monitor, atau rekam ulang.<\/div><\/div><\/div>"},{"type":"callout","kind":"penting","tag":"Mengobati gejala atau penyebab?","html":"<p>Banyak pengecoh di soal menawarkan solusi yang menutupi gejala tanpa memperbaiki penyebab, misalnya menaikkan ISO untuk gambar gelap padahal cahayanya yang kurang. Selalu tanyakan: <b>apakah solusi ini menyentuh penyebabnya?<\/b><\/p>"},{"type":"cek","ids":["C11","C12"]}]},"b2":{"blocks":[{"type":"tebak","ids":["T2"]},{"type":"lead","text":"Matriks berikut merangkum gejala dari seluruh modul. Gunakan sebagai peta, lalu latih membacanya dari dua arah: dari gejala ke solusi, dan dari solusi ke gejala yang diatasinya."},{"type":"html","html":"<h3>Eksposur, cahaya, dan warna (Modul 1 dan 2)<\/h3>"},{"type":"table","head":["Gejala","Penyebab paling mungkin","Pemeriksaan cepat","Solusi"],"rows":[["Terlalu terang, wajah putih","Overexposure: cahaya berlebih, aperture lebar, atau shutter lambat","Zebra atau histogram menumpuk di kanan","Pakai ND, kecilkan bukaan, kurangi atau jauhkan cahaya, beri diffuser."],["Terlalu gelap","Underexposure: cahaya kurang","Histogram menumpuk di kiri","Tambah atau dekatkan cahaya, reflector, buka aperture, ISO secukupnya."],["Bintik di area gelap","ISO tinggi atau cahaya kurang","Periksa nilai ISO; perbesar gambar","Tambah cahaya lalu turunkan ISO."],["Kedip atau pita gelap bergerak","Shutter tidak selaras dengan listrik 50 Hz","Ubah shutter ke 1/50 atau 1/100","Shutter 1/50 atau 1/100, lampu flicker-free."],["Warna kuning atau biru merata","White balance tidak cocok","Bandingkan dengan kartu putih","WB manual atau preset yang sesuai, atau gel."],["Warna beda di area berbeda","Cahaya campuran","Matikan satu sumber untuk menguji","Seragamkan sumber atau pasang gel CTB atau CTO."]]},{"type":"html","html":"<h3>Fokus, gerak, dan optik (Modul 3 dan 4)<\/h3>"},{"type":"table","head":["Gejala","Penyebab paling mungkin","Pemeriksaan cepat","Solusi"],"rows":[["Seluruh gambar lembut","Fokus salah","Perbesar tampilan dan cek fokus","Fokus ulang; bukaan lebih kecil; cek jarak fokus minimum."],["Objek bergerak buram","Shutter lebih lambat dari aturan 180°","Cek shutter","Setel sekitar 1/(2 × fps) dan tambah cahaya bila perlu."],["Seluruh frame goyang","Tanpa penstabil atau lensa tele handheld","Uji dengan tripod","Lensa lebar dan dekat, stabilisasi, gimbal, teknik jalan."],["Garis miring saat pan cepat","Rolling shutter","Ulang dengan pan lambat","Perlambat gerak dan gunakan stabilisasi."],["Horizon miring","Kamera tidak level","Aktifkan grid atau level","Ratakan tripod dan kepalanya."],["Wajah melebar","Lensa lebar terlalu dekat","Bandingkan dengan lensa lebih panjang","Mundur dan pakai lensa lebih panjang."]]},{"type":"html","html":"<h3>Komposisi, kontinuitas, dan K3 (Modul 2, 3, dan 5)<\/h3>"},{"type":"table","head":["Gejala","Penyebab paling mungkin","Pemeriksaan cepat","Solusi"],"rows":[["Wajah datar dan menyatu dengan latar","Cahaya dari depan saja, tanpa back light","Lihat arah bayangan","Key sekitar 45°, tambah back light dan fill (reflector)."],["Bayangan keras di wajah","Sumber kecil atau jauh, tanpa diffuser","Amati tepi bayangan","Diffuser, dekatkan sumber, reflector sebagai fill."],["Latar ramai atau benda tumbuh dari kepala","Latar tidak diperiksa","Periksa seluruh bingkai","Geser kamera atau subjek; bukaan lebih lebar."],["Subjek terdesak ke tepi","Tidak ada lead room","Cek grid dan arah hadap","Geser subjek atau pan ke arah hadap."],["Tokoh tampak bertukar arah","Kamera menyeberang axis of action","Gambar garis aksi","Kembali ke satu sisi atau pakai neutral shot."],["Loncatan pada subjek","Jump cut","Bandingkan ukuran dan sudut","Ubah ukuran atau sudut lebih dari 30° atau sisipkan cutaway."],["Terminal hangat, kabel melintang","Kelebihan beban dan jalur kabel","Jumlahkan watt dari label","Hitung beban, urai kabel rol, rapikan jalur, beri pemberat stand."]]},{"type":"cek","ids":["C21","C22","C23","C24"]}]},"b3":{"blocks":[{"type":"tebak","ids":["T3"]},{"type":"lead","text":"Soal penalaran sering memakai gejala yang mirip. Kuncinya melakukan uji cepat yang membedakan penyebabnya."},{"type":"table","head":["Gejala","Kemungkinan A","Kemungkinan B","Uji pembeda"],"rows":[["Blur","Fokus salah: area tertentu lembut tanpa arah","Motion blur atau goyang: arah garis mengikuti gerak","Pasang di tripod dan fokus ulang; lihat apakah masih blur."],["Kedip","Flicker lampu: tergantung shutter","Auto exposure yang naik-turun","Setel shutter ke 1/50, lalu setel eksposur manual."],["Warna miring","White balance salah: seluruh gambar","Cahaya campuran: area berbeda","Matikan satu sumber atau bandingkan area."],["Gelap","Underexposure: histogram menumpuk kiri dan banyak noise","Low-key disengaja: ada highlight terkontrol","Tanya tujuan adegan dan periksa histogram."]]},{"type":"cek","ids":["C31","C32"]}]},"b4":{"blocks":[{"type":"tebak","ids":["T4"]},{"type":"lead","text":"Setiap tuas memperbaiki satu hal dan mengorbankan hal lain. Solusi yang benar adalah yang memperbaiki masalah tanpa mengorbankan tujuan adegan."},{"type":"table","head":["Tuas","Yang diperbaiki","Harga atau efek samping"],"rows":[["Aperture","Terang dan DoF","DoF berubah; lensa terbatas bukaannya."],["Shutter speed","Terang dan blur","Di video merusak gerak natural atau menimbulkan flicker."],["ISO","Terang","Noise bertambah."],["ND filter","Menurunkan terang","Butuh alat; tidak menambah terang."],["Cahaya (tambah atau pindah)","Terang, kontras, warna","Butuh daya, waktu, dan memperhatikan K3."],["Jarak sumber cahaya","Intensitas","Kualitas cahaya ikut berubah (keras atau lembut)."],["Lensa dan jarak kamera","Perspektif dan guncangan","Komposisi dan DoF berubah."],["White balance dan gel","Warna","Gel mengurangi cahaya."],["Penstabil dan teknik","Goyangan","Butuh alat; stabilisasi digital memangkas bingkai."],["Editing","Koreksi ringan","Highlight yang clipping tidak bisa dipulihkan; noise ikut terangkat."]]},{"type":"callout","kind":"penting","tag":"Urutan intervensi yang disarankan","html":"<p>Bila gambar kurang terang: tambah atau dekatkan cahaya lebih dulu, lalu buka aperture, lalu naikkan ISO secukupnya. Bila terlalu terang: kurangi cahaya atau pakai ND, lalu kecilkan bukaan. <b>Shutter di video dipertahankan<\/b> sesuai aturan 180° dan frekuensi listrik. Editing adalah jaring pengaman terakhir, bukan solusi utama.<\/p>"},{"type":"cek","ids":["C41","C42"]}]},"b5":{"blocks":[{"type":"tebak","ids":["T5"]},{"type":"lead","text":"Di lapangan, solusi ideal sering tidak tersedia. Prinsip urutannya: <b>keselamatan, lalu tujuan cerita dan estetika, lalu efisiensi, lalu preferensi pribadi.<\/b>"},{"type":"table","head":["Kendala","Strategi"],"rows":[["Daya listrik terbatas","Reflector sebagai fill, dekatkan sumber utama, kurangi jumlah lampu, jangan menumpuk terminal."],["Waktu sempit","Utamakan keselamatan dan eksposur; samakan pengaturan kamera; tunda penyempurnaan estetika."],["Ruang sempit","Lensa lebar, pantulan dari dinding atau reflector, hindari lampu besar di jalur lalu lintas."],["Cuaca terik","Cari tempat teduh, pakai ND dan diffuser, reflector sebagai fill."],["Alat tidak tersedia","Substitusi aman (kain putih tipis sebagai diffuser) dan sesuaikan rencana shot."],["Bahaya K3 bertentangan dengan target siaran","Hentikan sumber bahaya pada jeda yang tersedia (misalnya jeda iklan) tanpa menurunkan standar keselamatan."]]},{"type":"cek","ids":["C51","C52"]}]},"b6":{"blocks":[{"type":"tebak","ids":["T6"]},{"type":"lead","text":"Enam langkah yang bisa dipakai untuk setiap soal penalaran lintas topik."},{"type":"steps","items":[{"title":"Baca tujuan dan kendala lebih dulu","desc":"Garisbawahi (misalnya latar blur, gerak natural, daya terbatas)."},{"title":"Tentukan gejala dan penyebabnya","desc":"Sebelum melihat opsi, agar tidak terpengaruh pengecoh."},{"title":"Uji tiap opsi dengan tiga pertanyaan","desc":"Apakah memperbaiki penyebab, apakah merusak tujuan, apakah melanggar kendala atau K3?"},{"title":"Coret opsi yang merusak tujuan atau berbahaya","desc":"Walau tampak benar secara teknis."},{"title":"Pada soal pilihan majemuk","desc":"Nilai tiap pernyataan secara terpisah; jumlah jawaban benar bisa lebih dari satu."},{"title":"Pada soal benar atau salah","desc":"Nilai tiap pernyataan sendiri-sendiri dan hati-hati terhadap kata mutlak seperti selalu atau pasti."}]},{"type":"callout","kind":"waspada","tag":"Jebakan yang sering muncul","html":"<ul><li>Solusi yang memperbaiki gejala tetapi merusak tujuan estetika (misalnya menutup aperture sehingga latar tidak lagi blur).<\/li><li>Solusi yang mengubah shutter di video untuk mengatur terang.<\/li><li>Solusi yang mengandalkan penyuntingan untuk masalah yang tidak bisa dipulihkan.<\/li><li>Solusi yang melanggar K3 demi mengejar waktu.<\/li><\/ul>"},{"type":"html","html":"<h2>Daftar periksa 60 detik sebelum merekam<\/h2>"},{"type":"table","head":["Bagian","Yang diperiksa"],"rows":[["Kamera","Frame rate dan shutter (aturan 180° dan 50 Hz), aperture, ISO, ND, white balance, fokus."],["Cahaya","Arah dan kualitas, uji flicker, histogram atau zebra, warna sumber seragam."],["Komposisi","Horizon, headroom, lead room, latar bersih, ukuran shot dan angle sesuai rencana."],["Gerak","Tripod terkunci dan level, stabilisasi aktif, jalur gerak bersih."],["Kontinuitas","Sisi garis aksi, properti dan kostum, clapper board terisi."],["Keselamatan dan media","Beban listrik dan kabel, stand aman, baterai dan kartu memori cukup."]]},{"type":"cek","ids":["C61","C62"]}]},"latihan":{"blocks":[{"type":"callout","kind":"penting","tag":"Strategi menjawab","html":"<p>Soal penalaran menilai alasan di balik pilihanmu.<\/p>"},{"type":"qlist","ids":["S1","S2","S3","S4"]}]},"cek":{"blocks":[{"type":"callout","kind":"penting","tag":"Cara mengerjakan","html":"<p>Pembahasan terbuka setelah ketiga soal dikunci.<\/p>"},{"type":"qlist","ids":["L1","L2","L3"]}]},"praktik":{"blocks":[{"type":"panel","html":"<b>Gear:<\/b> Canon 750D, Sony A6600, Nikon D5500, Panasonic HC-X2000, GVM 800D, bohlam LED Philips, reflector, set CTO-CTB, Feelworld 7\", TV 32\", lembar diagnosis."},{"type":"callout","kind":"waspada","tag":"Keselamatan","html":"<ul><li>Sabotase terkontrol hanya berupa pengaturan kamera atau komposisi.<\/li><li>Stasiun K3 tidak menyalakan beban listrik berlebihan; gunakan foto atau susunan peralatan tanpa daya menyala.<\/li><li>Fasilitator memastikan jalur kabel bersih dan stand aman di semua stasiun.<\/li><\/ul>"},{"type":"html","html":"<h2>Praktik 1 · Bengkel gejala <span class=\"small\">(30 menit)<\/span><\/h2><p>Empat stasiun berputar, masing-masing 7 menit:<\/p><ul><li><b>A. Eksposur:<\/b> kamera diatur ISO tinggi dan aperture berlebihan; siswa memperbaiki dengan urutan intervensi.<\/li><li><b>B. Flicker dan warna:<\/b> Sony A6600 pada 25 fps dengan shutter 1/60 di bawah bohlam LED, WB Daylight; siswa memperbaiki shutter dan WB.<\/li><li><b>C. Gerak:<\/b> Canon 750D dengan lensa tele handheld dan pan cepat; siswa menemukan solusi (lensa lebar, stabilisasi, pan lambat).<\/li><li><b>D. Komposisi dan kontinuitas:<\/b> klip pendek dengan headroom keliru dan axis yang dilanggar; siswa menandai dan mengusulkan perbaikan.<\/li><\/ul>"},{"type":"checklist","items":[{"id":"pa1","text":"Stasiun A: eksposur didiagnosis"},{"id":"pa2","text":"Stasiun B: flicker dan warna didiagnosis"},{"id":"pa3","text":"Stasiun C: gerak didiagnosis"},{"id":"pa4","text":"Stasiun D: komposisi dan kontinuitas didiagnosis"}]},{"type":"html","html":"<textarea data-note=\"pa_r\" placeholder=\"Gejala mana yang paling mudah dikira penyebabnya salah? Apa uji cepat yang paling berguna?\"><\/textarea>"},{"type":"html","html":"<h2>Praktik 2 · Perbaikan end-to-end <span class=\"small\">(15 menit)<\/span><\/h2><p>Tiap tim memilih satu kasus dari bengkel. Rekam kondisi sebelum (10 detik). Perbaiki dengan urutan intervensi dan catat tiap perubahan. Verifikasi dengan histogram atau monitor, lalu rekam kondisi sesudah. Putar sebelum dan sesudah di TV.<\/p>"},{"type":"checklist","items":[{"id":"pb1","text":"Kondisi sebelum direkam"},{"id":"pb2","text":"Perbaikan dilakukan dengan urutan intervensi"},{"id":"pb3","text":"Verifikasi dengan histogram atau monitor"},{"id":"pb4","text":"Sebelum dan sesudah dibandingkan"}]},{"type":"html","html":"<textarea data-note=\"pb_r\" placeholder=\"Apakah ada perbaikan lain yang lebih baik, dan apa efek sampingnya?\"><\/textarea>"},{"type":"html","html":"<h2>Praktik 3 · Menulis soal skenario <span class=\"small\">(10 menit)<\/span><\/h2><p>Tiap tim menulis satu soal skenario dari kasus yang diperbaiki (gejala, tujuan, kendala). Tulis satu jawaban benar dan tiga pengecoh yang tampak benar tetapi merusak tujuan. Tukar dengan tim lain.<\/p>"},{"type":"checklist","items":[{"id":"pc1","text":"Soal skenario ditulis"},{"id":"pc2","text":"Pengecoh ditulis dengan alasan salahnya"},{"id":"pc3","text":"Soal ditukar dan dijawab tim lain"}]},{"type":"html","html":"<textarea data-note=\"pc_r\" placeholder=\"Mengapa pengecoh yang baik terasa meyakinkan?\"><\/textarea>"},{"type":"html","html":"<h2>Praktik 4 · Daftar periksa 60 detik <span class=\"small\">(5 menit)<\/span><\/h2><p>Tiap tim menjalankan daftar periksa pada satu setup dalam 60 detik. Tim lain menilai apakah ada yang terlewat.<\/p>"},{"type":"checklist","items":[{"id":"pd1","text":"Daftar periksa dijalankan dalam 60 detik"},{"id":"pd2","text":"Tim lain menilai"}]},{"type":"html","html":"<textarea data-note=\"pd_r\" placeholder=\"Butir mana yang paling sering terlupa?\"><\/textarea>"}]},"kartu":{"blocks":[{"type":"html","html":"<p class=\"lead\">Rangkuman seluruh modul untuk dipakai di Modul 7 dan saat try-out.<\/p>"},{"type":"cards","items":[{"title":"Kerangka diagnosis","penyebab":"Langkah: 1. Gejala · 2. Kategori · 3. Penyebab · 4. Solusi · 5. Verifikasi","solusi":"Kunci: Perbaiki penyebab, bukan hanya gejala."},{"title":"Urutan intervensi eksposur","penyebab":"Kurang terang: Cahaya → aperture → ISO secukupnya. Terlalu terang: Cahaya atau ND → aperture.","solusi":"Shutter dipertahankan sesuai aturan 180° dan frekuensi listrik."},{"title":"Prioritas","penyebab":"Urutan: Keselamatan → tujuan cerita dan estetika → efisiensi → preferensi pribadi","solusi":"Keselamatan tidak boleh dikorbankan."},{"title":"Empat salah kaprah","penyebab":"1. Setiap masalah diselesaikan dengan mengubah ISO. 2. Solusi benar adalah yang paling cepat.","solusi":"3. Editing bisa memperbaiki semuanya. 4. Kendala di soal tidak penting."}]},{"type":"html","html":"<h2>Alur 5 langkah diagnosis<\/h2>"},{"type":"steps","items":[{"title":"Gejala","desc":"Apa yang tampak salah, di bagian mana, sejak kapan?"},{"title":"Kategori","desc":"Eksposur, cahaya, warna, optik, komposisi, kontinuitas, atau listrik?"},{"title":"Penyebab","desc":"Penyebab paling mungkin; uji cepat apa yang membuktikan?"},{"title":"Solusi","desc":"Memperbaiki penyebab, menjaga tujuan, sesuai kendala."},{"title":"Verifikasi","desc":"Histogram, monitor, atau rekam ulang."}]}]}}},{"meta":{"id":7,"storageKey":"fke-modul7-mandiri-v1","topKick":"Modul 7","kicker":"Modul 7 · Persiapan TKA 2026","title":"Simulasi dan Try-out TKA","intro":"Simulasi ujian TKA dengan 25 soal pilihan ganda, majemuk, dan benar-salah. Waktu pengerjaan 60 menit.","chips":[{"label":"Memahami","color":"#ffb454"},{"label":"Menerapkan","color":"#7cc0ff"},{"label":"Menalar","color":"#7fe0a8"}],"howto":["<b>1. Orientasi.<\/b> Baca aturan penskoran dan durasi.","<b>2. Try-out.<\/b> Kerjakan 25 soal sekaligus dengan waktu 60 menit.","<b>3. Rekap.<\/b> Analisis skor per modul untuk melihat bagian yang perlu diulang."],"objectives":["<b>Memahami:<\/b> mengukur kesiapan TKA.","<b>Menerapkan:<\/b> mengerjakan simulasi ujian.","<b>Menalar:<\/b> mengidentifikasi kelemahan dan merencanakan remedial."]},"sections":[{"id":"mulai","nav":"Mulai","title":"Simulasi dan Try-out TKA"},{
